name: OgreNext-first native Release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-suite-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (GCC 11)
            runner: ubuntu-22.04
            platform: linux-x86_64
            profile: cmake/conan/profiles/linux-x86_64-release
            compiler: gcc11
            cc: gcc-11
            cxx: g++-11
            artifact: Rigs-of-Rods-Linux-x86_64-OgreNext-first
          - name: Windows x64 (MSVC 19.44)
            # VS 17 is required by pinned v143 Conan recipes. GitHub's
            # windows-2025 label moved to the VS 18 image in June 2026.
            runner: windows-2022
            platform: windows-x86_64
            profile: cmake/conan/profiles/windows-x86_64-release
            compiler: msvc1944
            cc: cl
            cxx: cl
            artifact: Rigs-of-Rods-Windows-x64-OgreNext-first
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CONAN_HOME: ${{ github.workspace }}/.ci-conan/${{ matrix.platform }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enable the pinned MSVC x64 toolset
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"

      - name: Install Linux build and software-rendering prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            file \
            gcc-11 \
            g++-11 \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxaw7-dev \
            libxrandr-dev \
            mesa-utils \
            xauth \
            xvfb

      - name: Restore pinned Blender 5.2 authoring archive
        if: matrix.platform == 'linux-x86_64'
        id: storefront-blender-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/blender-authoring/blender-5.2.0-linux-x64.tar.xz
          key: blender-5.2.0-linux-x64-96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48

      - name: Download pinned Blender 5.2 authoring archive
        if: >-
          matrix.platform == 'linux-x86_64' &&
          steps.storefront-blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -E make_directory "$RUNNER_TEMP/blender-authoring"
          archive="$RUNNER_TEMP/blender-authoring/blender-5.2.0-linux-x64.tar.xz"
          if ! curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --output "$archive" \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          then
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --output "$archive" \
              https://mirrors.aliyun.com/blender/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          fi

      - name: Verify and extract pinned Blender 5.2
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/blender-authoring/blender-5.2.0-linux-x64.tar.xz"
          echo \
            "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  $archive" \
            | sha256sum --check -
          cmake -E remove_directory \
            "$RUNNER_TEMP/blender-5.2.0-linux-x64"
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/blender-5.2.0-linux-x64/blender"
          blender_version="$(
            "$RUNNER_TEMP/blender-5.2.0-linux-x64/blender" --version
          )"
          test "${blender_version%%$'\n'*}" = "Blender 5.2.0 LTS"

      - name: Install pinned Conan and Ninja clients
        shell: bash
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}
          key: ogre14-native-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.platform }}-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**') }}

      - name: Configure isolated Conan client
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          home = Path(os.environ["CONAN_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          (home / "global.conf").write_text(
              "tools.system.package_manager:mode=install\n"
              "tools.system.package_manager:sudo=True\n"
              'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n',
              encoding="utf-8",
          )
          PY
          conan remote add \
            conancenter https://center2.conan.io --force
          conan remote add \
            rigs-of-rods-deps \
            https://nexus.anotherfoxguy.com/repository/rigs-of-rods/ \
            --force
          conan --version
          ninja --version

      - name: Verify native compiler identity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(gcc-11 -dumpfullversion | cut -d. -f1)" = "11"
          test "$(g++-11 -dumpfullversion | cut -d. -f1)" = "11"
          gcc-11 --version
          g++-11 --version

      - name: Verify native compiler identity
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -E make_directory artifacts
          cl 2>&1 | tee artifacts/msvc-version.txt || true
          grep -E "Version 19\\.44\\." artifacts/msvc-version.txt

      - name: Run fail-closed platform contract tests
        shell: bash
        run: |
          python -m unittest discover \
            -s tests/tools \
            -p 'test_*ogre14*.py'
          python -O -m unittest discover \
            -s tests/tools \
            -p 'test_*ogre14*.py'
          python tests/tools/test_ogre_next_product_packaging_contract.py
          python -O tests/tools/test_ogre_next_product_packaging_contract.py

      - name: Verify the locked native Conan graph
        shell: bash
        run: |
          cmake -E make_directory artifacts
          python tests/tools/assert_ogre14_app_graph.py \
            --platform "${{ matrix.platform }}" \
            | tee "artifacts/${{ matrix.platform }}-conan-graph.json"

      - name: Configure OgreNext-first native Release
        shell: bash
        run: |
          cmake \
            -S . \
            -B "build-ogre14-${{ matrix.platform }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/stage-ogre14-${{ matrix.platform }}" \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DCONAN_HOST_PROFILE="${GITHUB_WORKSPACE}/${{ matrix.profile }}" \
            -DCONAN_BUILD_PROFILE="${GITHUB_WORKSPACE}/${{ matrix.profile }}" \
            -DROR_BUILD_TESTS=ON \
            -DROR_CREATE_CONTENT_FOLDER=ON

      - name: Build native application and tests
        shell: bash
        run: >-
          cmake
          --build "build-ogre14-${{ matrix.platform }}"
          --target all
          --config Release

      - name: Build automatic texture native lifecycle gate
        shell: bash
        run: >-
          cmake
          --build "build-ogre14-${{ matrix.platform }}"
          --target ror_ogre_next_demo_material_source_native_tests
          --config Release

      - name: Run exact automatic texture host gates
        shell: bash
        run: |
          ctest \
            --test-dir "build-ogre14-${{ matrix.platform }}" \
            --build-config Release \
            --output-on-failure \
            --no-tests=error \
            -R '^ogre14_source_texture_decoder$'
          ctest \
            --test-dir "build-ogre14-${{ matrix.platform }}" \
            --build-config Release \
            --output-on-failure \
            --no-tests=error \
            -R '^ogre14_authenticated_texture_receipt$'
          ctest \
            --test-dir "build-ogre14-${{ matrix.platform }}" \
            --build-config Release \
            --output-on-failure \
            --no-tests=error \
            -R '^ogre14_selected_texture_source$'
          ctest \
            --test-dir "build-ogre14-${{ matrix.platform }}" \
            --build-config Release \
            --output-on-failure \
            --no-tests=error \
            -R '^ogre_next_demo_material_source_native$'
          ctest \
            --test-dir "build-ogre14-${{ matrix.platform }}" \
            --build-config Release \
            --output-on-failure \
            --no-tests=error \
            -R '^ogre14_authenticated_material_script_native_integration$'

      - name: Prove storefront outputs from two artifact-free roots
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          mapfile -t converter_candidates < <(
            find "$CONAN_HOME" \
              -type f \
              -path '*/p/bin/OgreXMLConverter' \
              -perm -111 \
              -print
          )
          if [[ "${#converter_candidates[@]}" -ne 1 ]]
          then
            printf \
              'expected one packaged OgreXMLConverter, found %s\n' \
              "${#converter_candidates[@]}" >&2
            printf '%s\n' "${converter_candidates[@]}" >&2
            exit 1
          fi
          converter="${converter_candidates[0]}"
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python tools/verify_cityworld_storefront_clean_reproducibility.py \
              --repo-root . \
              --blender \
              "$RUNNER_TEMP/blender-5.2.0-linux-x64/blender" \
              --converter "$converter" \
              --diagnostics-directory \
              artifacts/linux-x86_64-storefront-clean-failure \
              --generation-timeout 600 \
              --generation-workers 1 \
            | tee artifacts/linux-x86_64-storefront-clean-reproducibility.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/linux-x86_64-storefront-clean-reproducibility.json"
              ).read_text(encoding="utf-8")
          )
          if (
              report.get("valid") is not True
              or report.get("variants") != 5
              or report.get("outputs") != 35
              or report.get("mismatches") != []
          ):
              raise SystemExit(f"invalid clean reproducibility report: {report!r}")
          PY

      - name: Run native test suite
        shell: bash
        run: >-
          ctest
          --test-dir "build-ogre14-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure

      - name: Install and relocate native runtime
        shell: bash
        run: |
          cmake --install \
            "build-ogre14-${{ matrix.platform }}" \
            --config Release \
            --prefix "${GITHUB_WORKSPACE}/stage-ogre14-${{ matrix.platform }}"
          cmake -E make_directory artifacts
          cmake -E rename \
            "stage-ogre14-${{ matrix.platform }}" \
            "artifacts/runtime-${{ matrix.platform }}"

      - name: Verify relocated OgreNext child and exact media closure
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "linux-x86_64" ]]; then
            policy="linux-x86_64-vulkan"
          else
            policy="windows-x64-d3d11"
          fi
          python tools/ogre_next_probe/package_ogre_next_product.py \
            verify \
            --root "artifacts/runtime-${{ matrix.platform }}" \
            --platform-policy "$policy"

      - name: Audit relocated Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python tools/ogre14_runtime_audit.py \
              --root "artifacts/runtime-${{ matrix.platform }}" \
              --platform "${{ matrix.platform }}" \
              --forbidden-prefix "$GITHUB_WORKSPACE" \
              --forbidden-prefix "$CONAN_HOME" \
              --load-plugins \
              --smoke \
              --log-dir "artifacts/logs-${{ matrix.platform }}" \
              --report "artifacts/${{ matrix.platform }}-runtime-audit.json" \
            2>&1 | tee \
              "artifacts/${{ matrix.platform }}-runtime-audit.log"

      - name: Audit relocated Windows runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python tools/ogre14_runtime_audit.py \
            --root "artifacts/runtime-${{ matrix.platform }}" \
            --platform "${{ matrix.platform }}" \
            --forbidden-prefix "$GITHUB_WORKSPACE" \
            --forbidden-prefix "$CONAN_HOME" \
            --load-plugins \
            --smoke \
            --log-dir "artifacts/logs-${{ matrix.platform }}" \
            --report "artifacts/${{ matrix.platform }}-runtime-audit.json" \
            2>&1 | tee \
              "artifacts/${{ matrix.platform }}-runtime-audit.log"

      - name: Render ten frames with relocated Linux GL3Plus
        if: runner.os == 'Linux'
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          ROR_D0_SCENE_HOME: ${{ github.workspace }}/artifacts/native-runtime-smoke-${{ matrix.platform }}
        run: |
          cmake -E make_directory "$ROR_D0_SCENE_HOME"
          xvfb-run -a \
            -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            python tools/ogre14_native_runtime_smoke.py \
              --root "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}" \
              --platform "${{ matrix.platform }}" \
              --log-root "$ROR_D0_SCENE_HOME" \
              --timeout 120 \
            2>&1 | tee "$ROR_D0_SCENE_HOME/driver.log"

      - name: Render ten frames with relocated Windows D3D11
        if: runner.os == 'Windows'
        shell: bash
        env:
          ROR_D0_SCENE_HOME: ${{ github.workspace }}/artifacts/native-runtime-smoke-${{ matrix.platform }}
        run: |
          cmake -E make_directory "$ROR_D0_SCENE_HOME"
          python tools/ogre14_native_runtime_smoke.py \
            --root "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}" \
            --platform "${{ matrix.platform }}" \
            --log-root "$ROR_D0_SCENE_HOME" \
            --timeout 120 \
            2>&1 | tee "$ROR_D0_SCENE_HOME/driver.log"

      # Hosted runners prove the native renderer/API and deterministic scene
      # contract. They do not constitute physical GPU or vendor performance
      # acceptance.
      - name: Drive CityWorld LED streetlight with relocated Linux GL3Plus
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a \
            -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            python tools/run_cityworld_led_streetlight_scene.py \
              --executable "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/RunRoR" \
              --repository "${GITHUB_WORKSPACE}" \
              --runtime-content "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/content" \
              --artifact-dir "${GITHUB_WORKSPACE}/artifacts/cityworld-led-streetlight-${{ matrix.platform }}" \
              --timeout 360 \
            2>&1 | tee \
              "artifacts/cityworld-led-streetlight-${{ matrix.platform }}.driver.log"

      - name: Drive CityWorld LED streetlight with relocated Windows D3D11
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          python tools/run_cityworld_led_streetlight_scene.py \
            --executable "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/RoR.exe" \
            --repository "${GITHUB_WORKSPACE}" \
            --runtime-content "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/content" \
            --artifact-dir "${GITHUB_WORKSPACE}/artifacts/cityworld-led-streetlight-${{ matrix.platform }}" \
            --timeout 360 \
            2>&1 | tee \
              "artifacts/cityworld-led-streetlight-${{ matrix.platform }}.driver.log"

      - name: Render collisionless bridge streetlight with relocated Linux GL3Plus
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a \
            -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            python tools/run_cityworld_bridge_streetlight_scene.py \
              --executable "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/RunRoR" \
              --repository "${GITHUB_WORKSPACE}" \
              --runtime-content "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/content" \
              --artifact-dir "${GITHUB_WORKSPACE}/artifacts/cityworld-bridge-streetlight-${{ matrix.platform }}" \
              --timeout 360 \
            2>&1 | tee \
              "artifacts/cityworld-bridge-streetlight-${{ matrix.platform }}.driver.log"

      - name: Render collisionless bridge streetlight with relocated Windows D3D11
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          python tools/run_cityworld_bridge_streetlight_scene.py \
            --executable "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/RoR.exe" \
            --repository "${GITHUB_WORKSPACE}" \
            --runtime-content "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/content" \
            --artifact-dir "${GITHUB_WORKSPACE}/artifacts/cityworld-bridge-streetlight-${{ matrix.platform }}" \
            --timeout 360 \
            2>&1 | tee \
              "artifacts/cityworld-bridge-streetlight-${{ matrix.platform }}.driver.log"

      - name: Drive CityWorld bridge with relocated Linux GL3Plus and V0A
        if: runner.os == 'Linux'
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a \
            -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            python tools/run_cityworld_bridge_scene.py \
              --executable "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/RunRoR" \
              --repository "${GITHUB_WORKSPACE}" \
              --runtime-content "${GITHUB_WORKSPACE}/artifacts/runtime-${{ matrix.platform }}/content" \
              --artifact-dir "${GITHUB_WORKSPACE}/artifacts/cityworld-bridge-${{ matrix.platform }}" \
              --postprocess-mode v0a \
              --timeout 300 \
            2>&1 | tee \
              "artifacts/cityworld-bridge-${{ matrix.platform }}.driver.log"

      - name: Stage Windows CityWorld crash symbols and enable LocalDumps
        id: windows-cityworld-crash-evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/cityworld-bridge-crash-evidence-${{ matrix.platform }}"
          $symbolRoot = Join-Path $evidenceRoot "symbols"
          New-Item -ItemType Directory -Force -Path $symbolRoot | Out-Null

          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "build-ogre14-${{ matrix.platform }}"
          $pdb = Join-Path $buildRoot "bin/RoR-Ogre14.pdb"
          if (-not (Test-Path -LiteralPath $pdb -PathType Leaf)) {
            throw "Production RoR-Ogre14.pdb is missing: $pdb"
          }
          $copiedPdb = Join-Path $symbolRoot "RoR-Ogre14.pdb"
          Copy-Item -LiteralPath $pdb -Destination $copiedPdb

          $executable = Join-Path $env:GITHUB_WORKSPACE "artifacts/runtime-${{ matrix.platform }}/RoR-Ogre14.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Relocated RoR-Ogre14.exe is missing: $executable"
          }
          $symbolRecord = [ordered]@{
            format = "ror-windows-native-symbol-evidence-v1"
            repository_commit = (git rev-parse HEAD).Trim()
            executable = "runtime-${{ matrix.platform }}/RoR-Ogre14.exe"
            executable_sha256 = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
            pdb = "symbols/RoR-Ogre14.pdb"
            pdb_sha256 = (Get-FileHash -LiteralPath $copiedPdb -Algorithm SHA256).Hash.ToLowerInvariant()
            pdb_source = $pdb
          }
          $symbolJson = $symbolRecord | ConvertTo-Json
          Set-Content -LiteralPath (Join-Path $evidenceRoot "symbols.json") -Value $symbolJson -Encoding utf8

          $werKey = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\RoR-Ogre14.exe"
          New-Item -Path $werKey -Force | Out-Null
          New-ItemProperty -Path $werKey -Name "DumpCount" -PropertyType DWord -Value 8 -Force | Out-Null
          New-ItemProperty -Path $werKey -Name "DumpType" -PropertyType DWord -Value 2 -Force | Out-Null

      - name: Drive CityWorld bridge with relocated Windows D3D11 async physics and V0A
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/cityworld-bridge-crash-evidence-${{ matrix.platform }}"
          $dumpDir = Join-Path $evidenceRoot "dumps/async"
          $sceneArtifact = Join-Path $env:GITHUB_WORKSPACE "artifacts/cityworld-bridge-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $werKey = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\RoR-Ogre14.exe"
          New-ItemProperty -Path $werKey -Name "DumpFolder" -PropertyType ExpandString -Value $dumpDir -Force | Out-Null

          $driverStdout = Join-Path $evidenceRoot "async-driver.stdout.log"
          $driverStderr = Join-Path $evidenceRoot "async-driver.stderr.log"
          $arguments = @(
            "tools/run_cityworld_bridge_scene.py",
            "--executable",
            "$env:GITHUB_WORKSPACE/artifacts/runtime-${{ matrix.platform }}/RoR.exe",
            "--repository",
            "$env:GITHUB_WORKSPACE",
            "--runtime-content",
            "$env:GITHUB_WORKSPACE/artifacts/runtime-${{ matrix.platform }}/content",
            "--artifact-dir",
            $sceneArtifact,
            "--postprocess-mode",
            "v0a",
            "--physics-mode",
            "async",
            "--timeout",
            "300"
          )
          $process = Start-Process -FilePath "python" -ArgumentList $arguments -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $driverStdout -RedirectStandardError $driverStderr -NoNewWindow -PassThru -Wait
          $stdoutText = Get-Content -LiteralPath $driverStdout -Raw
          $stderrText = Get-Content -LiteralPath $driverStderr -Raw
          $stdoutText | Write-Host
          $stderrText | Write-Host
          @(
            "[driver stdout]",
            $stdoutText,
            "[driver stderr]",
            $stderrText
          ) | Set-Content -LiteralPath "artifacts/cityworld-bridge-${{ matrix.platform }}.driver.log" -Encoding utf8
          $processDiagnostic = Join-Path $sceneArtifact "diagnostics/runtime-process.json"
          $executable = Join-Path $env:GITHUB_WORKSPACE "artifacts/runtime-${{ matrix.platform }}/RoR-Ogre14.exe"
          $pdb = Join-Path $evidenceRoot "symbols/RoR-Ogre14.pdb"
          $manifest = Join-Path $evidenceRoot "async-dumps.json"
          & python tools/collect_windows_cityworld_crash_evidence.py --mode async --driver-exit-code $process.ExitCode --process-diagnostic $processDiagnostic --dump-dir $dumpDir --executable $executable --pdb $pdb --output $manifest --poll-attempts 40 --poll-interval-ms 250
          $evidenceExitCode = $LASTEXITCODE
          if ($evidenceExitCode -ne 0) {
            Write-Error "Async CityWorld crash evidence gate failed with $evidenceExitCode" -ErrorAction Continue
            exit $evidenceExitCode
          }
          exit $process.ExitCode

      - name: Isolate CityWorld bridge with relocated Windows D3D11 sync physics and V0A
        if: >-
          ${{ !cancelled() && runner.os == 'Windows' &&
          steps.windows-cityworld-crash-evidence.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/cityworld-bridge-crash-evidence-${{ matrix.platform }}"
          $dumpDir = Join-Path $evidenceRoot "dumps/sync"
          $sceneArtifact = Join-Path $env:GITHUB_WORKSPACE "artifacts/cityworld-bridge-sync-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $werKey = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\RoR-Ogre14.exe"
          New-ItemProperty -Path $werKey -Name "DumpFolder" -PropertyType ExpandString -Value $dumpDir -Force | Out-Null

          $driverStdout = Join-Path $evidenceRoot "sync-driver.stdout.log"
          $driverStderr = Join-Path $evidenceRoot "sync-driver.stderr.log"
          $arguments = @(
            "tools/run_cityworld_bridge_scene.py",
            "--executable",
            "$env:GITHUB_WORKSPACE/artifacts/runtime-${{ matrix.platform }}/RoR.exe",
            "--repository",
            "$env:GITHUB_WORKSPACE",
            "--runtime-content",
            "$env:GITHUB_WORKSPACE/artifacts/runtime-${{ matrix.platform }}/content",
            "--artifact-dir",
            $sceneArtifact,
            "--postprocess-mode",
            "v0a",
            "--physics-mode",
            "sync",
            "--timeout",
            "300"
          )
          $process = Start-Process -FilePath "python" -ArgumentList $arguments -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $driverStdout -RedirectStandardError $driverStderr -NoNewWindow -PassThru -Wait
          $stdoutText = Get-Content -LiteralPath $driverStdout -Raw
          $stderrText = Get-Content -LiteralPath $driverStderr -Raw
          $stdoutText | Write-Host
          $stderrText | Write-Host
          @(
            "[driver stdout]",
            $stdoutText,
            "[driver stderr]",
            $stderrText
          ) | Set-Content -LiteralPath "artifacts/cityworld-bridge-sync-${{ matrix.platform }}.driver.log" -Encoding utf8
          $processDiagnostic = Join-Path $sceneArtifact "diagnostics/runtime-process.json"
          $executable = Join-Path $env:GITHUB_WORKSPACE "artifacts/runtime-${{ matrix.platform }}/RoR-Ogre14.exe"
          $pdb = Join-Path $evidenceRoot "symbols/RoR-Ogre14.pdb"
          $manifest = Join-Path $evidenceRoot "sync-dumps.json"
          & python tools/collect_windows_cityworld_crash_evidence.py --mode sync --driver-exit-code $process.ExitCode --process-diagnostic $processDiagnostic --dump-dir $dumpDir --executable $executable --pdb $pdb --output $manifest --poll-attempts 40 --poll-interval-ms 250
          $evidenceExitCode = $LASTEXITCODE
          if ($evidenceExitCode -ne 0) {
            Write-Error "Sync CityWorld crash evidence gate failed with $evidenceExitCode" -ErrorAction Continue
            exit $evidenceExitCode
          }
          exit $process.ExitCode

      - name: Disable Windows CityWorld LocalDumps override
        if: >-
          ${{ !cancelled() && runner.os == 'Windows' &&
          steps.windows-cityworld-crash-evidence.outcome == 'success' }}
        shell: pwsh
        run: |
          $werKey = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\RoR-Ogre14.exe"
          Remove-Item -LiteralPath $werKey -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload runtime, audit, and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/runtime-${{ matrix.platform }}
            artifacts/logs-${{ matrix.platform }}
            artifacts/native-runtime-smoke-${{ matrix.platform }}
            artifacts/cityworld-led-streetlight-${{ matrix.platform }}
            artifacts/cityworld-led-streetlight-${{ matrix.platform }}.driver.log
            artifacts/cityworld-bridge-streetlight-${{ matrix.platform }}
            artifacts/cityworld-bridge-streetlight-${{ matrix.platform }}.driver.log
            artifacts/cityworld-bridge-${{ matrix.platform }}
            artifacts/cityworld-bridge-${{ matrix.platform }}.driver.log
            artifacts/cityworld-bridge-sync-${{ matrix.platform }}
            artifacts/cityworld-bridge-sync-${{ matrix.platform }}.driver.log
            artifacts/cityworld-bridge-crash-evidence-${{ matrix.platform }}
            artifacts/${{ matrix.platform }}-conan-graph.json
            artifacts/${{ matrix.platform }}-runtime-audit.json
            artifacts/${{ matrix.platform }}-runtime-audit.log
            artifacts/${{ matrix.platform }}-storefront-clean-reproducibility.json
            artifacts/${{ matrix.platform }}-storefront-clean-failure
            artifacts/msvc-version.txt
            build-ogre14-${{ matrix.platform }}/CMakeCache.txt
            build-ogre14-${{ matrix.platform }}/CMakeFiles/CMakeConfigureLog.yaml
            build-ogre14-${{ matrix.platform }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove transient Conan build material
        if: always()
        shell: bash
        run: conan cache clean "*" --source --build --download
