name: OGRE-Next isolated raster probe

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/ogre-next-probe.yml
      - tools/ogre_next_probe/**
      - tools/run_ogre_next_probe.py
      - tools/validate_ogre_next_frame_probe.py
      - tests/tools/test_ogre_next_*.py
  pull_request:
    paths:
      - .github/workflows/ogre-next-probe.yml
      - tools/ogre_next_probe/**
      - tools/run_ogre_next_probe.py
      - tools/validate_ogre_next_frame_probe.py
      - tests/tools/test_ogre_next_*.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogre-next-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 Metal
            runner: macos-15
            platform: macos-arm64-metal
            jobs: 8
          - name: Windows x64 Direct3D 11
            runner: windows-2022
            platform: windows-x64-d3d11
            jobs: 4
          - name: Linux x86_64 Vulkan null-window
            runner: ubuntu-24.04
            platform: linux-x86_64-vulkan
            jobs: 4
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Enable the reviewed MSVC x64 toolset
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: "14.44"

      - name: Install Linux Vulkan software-rendering prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            glslang-dev \
            libshaderc-dev \
            libvulkan-dev \
            libx11-dev \
            libxt-dev \
            libxaw7-dev \
            mesa-vulkan-drivers \
            ninja-build \
            vulkan-tools
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp*json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Verify runner architecture and renderer toolchain
        shell: bash
        if: runner.os != 'Windows'
        run: |
          uname -a
          cmake --version
          ninja --version
          python --version
          if [ "${{ runner.os }}" = "Linux" ]; then
            vulkaninfo --summary
          fi

      - name: Verify runner architecture and renderer toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, OSArchitecture
          cmake --version
          ninja --version
          python --version

      - name: Run fail-closed offline contracts
        shell: bash
        run: |
          python tests/tools/test_ogre_next_probe_contract.py
          python tests/tools/test_ogre_next_frame_probe.py
          python tests/tools/test_ogre_next_probe_workflow.py
          python -O tests/tools/test_ogre_next_probe_contract.py
          python -O tests/tools/test_ogre_next_frame_probe.py
          python -O tests/tools/test_ogre_next_probe_workflow.py
          python tools/run_ogre_next_probe.py --validate-contract-only

      - name: Build, render, read back, and validate the pinned probe
        run: >-
          python tools/run_ogre_next_probe.py
          --build-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --jobs ${{ matrix.jobs }}

      - name: Re-run native lifecycle tests
        run: >-
          ctest
          --test-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure

      - name: Revalidate the exact artifacts selected for upload
        run: >-
          python tools/validate_ogre_next_frame_probe.py
          --report "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-frame-probe-report.json"
          --image "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-frame-probe.ppm"
          --capability-report "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-probe-report.json"
          --platform-policy "${{ matrix.platform }}"

      - name: Upload exact reports and UI-free frame
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OGRE-Next-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ogre-next-build-contract.json
            ${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-probe-report.json
            ${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-frame-probe-report.json
            ${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-frame-probe.ppm
