      - name: Cryptographically attest the Windows DXR RT7 execution receipt
        id: attest_windows_dxr7_receipt
        if: >-
          success() && runner.os == 'Windows' &&
          github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: >-
            ${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-windows-dxr7-execution-receipt.json

      - name: Stage and verify the GitHub-signed Windows DXR RT7 receipt
        if: >-
          success() && runner.os == 'Windows' &&
          github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $buildRoot = '${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}'
          $sourceBundle = '${{ steps.attest_windows_dxr7_receipt.outputs.bundle-path }}'
          $bundle = Join-Path $buildRoot 'ror-ogre-next-windows-dxr7-execution-receipt.sigstore.jsonl'
          if (-not (Test-Path -LiteralPath $sourceBundle -PathType Leaf)) {
            throw 'GitHub attestation action did not produce a DSSE bundle'
          }
          Copy-Item -LiteralPath $sourceBundle -Destination $bundle -Force
          python tools/ogre_next_probe/run_windows_dxr7.py `
            --build-dir $buildRoot `
            --verify-existing `
            --trusted-attestation-bundle $bundle `
            --expected-source-ref $env:GITHUB_REF

