name: OGRE-Next raster, Metal N2/N3, Vulkan RT5/RT6, and Windows DXR RT7 probes

on:
  push:
    branches: [master]
    paths:
      - .gitattributes
      - .github/workflows/ogre-next-probe.yml
      - CMakeLists.txt
      - source/main/CMakeLists.txt
      - tests/CMakeLists.txt
      - tools/ogre_next_probe/**
      - tools/run_ogre_next_probe.py
      - tools/validate_ogre_next_frame_probe.py
      - tools/verify_ogre_next_artifact_set.py
      - cmake/RendererLauncherPackageConfig.cmake
      - source/main/gfx/RendererBackendPolicy.*
      - source/main/gfx/RendererStartupHandoff.*
      - source/main/gfx/RendererStartupPlan.*
      - source/main/system/RendererChildIntent.*
      - source/main/system/RendererChildLauncher.*
      - source/main/system/RendererSiblingPath.*
      - source/main/system/RendererOgreNextChild.*
      - source/main/system/RendererOgreNextSdlWindowRuntime*
      - source/main/system/RendererOgreNextWindowHost.*
      - source/main/system/RendererLauncherMain.cpp
      - source/main/system/RendererLauncherPackageConfig.h.in
      - source/main/system/RendererPublicLauncher.*
      - source/main/gfx/render/**
      - tests/gfx/RendererBackendPolicyTests.cpp
      - tests/gfx/RendererChildIntentTests.cpp
      - tests/gfx/RendererChildLauncherFakeChild.cpp
      - tests/gfx/RendererChildLauncherTests.cpp
      - tests/gfx/RendererSiblingPathTests.cpp
      - tests/gfx/RendererOgreNextChildTests.cpp
      - tests/gfx/RendererOgreNextWindowHostTests.cpp
      - tests/gfx/RendererPublicLauncherLegacyChild.cpp
      - tests/gfx/RendererPublicLauncherTests.cpp
      - tests/gfx/RendererStartupHandoffTests.cpp
      - tests/gfx/RendererStartupPlanTests.cpp
      - tests/gfx/render/**
      - tests/tools/test_ogre_next_*.py
  pull_request:
    paths:
      - .gitattributes
      - .github/workflows/ogre-next-probe.yml
      - CMakeLists.txt
      - source/main/CMakeLists.txt
      - tests/CMakeLists.txt
      - tools/ogre_next_probe/**
      - tools/run_ogre_next_probe.py
      - tools/validate_ogre_next_frame_probe.py
      - tools/verify_ogre_next_artifact_set.py
      - cmake/RendererLauncherPackageConfig.cmake
      - source/main/gfx/RendererBackendPolicy.*
      - source/main/gfx/RendererStartupHandoff.*
      - source/main/gfx/RendererStartupPlan.*
      - source/main/system/RendererChildIntent.*
      - source/main/system/RendererChildLauncher.*
      - source/main/system/RendererSiblingPath.*
      - source/main/system/RendererOgreNextChild.*
      - source/main/system/RendererOgreNextSdlWindowRuntime*
      - source/main/system/RendererOgreNextWindowHost.*
      - source/main/system/RendererLauncherMain.cpp
      - source/main/system/RendererLauncherPackageConfig.h.in
      - source/main/system/RendererPublicLauncher.*
      - source/main/gfx/render/**
      - tests/gfx/RendererBackendPolicyTests.cpp
      - tests/gfx/RendererChildIntentTests.cpp
      - tests/gfx/RendererChildLauncherFakeChild.cpp
      - tests/gfx/RendererChildLauncherTests.cpp
      - tests/gfx/RendererSiblingPathTests.cpp
      - tests/gfx/RendererOgreNextChildTests.cpp
      - tests/gfx/RendererOgreNextWindowHostTests.cpp
      - tests/gfx/RendererPublicLauncherLegacyChild.cpp
      - tests/gfx/RendererPublicLauncherTests.cpp
      - tests/gfx/RendererStartupHandoffTests.cpp
      - tests/gfx/RendererStartupPlanTests.cpp
      - tests/gfx/render/**
      - tests/tools/test_ogre_next_*.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ogre-next-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 Metal raster plus N2/N3 capability
            runner: macos-15
            platform: macos-arm64-metal
            jobs: 8
          - name: Windows x64 Direct3D 11
            runner: windows-2022
            platform: windows-x64-d3d11
            jobs: 4
          - name: Linux x86_64 Vulkan null bootstrap plus XCB window-host
            runner: ubuntu-24.04
            platform: linux-x86_64-vulkan
            jobs: 4
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ROR_OGRE_NEXT_EXPECTED_ROR_REPOSITORY: https://github.com/oasiz-ai/rigs-of-rods
      ROR_OGRE_NEXT_EXPECTED_ROR_REF: ${{ github.head_ref || github.ref_name }}
      ROR_OGRE_NEXT_EXPECTED_ROR_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Enable the reviewed MSVC x64 toolset
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: "14.44"

      - name: Install Linux Vulkan software-rendering prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libvulkan-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxt-dev \
            libxaw7-dev \
            mesa-vulkan-drivers \
            ninja-build \
            vulkan-tools \
            xauth \
            xvfb
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp*json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Verify runner architecture and renderer toolchain
        shell: bash
        if: runner.os != 'Windows'
        run: |
          uname -a
          cmake --version
          ninja --version
          python --version
          if [ "${{ runner.os }}" = "Linux" ]; then
            vulkaninfo --summary
          fi

      - name: Verify runner architecture and renderer toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, OSArchitecture
          cmake --version
          ninja --version
          python --version

      - name: Locate and attest the Windows SDK DXC compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkRoot = (Resolve-Path -LiteralPath `
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin')).Path
          $candidate = Get-ChildItem -LiteralPath $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object {
              $x64 = Join-Path $_.FullName 'x64'
              if ((Test-Path -LiteralPath (Join-Path $x64 'dxc.exe') -PathType Leaf) -and
                  (Test-Path -LiteralPath (Join-Path $x64 'dxcompiler.dll') -PathType Leaf) -and
                  (Test-Path -LiteralPath (Join-Path $x64 'dxil.dll') -PathType Leaf)) {
                Get-Item -LiteralPath (Join-Path $x64 'dxc.exe')
              }
            } | Select-Object -First 1
          if (-not $candidate) {
            throw 'A complete versioned Windows SDK x64 DXC closure is unavailable'
          }
          $dxcPath = $candidate.FullName
          $x64Directory = Split-Path -Parent $dxcPath
          foreach ($name in @('dxc.exe', 'dxcompiler.dll', 'dxil.dll')) {
            Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $x64Directory $name)
          }
          & $dxcPath --version
          "ROR_OGRE_NEXT_DXR7_DXC=$dxcPath" | Out-File `
            -FilePath $env:GITHUB_ENV -Append
          "ROR_OGRE_NEXT_DXR7_SDK_BIN_ROOT=$sdkRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

      - name: Run fail-closed offline contracts
        shell: bash
        run: |
          python tests/tools/test_ogre_next_probe_contract.py
          python tests/tools/test_ogre_next_frame_probe.py
          python tests/tools/test_ogre_next_frontend_n1_contract.py
          python tests/tools/test_ogre_next_pssm_shadow_contract.py
          python tests/tools/test_ogre_next_child_runtime_contract.py
          python tests/tools/test_ogre_next_window_host_contract.py
          python tests/tools/test_ogre_next_window_presentation_contract.py
          python tests/tools/test_ogre_next_native_directional_shadow_contract.py
          python tests/tools/test_ogre_next_metal_n2_contract.py
          python tests/tools/test_ogre_next_vulkan_rt5_contract.py
          python tests/tools/test_ogre_next_vulkan_rt6_contract.py
          python tests/tools/test_ogre_next_windows_dxr7_contract.py
          python tests/tools/test_ogre_next_linux_static_closure.py
          python tests/tools/test_ogre_next_metal_n3_contract.py
          python tests/tools/test_ogre_next_metal_n4_contract.py
          python tests/tools/test_ogre_next_probe_workflow.py
          python tests/tools/test_verify_ogre_next_artifact_set.py
          python -O tests/tools/test_ogre_next_probe_contract.py
          python -O tests/tools/test_ogre_next_frame_probe.py
          python -O tests/tools/test_ogre_next_frontend_n1_contract.py
          python -O tests/tools/test_ogre_next_pssm_shadow_contract.py
          python -O tests/tools/test_ogre_next_child_runtime_contract.py
          python -O tests/tools/test_ogre_next_window_host_contract.py
          python -O tests/tools/test_ogre_next_window_presentation_contract.py
          python -O tests/tools/test_ogre_next_native_directional_shadow_contract.py
          python -O tests/tools/test_ogre_next_metal_n2_contract.py
          python -O tests/tools/test_ogre_next_vulkan_rt5_contract.py
          python -O tests/tools/test_ogre_next_vulkan_rt6_contract.py
          python -O tests/tools/test_ogre_next_windows_dxr7_contract.py
          python -O tests/tools/test_ogre_next_linux_static_closure.py
          python -O tests/tools/test_ogre_next_metal_n3_contract.py
          python -O tests/tools/test_ogre_next_metal_n4_contract.py
          python -O tests/tools/test_ogre_next_probe_workflow.py
          python -O tests/tools/test_verify_ogre_next_artifact_set.py
          python tools/run_ogre_next_probe.py --validate-contract-only
          python tools/ogre_next_probe/run_vulkan_rt5.py --validate-contract-only
          python tools/ogre_next_probe/run_vulkan_rt6.py --validate-contract-only
          python tools/ogre_next_probe/run_windows_dxr7.py --validate-contract-only

      - name: Build, render, and validate the independent N1 frontend
        run: >-
          python tools/run_ogre_next_probe.py
          --build-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --checkpoint n1
          --jobs ${{ matrix.jobs }}

      - name: Require directional PSSM native pass
        shell: bash
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          python - "$build_root" <<'PY'
          from pathlib import Path
          import sys

          from tools.verify_ogre_next_artifact_set import (
              _current_source_identity,
              _read_build_contract,
              _verify_pssm,
          )

          root = Path(sys.argv[1]).resolve(strict=True)
          build_contract = _read_build_contract(
              root, _current_source_identity()
          )
          _verify_pssm(root, [], build_contract, require_pass=True)
          PY

      - name: Cryptographically attest the directional PSSM execution receipt
        id: attest_pssm_receipt
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: >-
            ${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-pssm-shadow-execution-receipt.json

      - name: Stage and verify the GitHub-signed directional PSSM receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          source_bundle="${{ steps.attest_pssm_receipt.outputs.bundle-path }}"
          bundle="$build_root/ror-ogre-next-pssm-shadow-execution-receipt.sigstore.jsonl"
          test -f "$source_bundle"
          cp "$source_bundle" "$bundle"
          gh attestation verify \
            "$build_root/ror-ogre-next-pssm-shadow-execution-receipt.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ogre-next-probe.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Prove N1 lifecycle and media-integrity failures independently
        run: >-
          ctest
          --test-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure
          -R '^ror_ogre_next_frontend_(n1_|rt4_)'

      - name: Run the non-admitted real Ogre-Next child bootstrap
        run: >-
          ctest
          --test-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure
          -R '^ror_renderer_ogre_next_child_runtime(_receipt)?$'

      - name: Resolve and revalidate the upload-bound Ogre-Next child evidence
        id: ogre_next_child_runtime_evidence
        shell: bash
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          receipt="$build_root/ror-ogre-next-child-runtime-execution-receipt.json"
          child="$build_root/renderer-ogre-next-child-runtime/Release/RoR-OgreNext"
          if [ "${{ runner.os }}" = "Windows" ]; then
            child="${child}.exe"
          fi
          python tools/ogre_next_probe/validate_child_runtime_receipt.py \
            --build-dir "$build_root" \
            --require-pass-or-skip
          test -f "$receipt"
          test -f "$child"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
          printf 'child=%s\n' "$child" >> "$GITHUB_OUTPUT"

      - name: Cryptographically attest the Ogre-Next child receipt and binary
        id: attest_ogre_next_child_runtime
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ steps.ogre_next_child_runtime_evidence.outputs.receipt }}
            ${{ steps.ogre_next_child_runtime_evidence.outputs.child }}

      - name: Stage and verify the GitHub-signed Ogre-Next child evidence
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          receipt="${{ steps.ogre_next_child_runtime_evidence.outputs.receipt }}"
          child="${{ steps.ogre_next_child_runtime_evidence.outputs.child }}"
          source_bundle="${{ steps.attest_ogre_next_child_runtime.outputs.bundle-path }}"
          bundle="$build_root/ror-ogre-next-child-runtime-execution-receipt.sigstore.jsonl"
          test -f "$receipt"
          test -f "$child"
          test -f "$source_bundle"
          cp "$source_bundle" "$bundle"
          for subject in "$receipt" "$child"; do
            gh attestation verify \
              "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ogre-next-probe.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Run the non-admitted SDL window-host contract
        run: >-
          ctest
          --test-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure
          -R '^ror_renderer_ogre_next_window_host$'

      - name: Require one-frame native Ogre-Next presentation
        if: runner.os != 'Linux'
        run: >-
          ctest
          --test-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure
          -R '^ror_ogre_next_window_present_smoke$'

      - name: Require one-frame Vulkan X11 presentation under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          smoke="$build_root/bin/ror_ogre_next_window_present_smoke"
          test -x "$smoke"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$smoke" \
              --media-root "$build_root/ror-ogre-next-n1-package/share/ror/ogre-next/media" \
              --output "$build_root/ogre-next-window-present.ppm" \
              --report "$build_root/ogre-next-window-present.json"

      - name: Run the non-admitted hidden SDL native-window smoke
        if: runner.os != 'Linux'
        run: >-
          ctest
          --test-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure
          -R '^ror_renderer_ogre_next_window_host_smoke$'

      - name: Require the hidden SDL X11 window host under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          smoke="$build_root/bin/ror_renderer_ogre_next_window_host_smoke"
          test -x "$smoke"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$smoke"

      - name: Build and validate the independent Apple Metal N2 proof
        if: runner.os == 'macOS'
        run: >-
          python tools/run_ogre_next_probe.py
          --build-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --reuse-build-dir
          --checkpoint n2
          --jobs ${{ matrix.jobs }}

      - name: Build and validate the independent Apple Metal N3 hybrid proof
        if: runner.os == 'macOS'
        run: >-
          python tools/run_ogre_next_probe.py
          --build-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --reuse-build-dir
          --checkpoint n3
          --jobs ${{ matrix.jobs }}

      - name: Build and validate the Apple Metal N4 directional-shadow proof
        if: runner.os == 'macOS'
        run: >-
          cmake
          --build "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --target ror_ogre_next_metal_n4_directional_shadow_report
          --config Release
          --parallel ${{ matrix.jobs }}

      - name: Attest RoR-owned Vulkan instance and device injection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          python tools/ogre_next_probe/run_vulkan_rt5.py \
            --build-dir "$build_root" \
            --reuse-build-dir \
            --jobs "${{ matrix.jobs }}"
          python - "$build_root/ror-ogre-next-vulkan-rt5-report.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("status") != "unsupported":
              raise SystemExit("hosted lavapipe runner must not report an RT5 hardware pass")
          if report.get("vulkan", {}).get("known_software_adapter") is not True:
              raise SystemExit("hosted Vulkan skip did not identify the software adapter")
          if report.get("scope", {}).get("native_ray_tracing") != "not_evaluated":
              raise SystemExit("RT5 foundation must not claim native ray tracing")
          PY

      - name: Require real KHR ray dispatch or explicit RT6 unsupported evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          python tools/ogre_next_probe/run_vulkan_rt6.py \
            --build-dir "$build_root" \
            --reuse-build-dir \
            --jobs "${{ matrix.jobs }}"
          python - "$build_root/ror-ogre-next-vulkan-rt6-report.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("status") != "unsupported":
              raise SystemExit("hosted lavapipe runner must not report an RT6 hardware pass")
          if report.get("vulkan", {}).get("known_software_adapter") is not True:
              raise SystemExit("hosted RT6 skip did not identify the software adapter")
          if report.get("vulkan", {}).get("candidate_decision") != "software_or_unattested_device":
              raise SystemExit("hosted RT6 skip did not fail at the hardware gate")
          if report.get("scope", {}).get("native_ray_tracing") != "not_executed":
              raise SystemExit("unsupported RT6 evidence must not claim native ray tracing")
          dispatch = report.get("pipeline_and_dispatch", {})
          if dispatch.get("shader_contract_compiled") is not True:
              raise SystemExit("hosted RT6 evidence did not compile the pinned shaders")
          if dispatch.get("ray_dispatch_completed") is not False:
              raise SystemExit("unsupported RT6 evidence must not claim a dispatch")
          if dispatch.get("readback_words") != [0, 0, 0, 0]:
              raise SystemExit("unsupported RT6 evidence must not claim ray output")
          scope = report.get("scope", {})
          if not (
              scope.get("semantic_probe_only") is True
              and scope.get("full_native_directional_shadow_v1") is False
              and scope.get("exact_ogre_rgba16_source") is False
              and scope.get("hybrid_ogre_image_composite") is False
          ):
              raise SystemExit("hosted RT6 evidence changed its bounded scope")
          semantic = report.get("n4a_semantic_directional_shadow", {})
          if not (
              semantic.get("semantic_probe_only") is True
              and semantic.get("full_native_directional_shadow_v1") is False
              and semantic.get("exact_ogre_rgba16_source") is False
              and semantic.get("hybrid_ogre_image_composite") is False
              and semantic.get("blas_count") == 0
              and semantic.get("tlas_instance_count") == 0
              and semantic.get("sample_count") == 0
              and semantic.get("visibility_r16_bits") == [0, 0]
              and semantic.get("lineage_r32") == [0, 0]
              and semantic.get("readback_completed") is False
              and semantic.get("portable_sample_oracle_passed") is False
          ):
              raise SystemExit("hosted RT6 evidence contains an N4A execution claim")
          PY

      - name: Build, render, read back, and validate the legacy probes
        # Windows DXR runs immediately before the shared legacy probes so a
        # device-removal failure cannot be hidden by a later raster success.
        if: runner.os != 'Windows'
        run: >-
          python tools/run_ogre_next_probe.py
          --build-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --reuse-build-dir
          --checkpoint legacy
          --jobs ${{ matrix.jobs }}

      - name: Build and attest app-owned D3D12/D3D11On12/DXR RT7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildRoot = '${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}'
          python tools/ogre_next_probe/run_windows_dxr7.py `
            --build-dir $buildRoot `
            --reuse-build-dir `
            --require-ci-context `
            --jobs '${{ matrix.jobs }}'
          $report = Get-Content `
            (Join-Path $buildRoot 'ror-ogre-next-windows-dxr7-report.json') `
            -Raw | ConvertFrom-Json
          if ($report.status -ne 'unsupported') {
            throw 'The non-GPU hosted Windows runner must not report a DXR7 pass'
          }
          if ($report.scope.hardware_dxr_pass -ne $false -or
              $report.ray_tracing.dispatch_rays_called -ne $false) {
            throw 'Hosted Windows unsupported evidence contains an RT pass claim'
          }
          if ($report.scope.semantic_directional_shadow_probe -ne $false -or
              $report.scope.exact_ogre_rgba16_source -ne $false -or
              $report.scope.hybrid_ogre_image_composite -ne $false -or
              $report.ray_tracing.typed_semantic_readback_exact -ne $false -or
              $report.directional_shadow_semantics.semantic_probe_only -ne $false -or
              $report.directional_shadow_semantics.visibility_readback_completed -ne $false -or
              $report.directional_shadow_semantics.lineage_readback_completed -ne $false -or
              $report.directional_shadow_semantics.hybrid_readback_completed -ne $false) {
            throw 'Hosted Windows unsupported evidence contains a directional-shadow claim'
          }

      - name: Build, render, read back, and validate the Windows legacy probes
        if: runner.os == 'Windows'
        run: >-
          python tools/run_ogre_next_probe.py
          --build-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --reuse-build-dir
          --checkpoint legacy
          --jobs ${{ matrix.jobs }}

      - name: Rehash Linux static closure and reject pinned dependency DSOs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build_root="${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          package_root="$build_root/ror-ogre-next-n1-package"
          cmake --build "$build_root" \
            --target ror_ogre_next_linux_static_closure_verify \
            --config Release --parallel "${{ matrix.jobs }}"
          cmp tools/ogre_next_probe/linux-shader-toolchain.lock.json \
            "$package_root/provenance/ogre-next-linux-shader-toolchain.lock.json"
          cmp "$build_root/ogre-next-linux-static-closure.json" \
            "$package_root/provenance/ogre-next-linux-static-closure.json"
          for notice in \
            Apache-2.0.txt \
            glslang-LICENSE.txt \
            SPIRV-Tools-LICENSE.txt \
            SPIRV-Headers-LICENSE.txt; do
            test -s "$package_root/licenses/$notice"
          done
          for executable in \
            "$build_root/bin/ror_ogre_next_frame_probe" \
            "$build_root/bin/ror_ogre_next_vulkan_rt6_smoke" \
            "$package_root/bin/ror_ogre_next_frontend_n1_smoke"; do
            ldd "$executable" | tee "${executable##*/}.ldd.txt"
            if grep -Eiq \
                'lib(freetype|shaderc|glslang|SPIRV(-Tools(-opt)?)?|MachineIndependent|GenericCodeGen|OSDependent)' \
                "${executable##*/}.ldd.txt"; then
              echo "unexpected dynamically linked pinned dependency in $executable"
              exit 1
            fi
          done

      - name: Re-run native lifecycle tests
        run: >-
          ctest
          --test-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"
          --build-config Release
          --output-on-failure

      - name: Revalidate the exact artifacts selected for upload
        run: >-
          python tools/validate_ogre_next_frame_probe.py
          --report "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-frame-probe-report.json"
          --image "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-frame-probe.ppm"
          --capability-report "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}/ror-ogre-next-probe-report.json"
          --platform-policy "${{ matrix.platform }}"

      - name: Require every exact upload artifact
        if: always()
        run: >-
          python tools/verify_ogre_next_artifact_set.py
          --build-dir "${{ runner.temp }}/ror-ogre-next-${{ matrix.platform }}"

      - name: Verify attested Apple Metal N2 pass or skip evidence
