name: Ogre-Next combined full-runtime TSan

on:
  push:
    branches: [nextgen/playable-performance-gate]
    paths:
      - .github/workflows/ogre-next-combined-tsan.yml
      - CMakeLists.txt
      - cmake/conan/locks/ror-ogre14-linux-x86_64-tsan.lock
      - cmake/conan/recipes/openal-soft/**
      - content-source/native_render/**
      - doc/nextgen/FORWARD_NATIVE_ASSET_LEDGER.md
      - resources/nextgen/native/**
      - resources/scripts/example_jbeam_multi_actor_tsan_soak.as
      - source/main/CMakeLists.txt
      - source/main/gfx/GfxActor.cpp
      - source/main/gfx/GfxActor.h
      - source/main/gfx/SimBuffers.h
      - source/main/gui/panels/GUI_VehicleInfoTPanel.cpp
      - source/main/physics/Actor.cpp
      - source/main/physics/Actor.h
      - source/main/gfx/render/NativeRenderAssetPackage.cpp
      - source/main/gfx/render/NativeRenderAssetPackage.h
      - source/main/gfx/render/NativeVisualShowcaseSceneSource.cpp
      - source/main/gfx/render/NativeVisualShowcaseSceneSource.h
      - tests/CMakeLists.txt
      - tests/fixtures/beamng/jbeam_multi_actor_tsan_soak/**
      - tests/tools/test_openal_tsan_dependency_contract.py
      - tests/tools/test_run_jbeam_multi_actor_tsan_soak.py
      - tests/tools/test_run_playable_performance_scene.py
      - tools/run_jbeam_multi_actor_tsan_soak.py
      - tools/run_playable_performance_scene.py
      - tools/audit_openal_tsan_package.py
      - source/main/gfx/render/Ogre14ParticleCaptureSource.cpp
      - source/main/gfx/render/Ogre14ParticleCaptureSource.h
      - source/main/gfx/render/ogrenext/OgreNextN1ParticleRuntime.cpp
      - source/main/gfx/render/ogrenext/OgreNextN1ParticleRuntime.h
      - source/main/physics/ActorSpawner.cpp
      - tests/tools/test_ogre_next_combined_provider_contract.py
      - tests/tools/test_renderer_combined_game_wiring_contract.py
      - tools/ogre_next_probe/cmake/PinnedOgreNext.cmake
      - tools/ogre_next_probe/ogre-next.lock.json
      - tools/ogre_next_probe/patches/**
      - tools/run_ogre_next_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogre-next-combined-tsan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-vulkan-tsan:
    name: Linux x86_64 Vulkan RoR-Combined TSan soak
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CC: gcc-11
      CXX: g++-11
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      PYTHONDONTWRITEBYTECODE: "1"
      ROR_OGRE_NEXT_SCENE_WORKERS: "4"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate generated state from the source checkout
        shell: bash
        run: |
          {
            echo "CONAN_HOME=$RUNNER_TEMP/ror-combined-tsan-conan-home"
            echo "ROR_TSAN_ARTIFACTS_DIR=$RUNNER_TEMP/ror-combined-tsan-artifacts"
            echo "ROR_TSAN_BUILD_DIR=$RUNNER_TEMP/ror-combined-tsan-build"
          } >> "$GITHUB_ENV"

      - name: Install Linux build and software-rendering prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            file \
            gcc-11 \
            g++-11 \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxaw7-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxt-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            xauth \
            xvfb
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp*json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Install pinned Conan and Ninja clients
        shell: bash
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-tsan-conan-home
          key: ogre-next-combined-linux-gcc11-tsan-openal-source-v1-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          home = Path(os.environ["CONAN_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          (home / "global.conf").write_text(
              "tools.system.package_manager:mode=install\n"
              "tools.system.package_manager:sudo=True\n"
              'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n',
              encoding="utf-8",
          )
          PY
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: bash
        run: |
          cmake -E make_directory "$ROR_TSAN_ARTIFACTS_DIR"
          python cmake/conan/export_pinned_dependency_recipes.py \
            --archive "$RUNNER_TEMP/ror-conan-recipes-d3568327.tar.gz" \
            --extract-root "$RUNNER_TEMP/ror-conan-recipes-export" \
            | tee "$ROR_TSAN_ARTIFACTS_DIR/pinned-conan-recipes.json"

      - name: Verify compiler, architecture, and Vulkan software device
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(gcc-11 -dumpfullversion | cut -d. -f1)" = "11"
          test "$(g++-11 -dumpfullversion | cut -d. -f1)" = "11"
          gcc-11 --version
          g++-11 --version
          readelf --version
          nm --version
          vulkaninfo --summary

      - name: Run full-runtime TSan fail-closed contracts
        shell: bash
        run: |
          python tests/tools/test_openal_tsan_dependency_contract.py
          python -O tests/tools/test_openal_tsan_dependency_contract.py
          python tests/tools/test_run_jbeam_multi_actor_tsan_soak.py
          python -O tests/tools/test_run_jbeam_multi_actor_tsan_soak.py
          python tests/tools/test_ogre_next_combined_provider_contract.py
          python tests/tools/test_ogre_next_embedded_namespace_contract.py
          python tests/tools/test_renderer_combined_game_wiring_contract.py
          python -O tests/tools/test_renderer_combined_game_wiring_contract.py
          python tests/tools/test_run_playable_performance_scene.py
          python -O tests/tools/test_run_playable_performance_scene.py

      - name: Verify the locked native Conan graph
        shell: bash
        run: |
          python tests/tools/assert_ogre14_app_graph.py \
            --platform linux-x86_64 \
            | tee "$ROR_TSAN_ARTIFACTS_DIR/linux-x86_64-conan-graph.json"

      - name: Configure clean TSan-instrumented RoR-Combined
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          cmake \
            -S . \
            -B "$ROR_TSAN_BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DCMAKE_CXX_FLAGS="-g -fsanitize=thread -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCONAN_HOST_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DCONAN_BUILD_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DROR_BUILD_TESTS=OFF \
            -DROR_BUILD_QUALIFICATION_TOOLS=OFF \
            -DROR_CREATE_CONTENT_FOLDER=ON \
            -DROR_OGRE_NEXT_COMBINED_RUNTIME=ON \
            -DROR_TSAN_INSTRUMENT_OPENAL=ON \
            -DROR_RENDERER_PUBLIC_LAUNCHER=OFF \
            -DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF \
            -DROR_OGRE_NEXT_DEMO_ADMISSION=OFF

      - name: Build the actual combined game under ThreadSanitizer
        shell: bash
        run: >-
          cmake
          --build "$ROR_TSAN_BUILD_DIR"
          --target RoR-Combined
          --config Release

      - name: Prove the pinned OpenAL archive is source-instrumented
        shell: bash
        run: |
          python3 tools/audit_openal_tsan_package.py \
            --conan-home "$CONAN_HOME" \
            --build-dir "$ROR_TSAN_BUILD_DIR" \
            --artifact-dir "$ROR_TSAN_ARTIFACTS_DIR/openal-soft-tsan"
          test -s "$ROR_TSAN_ARTIFACTS_DIR/openal-soft-tsan/receipt.json"

      - name: Prove ThreadSanitizer instrumentation and combined ownership
        shell: bash
        run: |
          binary="$ROR_TSAN_BUILD_DIR/bin/RoR-Combined"
          test -x "$binary"
          test -d "$ROR_TSAN_BUILD_DIR/bin/resources/ogrenext/ShaderMedia"
          test -f "$ROR_TSAN_BUILD_DIR/bin/content/simple2-terrain.zip"
          test -f "$ROR_TSAN_BUILD_DIR/bin/content/dafsemi.zip"
          readelf --dynamic "$binary" \
            | tee "$ROR_TSAN_ARTIFACTS_DIR/RoR-Combined.readelf-dynamic.txt"
          nm --dynamic "$binary" \
            | tee "$ROR_TSAN_ARTIFACTS_DIR/RoR-Combined.nm-dynamic.txt"
          grep -Eq 'Shared library: \[libtsan\.so(\.[0-9]+)+\]' \
            "$ROR_TSAN_ARTIFACTS_DIR/RoR-Combined.readelf-dynamic.txt"
          grep -Eq '[[:space:]]U[[:space:]]+__tsan_init(@|$)' \
            "$ROR_TSAN_ARTIFACTS_DIR/RoR-Combined.nm-dynamic.txt"

      - name: Render packaged Simple2 and semi through four Ogre-Next workers under ThreadSanitizer
        shell: bash
        run: |
          evidence="$ROR_TSAN_ARTIFACTS_DIR/packaged-simple2-semi"
          openal_log="$evidence/openal-soft-packaged-scene.log"
          tsan_log="$RUNNER_TEMP/ror-combined-packaged-tsan-report"
          test ! -e "$evidence"
          test ! -e "$openal_log"
          export TSAN_OPTIONS="halt_on_error=1:exitcode=66:history_size=7:second_deadlock_stack=1:log_path=$tsan_log"
          scene_status=0
          ALSOFT_DRIVERS=null \
          ALSOFT_LOGLEVEL=3 \
          ALSOFT_LOGFILE="$openal_log" \
          LP_NUM_THREADS=0 \
          LD_LIBRARY_PATH="$ROR_TSAN_BUILD_DIR/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
          python tools/run_playable_performance_scene.py \
            --executable "$ROR_TSAN_BUILD_DIR/bin/RoR-Combined" \
            --artifact-dir "$evidence" \
            --scenario-id ci.ogre-next-combined.tsan-packaged-simple2-semi \
            --terrain simple2_a.terrn2 \
            --actor b6b0UID-semi.truck \
            --graphics-preset high \
            --width 1280 \
            --height 720 \
            --warmup-frames 2 \
            --minimum-frames 24 \
            --frames 24 \
            --sustained-ms 1000 \
            --percentile 99 \
            --percentile-ms 1000 \
            --measure-only \
            --timeout 600 || scene_status=$?
          tsan_reports=0
          if compgen -G "$tsan_log*" > /dev/null; then
            tsan_reports=1
            echo 'ThreadSanitizer emitted a packaged-scene diagnostic report' >&2
            find "$RUNNER_TEMP" -maxdepth 1 \
              -name 'ror-combined-packaged-tsan-report*' \
              -type f -exec cp {} "$ROR_TSAN_ARTIFACTS_DIR/" \;
          fi
          audio_status=0
          python - \
            "$evidence/RoR.log" \
            "$openal_log" \
            "$ROR_TSAN_ARTIFACTS_DIR/openal-soft-tsan/receipt.json" \
            "$evidence/openal-audio-runtime-initialization.json" <<'PY' || audio_status=$?
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          log_path = Path(sys.argv[1])
          openal_log_path = Path(sys.argv[2])
          dependency_receipt_path = Path(sys.argv[3])
          output_path = Path(sys.argv[4])
          if not log_path.is_file() or log_path.is_symlink():
              raise SystemExit("packaged TSan scene did not retain a regular RoR.log")
          if not openal_log_path.is_file() or openal_log_path.is_symlink():
              raise SystemExit(
                  "packaged TSan scene did not retain a regular OpenAL trace"
              )
          if not dependency_receipt_path.is_file():
              raise SystemExit("OpenAL TSan dependency receipt is absent")
          log_bytes = log_path.read_bytes()
          if not log_bytes or len(log_bytes) > 256 * 1024 * 1024:
              raise SystemExit("packaged TSan RoR.log byte count is invalid")
          log = log_bytes.decode("utf-8", errors="replace")
          openal_log_bytes = openal_log_path.read_bytes()
          if not openal_log_bytes or len(openal_log_bytes) > 64 * 1024 * 1024:
              raise SystemExit("packaged TSan OpenAL trace byte count is invalid")
          openal_log = openal_log_bytes.decode("utf-8", errors="replace")
          backend_marker = 'Added "null" for playback'
          if openal_log.count(backend_marker) != 1:
              raise SystemExit(
                  "packaged TSan OpenAL trace did not add exactly one null backend"
              )
          created_devices = re.findall(
              r'Created device [^,\r\n]+, "No Output"', openal_log
          )
          if len(created_devices) != 1:
              raise SystemExit(
                  "packaged TSan OpenAL trace did not create exactly one null device"
              )
          version = "SoundManager: OpenAL version is: 1.1 ALSOFT 1.24.3"
          renderer = "SoundManager: OpenAL renderer is: OpenAL Soft"
          default_wav = "Loading WAV file default_break.wav"
          instance = "SoundScriptInstance: instance created: defaults.soundscript-"
          for marker in (version, renderer, default_wav, instance):
              if marker not in log:
                  raise SystemExit(f"packaged TSan audio marker is absent: {marker}")
          source_counts = [
              int(value)
              for value in re.findall(
                  r"SoundScriptManager: Sound Manager started with ([0-9]+) sources",
                  log,
              )
          ]
          if len(source_counts) != 1 or source_counts[0] <= 0:
              raise SystemExit(
                  "packaged TSan scene did not initialize positive OpenAL sources"
              )
          for forbidden in (
              "SoundScriptManager: Sound Manager is disabled",
              "SoundScriptManager: Failed to create the Sound Manager",
              "Failed to open configured audio device",
              "Failed to open default audio device. Sound disabled.",
              "Failed to make the OpenAL context current. Sound disabled.",
          ):
              if forbidden in log:
                  raise SystemExit(
                      f"packaged TSan scene used disabled/fallback audio: {forbidden}"
                  )
          dependency_bytes = dependency_receipt_path.read_bytes()
          dependency_receipt = json.loads(dependency_bytes)
          if not isinstance(dependency_receipt, dict):
              raise SystemExit("OpenAL TSan dependency receipt is not an object")
          receipt = {
              "format": "ror-openal-tsan-audio-runtime-initialization-v1",
              "lane": "packaged-simple2-semi",
              "backend": "null",
              "evidence_scope": (
                  "runtime-initialization-and-null-backend-device-creation"
              ),
              "null_backend_added": True,
              "null_device_created": True,
              "openal_version": "1.1 ALSOFT 1.24.3",
              "hardware_sources": source_counts[0],
              "default_wav": "default_break.wav",
              "openal_log_sha256": hashlib.sha256(
                  openal_log_bytes
              ).hexdigest(),
              "ror_log_sha256": hashlib.sha256(log_bytes).hexdigest(),
              "dependency_receipt_sha256": hashlib.sha256(
                  dependency_bytes
              ).hexdigest(),
          }
          temporary = output_path.with_suffix(output_path.suffix + ".tmp")
          temporary.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          os.replace(temporary, output_path)
          PY
          if (( scene_status != 0 )); then
            echo "Packaged TSan scene exited with status $scene_status" >&2
            exit "$scene_status"
          fi
          if (( tsan_reports != 0 )); then
            exit 1
          fi
          if (( audio_status != 0 )); then
            echo 'Packaged TSan scene did not prove OpenAL initialization and null-device creation' >&2
            exit "$audio_status"
          fi
          python - "$evidence/performance-run.json" <<'PY'
          import json
          import sys

          document = json.load(open(sys.argv[1], encoding="utf-8"))
          receipt = document.get("receipt", {})
          renderer = document.get("renderer", {})
          expected = {
              "scenario_id": "ci.ogre-next-combined.tsan-packaged-simple2-semi",
              "terrain": "simple2_a.terrn2",
              "actor": "b6b0UID-semi.truck",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "accepted_frames": 24,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 24,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if receipt.get(field) != value:
                  raise SystemExit(
                      f"packaged TSan scene receipt changed: "
                      f"{field}={receipt.get(field)!r}"
                  )
          workers = renderer.get("scene_workers", {})
          if (
              workers.get("requested") != 4
              or workers.get("native") != 4
              or not isinstance(workers.get("hardware"), int)
              or workers["hardware"] < 4
              or workers.get("override_present") is not True
              or workers.get("override_valid") is not True
          ):
              raise SystemExit("packaged TSan scene did not use four native workers")
          ownership = renderer.get("presentation_ownership", {})
          if (
              ownership.get("visible_render_system") != "ogre-next-vulkan"
              or ownership.get("visible_window") is not True
              or ownership.get("presentation_owner") != "ogre-next"
              or ownership.get("legacy_visible_fallback") is not False
              or ownership.get("resource_host") != "ogre14"
              or ownership.get("resource_host_visible") is not False
              or ownership.get("resource_host_protected") is not True
          ):
              raise SystemExit("packaged TSan scene lost Ogre-Next presentation ownership")
          PY

      - name: Run continuous ten-minute multi-actor collision and mutation soak
        shell: bash
        run: |
          evidence="$ROR_TSAN_ARTIFACTS_DIR/full-runtime-tsan-soak"
          openal_log="$evidence/openal-soft-full-soak.log"
          tsan_log="$RUNNER_TEMP/ror-combined-tsan-report"
          test ! -e "$evidence"
          test ! -e "$openal_log"
          export TSAN_OPTIONS="halt_on_error=1:exitcode=66:history_size=7:second_deadlock_stack=1:log_path=$tsan_log"
          soak_status=0
          ALSOFT_DRIVERS=null \
          ALSOFT_LOGLEVEL=3 \
          ALSOFT_LOGFILE="$openal_log" \
          LD_LIBRARY_PATH="$ROR_TSAN_BUILD_DIR/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
          python tools/run_jbeam_multi_actor_tsan_soak.py \
            --executable "$ROR_TSAN_BUILD_DIR/bin/RoR-Combined" \
            --runtime-content "$ROR_TSAN_BUILD_DIR/bin/content" \
            --artifact-dir "$evidence" \
            --workers 8 \
            --timeout 1200 \
            --require-tsan || soak_status=$?
          tsan_reports=0
          if compgen -G "$tsan_log*" > /dev/null; then
            tsan_reports=1
            echo 'ThreadSanitizer emitted a diagnostic report' >&2
            find "$RUNNER_TEMP" -maxdepth 1 -name 'ror-combined-tsan-report*' \
              -type f -exec cp {} "$ROR_TSAN_ARTIFACTS_DIR/" \;
          fi
          audio_status=0
          python - \
            "$evidence/diagnostics/RoR.log" \
            "$openal_log" \
            "$ROR_TSAN_ARTIFACTS_DIR/openal-soft-tsan/receipt.json" \
            "$evidence/openal-audio-runtime-initialization.json" <<'PY' || audio_status=$?
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          log_path = Path(sys.argv[1])
          openal_log_path = Path(sys.argv[2])
          dependency_receipt_path = Path(sys.argv[3])
          output_path = Path(sys.argv[4])
          if not log_path.is_file() or log_path.is_symlink():
              raise SystemExit("full TSan soak did not retain a regular RoR.log")
          if not openal_log_path.is_file() or openal_log_path.is_symlink():
              raise SystemExit(
                  "full TSan soak did not retain a regular OpenAL trace"
              )
          if not dependency_receipt_path.is_file():
              raise SystemExit("OpenAL TSan dependency receipt is absent")
          log_bytes = log_path.read_bytes()
          if not log_bytes or len(log_bytes) > 256 * 1024 * 1024:
              raise SystemExit("full TSan soak RoR.log byte count is invalid")
          log = log_bytes.decode("utf-8", errors="replace")
          openal_log_bytes = openal_log_path.read_bytes()
          if not openal_log_bytes or len(openal_log_bytes) > 64 * 1024 * 1024:
              raise SystemExit("full TSan soak OpenAL trace byte count is invalid")
          openal_log = openal_log_bytes.decode("utf-8", errors="replace")
          backend_marker = 'Added "null" for playback'
          if openal_log.count(backend_marker) != 1:
              raise SystemExit(
                  "full TSan soak OpenAL trace did not add exactly one null backend"
              )
          created_devices = re.findall(
              r'Created device [^,\r\n]+, "No Output"', openal_log
          )
          if len(created_devices) != 1:
              raise SystemExit(
                  "full TSan soak OpenAL trace did not create exactly one null device"
              )
          version = "SoundManager: OpenAL version is: 1.1 ALSOFT 1.24.3"
          renderer = "SoundManager: OpenAL renderer is: OpenAL Soft"
          default_wav = "Loading WAV file default_break.wav"
          instance = "SoundScriptInstance: instance created: defaults.soundscript-"
          for marker in (version, renderer, default_wav, instance):
              if marker not in log:
                  raise SystemExit(f"full TSan soak audio marker is absent: {marker}")
          source_counts = [
              int(value)
              for value in re.findall(
                  r"SoundScriptManager: Sound Manager started with ([0-9]+) sources",
                  log,
              )
          ]
          if len(source_counts) != 1 or source_counts[0] <= 0:
              raise SystemExit(
                  "full TSan soak did not initialize positive OpenAL sources"
              )
          for forbidden in (
              "SoundScriptManager: Sound Manager is disabled",
              "SoundScriptManager: Failed to create the Sound Manager",
              "Failed to open configured audio device",
              "Failed to open default audio device. Sound disabled.",
              "Failed to make the OpenAL context current. Sound disabled.",
          ):
              if forbidden in log:
                  raise SystemExit(
                      f"full TSan soak used disabled/fallback audio: {forbidden}"
                  )
          dependency_bytes = dependency_receipt_path.read_bytes()
          dependency_receipt = json.loads(dependency_bytes)
          if not isinstance(dependency_receipt, dict):
              raise SystemExit("OpenAL TSan dependency receipt is not an object")
          receipt = {
              "format": "ror-openal-tsan-audio-runtime-initialization-v1",
              "lane": "full-runtime-tsan-soak",
              "backend": "null",
              "evidence_scope": (
                  "runtime-initialization-and-null-backend-device-creation"
              ),
              "null_backend_added": True,
              "null_device_created": True,
              "openal_version": "1.1 ALSOFT 1.24.3",
              "hardware_sources": source_counts[0],
              "default_wav": "default_break.wav",
              "openal_log_sha256": hashlib.sha256(
                  openal_log_bytes
              ).hexdigest(),
              "ror_log_sha256": hashlib.sha256(log_bytes).hexdigest(),
              "dependency_receipt_sha256": hashlib.sha256(
                  dependency_bytes
              ).hexdigest(),
          }
          temporary = output_path.with_suffix(output_path.suffix + ".tmp")
          temporary.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          os.replace(temporary, output_path)
          PY
          if (( soak_status != 0 )); then
            echo "Full-runtime TSan soak exited with status $soak_status" >&2
            exit "$soak_status"
          fi
          if (( tsan_reports != 0 )); then
            exit 1
          fi
          if (( audio_status != 0 )); then
            echo 'Full-runtime TSan soak did not prove OpenAL initialization and null-device creation' >&2
            exit "$audio_status"
          fi

      - name: Validate the exact sanitizer evidence receipt
        shell: bash
        run: |
          python - "$ROR_TSAN_ARTIFACTS_DIR/full-runtime-tsan-soak/report.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "format": "ror-d0-full-runtime-tsan-soak-v1",
              "repository_commit": sys.argv[2],
              "artifact_claim": "sanitizer-evidence-not-qualified-runtime-package",
              "duration_clock": "ogre-monotonic-timer",
              "scope": "continuous-clean-room-multi-actor-contact-and-lifetime-mutation",
              "workers": 8,
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(
                      f"TSan report changed: {field}={report.get(field)!r}"
                  )
          if report.get("sanitizer") != {
              "enabled": True,
              "name": "thread",
              "reports": 0,
              "suppressions": False,
          }:
              raise SystemExit("TSan receipt did not prove unsuppressed instrumentation")
          if report.get("presentation_ownership") != {
              "legacy_visible_fallback": False,
              "presentation_owner": "ogre-next",
              "resource_host": "ogre14",
              "resource_host_protected": True,
              "resource_host_visible": False,
              "visible_render_system": "ogre-next-vulkan",
              "visible_window": True,
          }:
              raise SystemExit("TSan receipt did not retain Ogre-Next ownership")
          if report.get("hidden_resource_host_rasterizer") != {
              "driver": "llvmpipe",
              "lp_num_threads": 0,
              "mode": "synchronous",
          }:
              raise SystemExit(
                  "TSan receipt did not prove synchronous hidden llvmpipe"
              )
          telemetry = report.get("telemetry", {})
          cycles = telemetry.get("completed_cycles", 0)
          if (
              telemetry.get("elapsed_seconds", 0) < 600
              or telemetry.get("physics_steps", 0) < 20000
              or cycles < 10
              or telemetry.get("collision_responses") != cycles
              or telemetry.get("actor_spawns") != cycles * 2
              or telemetry.get("actor_deletes") != (cycles - 1) * 2
          ):
              raise SystemExit("TSan receipt did not complete the exact soak")
          PY

      - name: Upload TSan evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RoR-Combined-Linux-x86_64-TSan-Evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ror-combined-tsan-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
