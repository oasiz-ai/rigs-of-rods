          test ! -e "$destination"
          python tools/run_nicemetal_shader_smoke.py \
            --executable "$executable" \
            --runtime-content "$content" \
            --artifact-dir "$evidence" \
            --repository-commit "$GITHUB_SHA" \
            --timeout 240
          python - "$evidence/receipt.json" darwin ogre-next-metal \
              "OpenGL 3+ Rendering Subsystem" "$GITHUB_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.nicemetal_resource_host_shader_smoke.v1",
              "passed": True,
              "evidence_class": "resource-host-shader-evidence",
              "qualification_scope": "ogre14-hidden-resource-host-managed-template-shader-compile-load",
              "resource_host_shader_compile_load_proven": True,
              "visible_nicemetal_draw_proven": False,
              "repository_commit": sys.argv[5],
          }
          for field, value in expected.items():
              if receipt.get(field) != value:
                  raise SystemExit(
                      f"NiceMetal resource-host receipt changed: {field}={receipt.get(field)!r}"
                  )
          runtime = receipt.get("runtime", {})
          if (
              runtime.get("platform") != sys.argv[2]
              or runtime.get("runtime_build_commit") != sys.argv[5]
              or runtime.get("presentation_owner") != "ogre-next"
              or runtime.get("visible_render_system") != sys.argv[3]
              or runtime.get("resource_host_render_system") != sys.argv[4]
              or runtime.get("legacy_visible_fallback") is not False
          ):
              raise SystemExit("NiceMetal presentation/resource-host identity changed")
          source = receipt.get("source_manifest", {})
          if (
              source.get("schema") != "ror.nicemetal_shader_source_manifest.v1"
              or source.get("file_count") != 6
              or source.get("removed_cg_absent") is not True
              or source.get("managed_loose_source_closure_complete") is not True
              or source.get("backend_source_mirrors_byte_identical") is not True
              or len(source.get("files", [])) != 6
          ):
              raise SystemExit("NiceMetal packaged shader source manifest changed")
          if sum(
              item.get("selected_for_resource_host") is True
              for item in source["files"]
          ) != 4:
              raise SystemExit("NiceMetal selected backend source closure changed")
          evidence = receipt.get("evidence", {})
          if (
              len(evidence.get("placeholder_marker_counts", {})) != 6
              or set(evidence.get("placeholder_marker_counts", {}).values()) != {1}
              or evidence.get("backend_child_names_directly_logged") is not False
              or evidence.get("rejected_diagnostic_count") != 0
          ):
              raise SystemExit("NiceMetal post-support-check marker evidence changed")
          PY
          cmake -E make_directory "$destination"
          for name in receipt.json RoR.log console.txt OgreNextNiceMetalShaderProbe.zip; do
            cmake -E copy "$evidence/$name" "$destination/$name"
          done

      - name: Render packaged Simple2 and semi through Ogre-Next Metal
        shell: bash
