permissions:
  contents: read

concurrency:
  group: ogre-next-combined-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-vulkan:
    name: Linux x86_64 Vulkan RoR-Combined
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: gcc-11
      CXX: g++-11
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate all generated state from the source checkout
        shell: bash
        run: |
          {
            echo "CONAN_HOME=$RUNNER_TEMP/ror-combined-conan-home"
            echo "ROR_COMBINED_ARTIFACTS_DIR=$RUNNER_TEMP/ror-combined-artifacts"
            echo "ROR_COMBINED_BUILD_DIR=$RUNNER_TEMP/ror-combined-build"
            echo "ROR_COMBINED_STAGE_DIR=$RUNNER_TEMP/ror-combined-stage"
          } >> "$GITHUB_ENV"

      - name: Install Linux build and software-rendering prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            file \
            gcc-11 \
            g++-11 \
            gdb \
            glslang-tools \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxaw7-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxt-dev \
            mesa-vulkan-drivers \
            mesa-utils \
            vulkan-tools \
            xauth \
            xvfb \
            xdotool
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp*json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Install pinned Conan and Ninja clients
        shell: bash
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-conan-home
          key: ogre-next-combined-linux-gcc11-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          home = Path(os.environ["CONAN_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          (home / "global.conf").write_text(
              "tools.system.package_manager:mode=install\n"
              "tools.system.package_manager:sudo=True\n"
              'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n',
              encoding="utf-8",
          )
          PY
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: bash
        run: |
          cmake -E make_directory "$ROR_COMBINED_ARTIFACTS_DIR"
          python cmake/conan/export_pinned_dependency_recipes.py \
            --archive "$RUNNER_TEMP/ror-conan-recipes-d3568327.tar.gz" \
            --extract-root "$RUNNER_TEMP/ror-conan-recipes-export" \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/pinned-conan-recipes.json"

      - name: Verify compiler, architecture, and Vulkan software device
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(gcc-11 -dumpfullversion | cut -d. -f1)" = "11"
          test "$(g++-11 -dumpfullversion | cut -d. -f1)" = "11"
          gcc-11 --version
          g++-11 --version
          readelf --version
          nm --version
          vulkaninfo --summary

      - name: Compile and run native render-pass metrics behavioral gate
        shell: bash
        run: |
          gate="$RUNNER_TEMP/ror-ogre-next-native-render-pass-metrics-gate"
          binary="$gate/ror_ogre_next_native_render_pass_metrics_tests"
          test ! -e "$gate"
          cmake -E make_directory "$gate"
          TMPDIR="$gate" g++-11 \
            -std=c++17 \
            -Wall -Wextra -Werror -pedantic -fno-fast-math -ffp-contract=off \
            -Isource/main/gfx/render/ogrenext \
            tests/gfx/render/OgreNextNativeRenderPassMetricsTests.cpp \
            source/main/gfx/render/ogrenext/OgreNextNativeRenderPassMetrics.cpp \
            -o "$binary"
          test -x "$binary"
          "$binary"

      - name: Compile the complete modern GLSL source closure
        shell: bash
        run: |
          glslang_validator="$(readlink -f "$(command -v glslangValidator)")"
          test -x "$glslang_validator"
          receipt="$ROR_COMBINED_ARTIFACTS_DIR/linux-x86_64-modern-glsl-source-compile.json"
          python tools/validate_modern_glsl_sources.py \
            --glslang-validator "$glslang_validator" \
            | tee "$receipt"
          python - "$receipt" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if receipt.get("schema") != "ror.modern-glsl-source-compile@1":
              raise SystemExit("unexpected GLSL source-compile receipt schema")
          if receipt.get("result") != "passed":
              raise SystemExit("GLSL source compilation did not pass")
          if receipt.get("caseCount") != 115 or receipt.get("executedCaseCount") != 115:
              raise SystemExit("GLSL source-compile closure is incomplete")
          if receipt.get("familyCaseCounts") != {
              "caelum": 26,
              "fresnel": 3,
              "general": 11,
              "grass": 2,
              "managed-nicemetal": 10,
              "managed-pssm": 5,
              "mygui": 4,
              "nicemetal": 10,
              "postprocess": 2,
              "rtshader": 18,
              "skyx": 19,
              "stdquad": 5,
          }:
              raise SystemExit("GLSL source-compile family counts changed")
          PY
          ROR_HYDRAX_GLSLANG="$glslang_validator" CXX=g++-11 \
            python tests/tools/test_hydrax_gpu_normal_hlsl.py
          ROR_HYDRAX_GLSLANG="$glslang_validator" CXX=g++-11 \
            python -O tests/tools/test_hydrax_gpu_normal_hlsl.py
          ROR_HYDRAX_GLSLANG="$glslang_validator" CXX=g++-11 \
            python tests/tools/test_hydrax_godrays_hlsl.py
          ROR_HYDRAX_GLSLANG="$glslang_validator" CXX=g++-11 \
            python -O tests/tools/test_hydrax_godrays_hlsl.py

      - name: Run combined-runtime fail-closed contracts
        shell: bash
        run: |
          python tests/tools/test_ogre_next_combined_provider_contract.py
          python tests/tools/test_ogre_next_embedded_namespace_contract.py
          python tests/tools/test_run_playable_performance_scene.py
          python tests/tools/test_verify_native_a1_lod_runtime.py
          python tests/tools/test_run_agora_impact_regression.py
          python tests/tools/test_run_deterministic_savegame_resume.py
          python tests/tools/test_run_jbeam_inter_actor_collision.py
          python tests/tools/test_run_jbeam_wheel2_spawn.py
          python tests/tools/test_renderer_combined_game_wiring_contract.py
          python tests/tools/test_mygui_glsl_contract.py
          python tests/tools/test_skyx_glsl_contract.py
          python tests/tools/test_ogre14_remaining_glsl_contract.py
          python tests/tools/test_modern_shader_source_closure.py
          python tests/tools/test_validate_modern_glsl_sources.py
          python tests/tools/test_validate_modern_hlsl_sources.py
          python tests/tools/test_cg_runtime_route_retired_contract.py
          python tests/tools/test_rtshader_modern_only_contract.py
          python tests/tools/test_managed_pssm_shader_contract.py
          python tests/tools/test_caelum_shader_contract.py
          python tests/tools/test_fresnel_shader_contract.py
          python tests/tools/test_grass_shader_contract.py
          python tests/tools/test_general_shader_contract.py
          python tests/tools/test_nicemetal_shader_contract.py
          python tests/tools/test_run_nicemetal_shader_smoke.py
          python -O tests/tools/test_ogre_next_combined_provider_contract.py
          python -O tests/tools/test_ogre_next_embedded_namespace_contract.py
          python -O tests/tools/test_run_playable_performance_scene.py
          python -O tests/tools/test_verify_native_a1_lod_runtime.py
          python -O tests/tools/test_run_agora_impact_regression.py
          python -O tests/tools/test_run_deterministic_savegame_resume.py
          python -O tests/tools/test_run_jbeam_inter_actor_collision.py
          python -O tests/tools/test_run_jbeam_wheel2_spawn.py
          python -O tests/tools/test_renderer_combined_game_wiring_contract.py
          python -O tests/tools/test_mygui_glsl_contract.py
          python -O tests/tools/test_skyx_glsl_contract.py
          python -O tests/tools/test_ogre14_remaining_glsl_contract.py
          python -O tests/tools/test_modern_shader_source_closure.py
          python -O tests/tools/test_validate_modern_glsl_sources.py
          python -O tests/tools/test_validate_modern_hlsl_sources.py
          python -O tests/tools/test_cg_runtime_route_retired_contract.py
          python -O tests/tools/test_rtshader_modern_only_contract.py
          python -O tests/tools/test_managed_pssm_shader_contract.py
          python -O tests/tools/test_caelum_shader_contract.py
          python -O tests/tools/test_fresnel_shader_contract.py
          python -O tests/tools/test_grass_shader_contract.py
          python -O tests/tools/test_general_shader_contract.py
          python -O tests/tools/test_nicemetal_shader_contract.py
          python -O tests/tools/test_run_nicemetal_shader_smoke.py

      - name: Verify the locked native Conan graph
        shell: bash
        run: |
          python tests/tools/assert_ogre14_app_graph.py \
            --platform linux-x86_64 \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/linux-x86_64-conan-graph.json"

      - name: Configure clean Linux RoR-Combined Release
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          cmake \
            -S . \
            -B "$ROR_COMBINED_BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ROR_COMBINED_STAGE_DIR" \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DCONAN_HOST_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DCONAN_BUILD_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DROR_BUILD_TESTS=OFF \
            -DROR_BUILD_QUALIFICATION_TOOLS=ON \
            -DROR_CREATE_CONTENT_FOLDER=ON \
            -DROR_OGRE_NEXT_COMBINED_RUNTIME=ON \
            -DROR_RENDERER_PUBLIC_LAUNCHER=OFF \
            -DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF \
            -DROR_OGRE_NEXT_DEMO_ADMISSION=OFF

      - name: Build and prove the final combined ELF closure
        shell: bash
        run: >-
          cmake
          --build "$ROR_COMBINED_BUILD_DIR"
          --target ror_ogre_next_combined_verified
          --config Release

      - name: Require a qualification-eligible combined build receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["ROR_COMBINED_BUILD_DIR"])
          binary = build / "bin/RoR-Combined"
          closure = build / "source/main/RoR-Combined.binary-closure.json"
          namespace = build / "ogre-next-embedded/ogre-next-combined-namespace-audit.json"
          resources = build / "bin/resources/ogrenext/.complete.json"
          for path in (binary, closure, namespace, resources):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"required combined build output is unavailable: {path}")
          document = json.loads(closure.read_text(encoding="utf-8"))
          if document.get("schema") != "ror.ogre_next_combined_elf_closure.v1":
              raise SystemExit("combined ELF closure schema changed")
          if document.get("platform_policy") != "linux-x86_64-vulkan":
              raise SystemExit("combined ELF platform policy changed")
          if document.get("qualification_eligible") is not True:
              raise SystemExit("combined ELF closure is not qualification eligible")
          if document.get("bridge_or_transport_symbols_present") is not False:
              raise SystemExit("combined ELF includes bridge/transport symbols")
          if document.get("root_sdl_symbols_present") is not False:
              raise SystemExit("combined ELF extracted a second SDL provider")
          PY

      - name: Install and relocate the combined runtime
        shell: bash
        run: |
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Base_Game
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Base_Content
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Qualification_Tools

      - name: Audit relocated runtime and retain provenance
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          build="$ROR_COMBINED_BUILD_DIR"
          test -x "$stage/RoR-Combined"
          test -x "$stage/RunRoR"
          test -x "$stage/qualification/bin/ror_state_trace"
          test ! -e "$stage/RoR"
          test ! -e "$stage/RoR-Ogre14"
          test -d "$stage/lib/OGRE"
          test -d "$stage/resources"
          test -d "$stage/resources/ogrenext/ShaderMedia"
          test -d "$stage/resources/ogrenext/Presentation"
          test -f "$stage/resources/ogrenext/.complete.json"
          test -d "$stage/content"
          if find "$stage/resources/ogrenext" -type l -print -quit \
              | grep -q .; then
            echo 'relocated Ogre-Next media contains an indirect file'
            exit 1
          fi
          cmake -E make_directory "$stage/qualification"
          readelf --file-header --dynamic "$stage/RoR-Combined" \
            | tee "$stage/qualification/RoR-Combined.readelf.txt"
          ldd "$stage/RoR-Combined" \
