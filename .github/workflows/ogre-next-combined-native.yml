          evidence="$ROR_COMBINED_PACKAGE_DIR/qualification/deterministic-savegame-resume"
          executable="$app/Contents/MacOS/RoR-Combined"
          trace_tool="$ROR_COMBINED_BUILD_DIR/qualification-tools/ror_state_trace"
          runtime_content="$app/Contents/Resources/content"
          test -x "$executable"
          test -x "$trace_tool"
          test -f "$runtime_content/agora.zip"
          test -f "$runtime_content/simple2-terrain.zip"
          test ! -e "$evidence"
          python tools/run_deterministic_savegame_resume.py \
            --executable "$executable" \
            --trace-tool "$trace_tool" \
            --runtime-content "$runtime_content" \
            --artifact-dir "$evidence" \
            --workers 1 \
            --timeout 900
          python - "$evidence/report.json" "$GITHUB_SHA" <<'PY'
          import json
          import re
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "format": "ror-d0-deterministic-savegame-resume-report-v1",
              "repository_commit": sys.argv[2],
              "repository_dirty": False,
              "content_commit": "34fefdd126784bf87b068fc283f812525d159dd7",
              "scenario_id": 2026082001,
              "target_id": 2026082001001,
              "checkpoint_step": 120,
              "final_step": 240,
              "workers": 1,
              "terminal_state_exact": True,
              "input_artifacts_exact": True,
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(
                      f"save/resume report changed: {field}={report.get(field)!r}"
                  )
          digest = report.get("final_state_digest")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("save/resume report lacks a terminal state digest")
          observations = report.get("observations")
          if not isinstance(observations, dict) or set(observations) != {"record", "resume"}:
              raise SystemExit("save/resume report lacks exact record/resume observations")
          for label, first, count in (("record", 0, 240), ("resume", 120, 120)):
              observation = observations[label]
              inspection = observation.get("inspection", {})
              metadata = inspection.get("metadata", {})
              final = inspection.get("final_step", {})
              if (metadata.get("first_physics_step"), inspection.get("step_count")) != (first, count):
                  raise SystemExit(f"save/resume {label} trace span changed")
              if final.get("physics_step") != 239 or final.get("state_digest") != digest:
                  raise SystemExit(f"save/resume {label} terminal state changed")
          if observations["record"].get("input_sha256") != observations["resume"].get("input_sha256"):
              raise SystemExit("save/resume authenticated input digest differs")
          PY

      - name: Package the signed application and deterministic inventory
        shell: bash
        run: |
          build="$ROR_COMBINED_BUILD_DIR"
          package="$ROR_COMBINED_PACKAGE_DIR"
          app="$build/bin/RoR-Combined.app"
          archive="$package/RoR-Combined-macOS-arm64.zip"
          test -d "$app"
          test ! -e "$archive"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" \
            | tee "$package/RoR-Combined-macOS-arm64.zip.sha256"
          python - "$package" "$app" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1]).resolve(strict=True)
          app = Path(sys.argv[2]).resolve(strict=True)
          source_commit = sys.argv[3]
          archive = root / "RoR-Combined-macOS-arm64.zip"
          executable = app / "Contents/MacOS/RoR-Combined"
          document = {
              "schema": "ror.ogre_next_combined_macos_package.v2",
              "source_commit": source_commit,
              "platform_policy": "macos-arm64-metal",
              "entrypoint": "RoR-Combined.app",
              "executable": "RoR-Combined.app/Contents/MacOS/RoR-Combined",
              "renderer": "ogre-next",
              "legacy_resource_host": "ogre14-hidden",
              "legacy_visible_presentation": False,
              "presentation_failure_policy": "fail-closed",
              "renderer_smoke_only": False,
              "packaged_scene_smoke": True,
              "nicemetal_resource_host_shader_smoke": {
                  "qualified": True,
                  "scope": "ogre14-hidden-resource-host-managed-template-shader-compile-load",
                  "receipt": "qualification/nicemetal-resource-host-shader-smoke/receipt.json",
                  "visible_nicemetal_draw_proven": False,
              },
              "default_scene": {
                  "terrain": "simple2_a.terrn2",
                  "actor": "b6b0UID-semi.truck",
              },
              "actor_control_qualified": False,
              "deterministic_impact_regression": {
                  "qualified": True,
                  "report": "qualification/agora-impact-regression/report.json",
                  "workers": [1, 8],
                  "steps": 6000,
                  "exact_state_trace_match": True,
                  "material_claim": "numerical-impact-fixture-not-physical-calibration",
              },
              "deterministic_savegame_resume": {
                  "qualified": True,
                  "report": "qualification/deterministic-savegame-resume/report.json",
                  "checkpoint_step": 120,
                  "final_step": 240,
                  "workers": 1,
                  "terminal_state_exact": True,
                  "input_artifacts_exact": True,
              },
              "runtime_package_qualified": True,
              "playability_qualified": False,
              "archive": {
                  "path": archive.name,
                  "size": archive.stat().st_size,
                  "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              },
              "runtime_executable_sha256": hashlib.sha256(
                  executable.read_bytes()
              ).hexdigest(),
          }
          (root / "qualification/package-inventory.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload qualified macOS RoR-Combined runtime
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-macOS-arm64-Metal-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          compression-level: 0
          path: ${{ runner.temp }}/ror-combined-macos-package/

      - name: Upload macOS combined-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-macOS-arm64-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ror-combined-artifacts/
            ${{ runner.temp }}/ror-combined-build/CMakeCache.txt
            ${{ runner.temp }}/ror-combined-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/ror-combined-build/ogre-next-embedded/*.json
            ${{ runner.temp }}/ror-combined-build/source/main/RoR-Combined.*
            ${{ runner.temp }}/ror-combined-build/bin/RoR-Combined.app/
            ${{ runner.temp }}/ror-combined-macos-package/qualification/
            ${{ runner.temp }}/ror-combined-nicemetal-resource-host/
            ${{ runner.temp }}/ror-combined-packaged-scene/

  windows-x64-d3d11:
    name: Windows x64 D3D11 RoR-Combined
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CC: cl
      CXX: cl
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate all generated Windows state from the source checkout
        shell: pwsh
        run: |
          @(
            "CONAN_HOME=$(Join-Path $env:RUNNER_TEMP 'ror-combined-conan-home')"
            "ROR_COMBINED_ARTIFACTS_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-artifacts')"
            "ROR_COMBINED_BUILD_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-build')"
            "ROR_COMBINED_STAGE_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-stage')"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM

      - name: Enable the pinned MSVC x64 toolset
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: "14.44"

      - name: Install pinned Conan and Ninja clients
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-conan-home
          key: ogre-next-combined-windows-msvc1944-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CONAN_HOME | Out-Null
          @'
          tools.system.package_manager:mode=install
          core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]
          '@ | Set-Content -LiteralPath (Join-Path $env:CONAN_HOME 'global.conf') -Encoding utf8NoBOM
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:ROR_COMBINED_ARTIFACTS_DIR | Out-Null
          python cmake/conan/export_pinned_dependency_recipes.py `
            --archive (Join-Path $env:RUNNER_TEMP 'ror-conan-recipes-d3568327.tar.gz') `
            --extract-root (Join-Path $env:RUNNER_TEMP 'ror-conan-recipes-export') |
            Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'pinned-conan-recipes.json')

      - name: Verify compiler, architecture, and PE audit tool
        shell: pwsh
        run: |
          cl 2>&1 | Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'msvc-version.txt')
          if (-not (Select-String -LiteralPath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'msvc-version.txt') -Pattern 'Version 19\.44\.')) {
            throw 'The reviewed MSVC 19.44 toolset is not active'
          }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          & $dumpbin.Source /nologo /headers $dumpbin.Source | Select-Object -First 20
          cmake --version
          ninja --version

      - name: Compile and run native render-pass metrics behavioral gate
        shell: pwsh
        run: |
          $gate = Join-Path $env:RUNNER_TEMP 'ror-ogre-next-native-render-pass-metrics-gate'
          if (Test-Path -LiteralPath $gate) {
            throw "Native render-pass metrics gate directory already exists: $gate"
          }
          New-Item -ItemType Directory -Path $gate -ErrorAction Stop | Out-Null
          $testSource = (Resolve-Path -LiteralPath 'tests/gfx/render/OgreNextNativeRenderPassMetricsTests.cpp' -ErrorAction Stop).Path
          $productionSource = (Resolve-Path -LiteralPath 'source/main/gfx/render/ogrenext/OgreNextNativeRenderPassMetrics.cpp' -ErrorAction Stop).Path
          $includeDirectory = (Resolve-Path -LiteralPath 'source/main/gfx/render/ogrenext' -ErrorAction Stop).Path
          $binary = Join-Path $gate 'ror_ogre_next_native_render_pass_metrics_tests.exe'
          Push-Location $gate
          try {
            & cl.exe /nologo /std:c++17 /EHsc /W4 /WX /permissive- /fp:strict /Zc:__cplusplus `
              "/I$includeDirectory" $testSource $productionSource "/Fe$binary"
            if ($LASTEXITCODE -ne 0) {
              throw "Native render-pass metrics gate compilation failed with exit code $LASTEXITCODE"
            }
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Native render-pass metrics gate binary is missing: $binary"
            }
            & $binary
            if ($LASTEXITCODE -ne 0) {
              throw "Native render-pass metrics behavioral gate failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Compile the complete Shader Model 4 HLSL source closure
        shell: pwsh
        run: |
          if (-not $env:WindowsSdkDir -or -not $env:WindowsSDKVersion) {
            throw 'The active MSVC environment did not expose a Windows SDK'
          }
          $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\')
          $candidate = Join-Path $env:WindowsSdkDir "bin\$sdkVersion\x64\fxc.exe"
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw "The active Windows SDK has no x64 fxc.exe: $candidate"
          }
          $fxc = (Resolve-Path -LiteralPath $candidate -ErrorAction Stop).Path
          if ((Split-Path -Leaf $fxc) -cne 'fxc.exe') {
            throw "The resolved shader compiler is not fxc.exe: $fxc"
          }
          $fxcItem = Get-Item -LiteralPath $fxc -ErrorAction Stop
          $fxcHash = (Get-FileHash -LiteralPath $fxc -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = [ordered]@{
            schema = 'ror.windows-sdk-fxc-provenance@1'
            sdkVersion = $sdkVersion
            fileVersion = $fxcItem.VersionInfo.FileVersion
            productVersion = $fxcItem.VersionInfo.ProductVersion
            sha256 = $fxcHash
            size = $fxcItem.Length
          }
          $provenancePath = Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'windows-x86_64-fxc-provenance.json'
          $provenance | ConvertTo-Json | Set-Content -LiteralPath $provenancePath -Encoding utf8NoBOM

          $receiptPath = Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'windows-x86_64-modern-hlsl-source-compile.json'
          & python tools/validate_modern_hlsl_sources.py `
            --repository-root . `
            --fxc $fxc `
            --evidence-out $receiptPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Shader Model 4 HLSL source compilation failed'
          }
          $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.schema -ne 'ror.modern-hlsl-source-compile-evidence.v2') {
            throw 'Unexpected HLSL source-compile receipt schema'
          }
          if ($receipt.case_count -ne 97) {
            throw "HLSL source-compile closure is incomplete: $($receipt.case_count)"
          }
          if (
            $receipt.input_integrity.hlsl_source_count -ne 36 -or
            $receipt.input_integrity.compiled_hlsl_source_count -ne 27 -or
            $receipt.excluded_sources.rtshader_combined_sampler_compatibility.Count -ne 9
          ) {
            throw 'HLSL source/exclusion accounting is incomplete'
          }
          if (-not $receipt.claims.hlsl_source_compile_proven) {
            throw 'HLSL source compilation was not proven'
          }
          if (
            $receipt.claims.rtshader_compatibility_hlsl_compile_proven -or
            $receipt.claims.live_ogre14_rtshader_package_compile_proven -or
            $receipt.claims.ogre_resource_load_proven -or
            $receipt.claims.rendered_frame_proven -or
            $receipt.claims.runtime_playability_proven
          ) {
            throw 'HLSL source receipt overclaims runtime or rendering evidence'
          }

      - name: Run combined-runtime fail-closed contracts
        shell: pwsh
        run: |
          function Invoke-CheckedPython {
            param([string[]]$PythonArguments)
            & python @PythonArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Combined-runtime contract failed: python $($PythonArguments -join ' ')"
            }
          }
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_ogre_next_combined_provider_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_ogre_next_embedded_namespace_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_playable_performance_scene.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_verify_native_a1_lod_runtime.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_agora_impact_regression.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_deterministic_savegame_resume.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_jbeam_inter_actor_collision.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_jbeam_wheel2_spawn.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_renderer_combined_game_wiring_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_mygui_glsl_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_skyx_glsl_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_ogre14_remaining_glsl_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_modern_shader_source_closure.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_cg_runtime_route_retired_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_rtshader_modern_only_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_managed_pssm_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_caelum_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_fresnel_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_grass_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_general_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_nicemetal_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_nicemetal_shader_smoke.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_ogre_next_combined_provider_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_ogre_next_embedded_namespace_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_playable_performance_scene.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_verify_native_a1_lod_runtime.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_agora_impact_regression.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_deterministic_savegame_resume.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_jbeam_inter_actor_collision.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_jbeam_wheel2_spawn.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_renderer_combined_game_wiring_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_mygui_glsl_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_skyx_glsl_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_ogre14_remaining_glsl_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_modern_shader_source_closure.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_cg_runtime_route_retired_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_rtshader_modern_only_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_managed_pssm_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_caelum_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_fresnel_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_grass_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_general_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_nicemetal_shader_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_nicemetal_shader_smoke.py')

      - name: Verify the locked native Conan graph
        shell: pwsh
        run: |
          python tests/tools/assert_ogre14_app_graph.py `
            --platform windows-x86_64 |
            Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'windows-x86_64-conan-graph.json')

      - name: Configure clean Windows RoR-Combined Release
        shell: pwsh
        run: |
          $tracked = git status --porcelain --untracked-files=no
          if ($tracked) {
            throw "The source checkout is dirty before configure: $tracked"
          }
          $conanProvider = Join-Path $env:GITHUB_WORKSPACE 'cmake/conan_provider.cmake'
          $conanProfile = Join-Path $env:GITHUB_WORKSPACE 'cmake/conan/profiles/windows-x86_64-release'
          $cmakeArguments = @(
            '-S', '.',
            '-B', $env:ROR_COMBINED_BUILD_DIR,
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_INSTALL_PREFIX=$env:ROR_COMBINED_STAGE_DIR",
            "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$conanProvider",
            "-DCONAN_HOST_PROFILE=$conanProfile",
            "-DCONAN_BUILD_PROFILE=$conanProfile",
            '-DROR_BUILD_TESTS=OFF',
            '-DROR_BUILD_QUALIFICATION_TOOLS=ON',
            '-DROR_CREATE_CONTENT_FOLDER=ON',
            '-DROR_OGRE_NEXT_COMBINED_RUNTIME=ON',
            '-DROR_RENDERER_PUBLIC_LAUNCHER=OFF',
            '-DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF',
            '-DROR_OGRE_NEXT_DEMO_ADMISSION=OFF'
          )
          & cmake @cmakeArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Windows RoR-Combined configure failed with exit code $LASTEXITCODE"
          }

      - name: Build and prove the final combined PE closure
        shell: pwsh
        run: >-
          cmake
          --build $env:ROR_COMBINED_BUILD_DIR
          --target ror_ogre_next_combined_verified
          --config Release

      - name: Require a qualification-eligible combined PE receipt
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["ROR_COMBINED_BUILD_DIR"])
          required = (
              build / "bin/RoR-Combined.exe",
              build / "source/main/RoR-Combined.binary-closure.json",
              build / "ogre-next-embedded/ogre-next-combined-namespace-audit.json",
              build / "bin/resources/ogrenext/.complete.json",
          )
          for path in required:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"required combined build output is unavailable: {path}")
          document = json.loads(required[1].read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_pe_closure.v1",
              "platform_policy": "windows-x64-d3d11",
              "qualification_eligible": True,
              "bridge_or_transport_symbols_present": False,
              "root_sdl_symbols_present": True,
              "ogre14_host_imports_present": True,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined PE closure changed: {field}={document.get(field)!r}"
                  )
          '@ | python -

      - name: Install and relocate the combined Windows runtime
        shell: pwsh
        run: |
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Base_Game
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Base_Content
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Qualification_Tools

      - name: Audit relocated runtime and retain provenance
        shell: pwsh
        run: |
          $stage = $env:ROR_COMBINED_STAGE_DIR
          $build = $env:ROR_COMBINED_BUILD_DIR
          $exe = Join-Path $stage 'RoR-Combined.exe'
          foreach ($path in @(
              $exe,
              (Join-Path $stage 'qualification/bin/ror_state_trace.exe'),
              (Join-Path $stage 'resources/ogrenext/ShaderMedia'),
              (Join-Path $stage 'resources/ogrenext/Presentation'),
              (Join-Path $stage 'resources/ogrenext/.complete.json'),
              (Join-Path $stage 'content')
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Relocated combined runtime input is missing: $path"
            }
          }
          @'
          import json
          import os
          from pathlib import Path

          receipt = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "resources/ogrenext/.complete.json"
          )
          document = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_resource_stage.v2",
              "runtime_layout": "resources/ogrenext",
              "shader_media_relative": "ShaderMedia",
              "presentation_media_relative": "Presentation",
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"Windows resource-stage receipt changed: "
                      f"{field}={document.get(field)!r}"
                  )
          digest = document.get("manifest_sha256")
          if not isinstance(digest, str) or len(digest) != 64:
              raise SystemExit("Windows resource-stage digest is invalid")
          if not isinstance(document.get("file_count"), int) or document["file_count"] <= 0:
              raise SystemExit("Windows resource-stage inventory is empty")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Windows resource-stage validation failed with exit code $LASTEXITCODE"
          }
          foreach ($forbidden in @('RoR.exe', 'RoR-Ogre14.exe')) {
            if (Test-Path -LiteralPath (Join-Path $stage $forbidden)) {
              throw "Relocated package contains a legacy-visible executable: $forbidden"
            }
          }
          $qualification = Join-Path $stage 'qualification'
          New-Item -ItemType Directory -Force -Path $qualification | Out-Null
          dumpbin /nologo /headers $exe |
            Tee-Object -FilePath (Join-Path $qualification 'RoR-Combined.headers.txt')
          dumpbin /nologo /dependents $exe |
            Tee-Object -FilePath (Join-Path $qualification 'RoR-Combined.dependents.txt')
          foreach ($pair in @(
              @('source/main/RoR-Combined.binary-closure.json', 'RoR-Combined.binary-closure.json'),
