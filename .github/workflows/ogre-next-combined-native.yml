      - name: Write deterministic Windows package inventory
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat

          root = Path(os.environ["ROR_COMBINED_STAGE_DIR"]).resolve(strict=True)
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"Windows package contains a symlink: {path}")
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == "qualification/package-inventory.json":
                  continue
              files.append(
                  {
                      "path": relative,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "mode": stat.S_IMODE(path.stat().st_mode),
                      "stage_kind": "regular",
                  }
              )
          document = {
              "schema": "ror.ogre_next_combined_windows_package.v3",
              "source_commit": os.environ["GITHUB_SHA"],
              "platform_policy": "windows-x64-d3d11",
              "entrypoint": "RoR-Combined.exe",
              "executable": "RoR-Combined.exe",
              "renderer": "ogre-next",
              "legacy_visible_presentation": False,
              "renderer_smoke_only": False,
              "packaged_scene_smoke": True,
              "default_scene": {
                  "terrain": "simple2_a.terrn2",
                  "actor": "b6b0UID-semi.truck",
              },
              "actor_control_qualified": True,
              "deterministic_impact_regression": {
                  "qualified": True,
                  "report": "qualification/agora-impact-regression/report.json",
                  "workers": [1, 8],
                  "steps": 6000,
                  "exact_state_trace_match": True,
                  "material_claim": "numerical-impact-fixture-not-physical-calibration",
              },
              "deterministic_savegame_resume": {
                  "qualified": True,
                  "report": "qualification/deterministic-savegame-resume/report.json",
                  "checkpoint_step": 120,
                  "final_step": 240,
                  "workers": 1,
                  "terminal_state_exact": True,
                  "input_artifacts_exact": True,
              },
              "playability_qualified": False,
              "artifact_transport": "github-actions-upload-artifact-v7",
              "all_transport_files_inventoried": True,
              "files": files,
          }
          output = root / "qualification/package-inventory.json"
          output.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          '@ | python -

