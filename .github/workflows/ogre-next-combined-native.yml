name: Ogre-Next combined native Release

on:
  push:
    branches: [master, nextgen/playable-performance-gate]
    paths:
      - .github/workflows/ogre-next-combined-native.yml
      - CMakeLists.txt
      - conanfile.py
      - cmake/OgreNextEmbeddedRuntime.cmake
      - cmake/conan/**
      - cmake/linux/**
      - cmake/macos/**
      - cmake/ogre_next_embedded/**
      - content-source/native_render/**
      - doc/nextgen/FORWARD_NATIVE_ASSET_LEDGER.md
      - resources/scripts/example_deterministic_input_resume_checkpoint.as
      - resources/scripts/example_deterministic_input_save_checkpoint.as
      - resources/nextgen/native/**
      - resources/mygui/**
      - source/main/**
      - tools/linux/RunRoR-combined
      - tools/ogre_next_probe/**
      - tools/run_agora_impact_regression.py
      - tools/run_calibrated_beam_soak.py
      - tools/run_deterministic_savegame_resume.py
      - tools/run_playable_performance_scene.py
      - tools/stage_ogre_next_combined_resources.py
      - tools/verify_ogre_next_combined_binary_closure.py
      - tools/verify_ogre_next_combined_elf_closure.py
      - tools/verify_ogre_next_combined_pe_closure.py
      - tests/tools/test_ogre_next_combined_provider_contract.py
      - tests/tools/test_ogre_next_embedded_namespace_contract.py
      - tests/tools/test_run_agora_impact_regression.py
      - tests/tools/test_run_calibrated_beam_soak.py
      - tests/tools/test_run_deterministic_savegame_resume.py
      - tests/tools/test_run_playable_performance_scene.py
      - tests/tools/test_renderer_combined_game_wiring_contract.py
      - tests/tools/test_mygui_glsl_contract.py
  pull_request:
    paths:
      - .github/workflows/ogre-next-combined-native.yml
      - CMakeLists.txt
      - conanfile.py
      - cmake/OgreNextEmbeddedRuntime.cmake
      - cmake/conan/**
      - cmake/linux/**
      - cmake/macos/**
      - cmake/ogre_next_embedded/**
      - content-source/native_render/**
      - doc/nextgen/FORWARD_NATIVE_ASSET_LEDGER.md
      - resources/scripts/example_deterministic_input_resume_checkpoint.as
      - resources/scripts/example_deterministic_input_save_checkpoint.as
      - resources/nextgen/native/**
      - resources/mygui/**
      - source/main/**
      - tools/linux/RunRoR-combined
      - tools/ogre_next_probe/**
      - tools/run_agora_impact_regression.py
      - tools/run_calibrated_beam_soak.py
      - tools/run_deterministic_savegame_resume.py
      - tools/run_playable_performance_scene.py
      - tools/stage_ogre_next_combined_resources.py
      - tools/verify_ogre_next_combined_binary_closure.py
      - tools/verify_ogre_next_combined_elf_closure.py
      - tools/verify_ogre_next_combined_pe_closure.py
      - tests/tools/test_ogre_next_combined_provider_contract.py
      - tests/tools/test_ogre_next_embedded_namespace_contract.py
      - tests/tools/test_run_agora_impact_regression.py
      - tests/tools/test_run_calibrated_beam_soak.py
      - tests/tools/test_run_deterministic_savegame_resume.py
      - tests/tools/test_run_playable_performance_scene.py
      - tests/tools/test_renderer_combined_game_wiring_contract.py
      - tests/tools/test_mygui_glsl_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogre-next-combined-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-vulkan:
    name: Linux x86_64 Vulkan RoR-Combined
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: gcc-11
      CXX: g++-11
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate all generated state from the source checkout
        shell: bash
        run: |
          {
            echo "CONAN_HOME=$RUNNER_TEMP/ror-combined-conan-home"
            echo "ROR_COMBINED_ARTIFACTS_DIR=$RUNNER_TEMP/ror-combined-artifacts"
            echo "ROR_COMBINED_BUILD_DIR=$RUNNER_TEMP/ror-combined-build"
            echo "ROR_COMBINED_STAGE_DIR=$RUNNER_TEMP/ror-combined-stage"
          } >> "$GITHUB_ENV"

      - name: Install Linux build and software-rendering prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            file \
            gcc-11 \
            g++-11 \
            gdb \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxaw7-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxt-dev \
            mesa-vulkan-drivers \
            mesa-utils \
            vulkan-tools \
            xauth \
            xvfb \
            xdotool
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp*json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Install pinned Conan and Ninja clients
        shell: bash
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-conan-home
          key: ogre-next-combined-linux-gcc11-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          home = Path(os.environ["CONAN_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          (home / "global.conf").write_text(
              "tools.system.package_manager:mode=install\n"
              "tools.system.package_manager:sudo=True\n"
              'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n',
              encoding="utf-8",
          )
          PY
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: bash
        run: |
          cmake -E make_directory "$ROR_COMBINED_ARTIFACTS_DIR"
          python cmake/conan/export_pinned_dependency_recipes.py \
            --archive "$RUNNER_TEMP/ror-conan-recipes-d3568327.tar.gz" \
            --extract-root "$RUNNER_TEMP/ror-conan-recipes-export" \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/pinned-conan-recipes.json"

      - name: Verify compiler, architecture, and Vulkan software device
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(gcc-11 -dumpfullversion | cut -d. -f1)" = "11"
          test "$(g++-11 -dumpfullversion | cut -d. -f1)" = "11"
          gcc-11 --version
          g++-11 --version
          readelf --version
          nm --version
          vulkaninfo --summary

      - name: Run combined-runtime fail-closed contracts
        shell: bash
        run: |
          python tests/tools/test_ogre_next_combined_provider_contract.py
          python tests/tools/test_ogre_next_embedded_namespace_contract.py
          python tests/tools/test_run_playable_performance_scene.py
          python tests/tools/test_run_agora_impact_regression.py
          python tests/tools/test_run_deterministic_savegame_resume.py
          python tests/tools/test_renderer_combined_game_wiring_contract.py
          python tests/tools/test_mygui_glsl_contract.py
          python -O tests/tools/test_ogre_next_combined_provider_contract.py
          python -O tests/tools/test_ogre_next_embedded_namespace_contract.py
          python -O tests/tools/test_run_playable_performance_scene.py
          python -O tests/tools/test_run_agora_impact_regression.py
          python -O tests/tools/test_run_deterministic_savegame_resume.py
          python -O tests/tools/test_renderer_combined_game_wiring_contract.py
          python -O tests/tools/test_mygui_glsl_contract.py

      - name: Verify the locked native Conan graph
        shell: bash
        run: |
          python tests/tools/assert_ogre14_app_graph.py \
            --platform linux-x86_64 \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/linux-x86_64-conan-graph.json"

      - name: Configure clean Linux RoR-Combined Release
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          cmake \
            -S . \
            -B "$ROR_COMBINED_BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ROR_COMBINED_STAGE_DIR" \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DCONAN_HOST_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DCONAN_BUILD_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DROR_BUILD_TESTS=OFF \
            -DROR_BUILD_QUALIFICATION_TOOLS=ON \
            -DROR_CREATE_CONTENT_FOLDER=ON \
            -DROR_OGRE_NEXT_COMBINED_RUNTIME=ON \
            -DROR_RENDERER_PUBLIC_LAUNCHER=OFF \
            -DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF \
            -DROR_OGRE_NEXT_DEMO_ADMISSION=OFF

      - name: Build and prove the final combined ELF closure
        shell: bash
        run: >-
          cmake
          --build "$ROR_COMBINED_BUILD_DIR"
          --target ror_ogre_next_combined_verified
          --config Release

      - name: Require a qualification-eligible combined build receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["ROR_COMBINED_BUILD_DIR"])
          binary = build / "bin/RoR-Combined"
          closure = build / "source/main/RoR-Combined.binary-closure.json"
          namespace = build / "ogre-next-embedded/ogre-next-combined-namespace-audit.json"
          resources = build / "bin/resources/ogrenext/.complete.json"
          for path in (binary, closure, namespace, resources):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"required combined build output is unavailable: {path}")
          document = json.loads(closure.read_text(encoding="utf-8"))
          if document.get("schema") != "ror.ogre_next_combined_elf_closure.v1":
              raise SystemExit("combined ELF closure schema changed")
          if document.get("platform_policy") != "linux-x86_64-vulkan":
              raise SystemExit("combined ELF platform policy changed")
          if document.get("qualification_eligible") is not True:
              raise SystemExit("combined ELF closure is not qualification eligible")
          if document.get("bridge_or_transport_symbols_present") is not False:
              raise SystemExit("combined ELF includes bridge/transport symbols")
          if document.get("root_sdl_symbols_present") is not False:
              raise SystemExit("combined ELF extracted a second SDL provider")
          PY

      - name: Install and relocate the combined runtime
        shell: bash
        run: |
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Base_Game
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Base_Content
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Qualification_Tools

      - name: Audit relocated runtime and retain provenance
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          build="$ROR_COMBINED_BUILD_DIR"
          test -x "$stage/RoR-Combined"
          test -x "$stage/RunRoR"
          test -x "$stage/qualification/bin/ror_state_trace"
          test ! -e "$stage/RoR"
          test ! -e "$stage/RoR-Ogre14"
          test -d "$stage/lib/OGRE"
          test -d "$stage/resources"
          test -d "$stage/resources/ogrenext/ShaderMedia"
          test -d "$stage/resources/ogrenext/Presentation"
          test -f "$stage/resources/ogrenext/.complete.json"
          test -d "$stage/content"
          if find "$stage/resources/ogrenext" -type l -print -quit \
              | grep -q .; then
            echo 'relocated Ogre-Next media contains an indirect file'
            exit 1
          fi
          cmake -E make_directory "$stage/qualification"
          readelf --file-header --dynamic "$stage/RoR-Combined" \
            | tee "$stage/qualification/RoR-Combined.readelf.txt"
          ldd "$stage/RoR-Combined" \
            | tee "$stage/qualification/RoR-Combined.ldd.txt"
          if grep -Fq 'not found' "$stage/qualification/RoR-Combined.ldd.txt"; then
            echo 'relocated RoR-Combined has an unresolved shared library'
            exit 1
          fi
          if grep -Fq "$build" "$stage/qualification/RoR-Combined.readelf.txt" \
              || grep -Fq "$build" "$stage/qualification/RoR-Combined.ldd.txt"; then
            echo 'relocated RoR-Combined retains its build root'
            exit 1
          fi
          if grep -aFq "$build/bin/resources/ogrenext" \
              "$stage/RoR-Combined"; then
            echo 'relocated RoR-Combined embeds its build-tree media root'
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          completion = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "resources/ogrenext/.complete.json"
          )
          document = json.loads(completion.read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_resource_stage.v2",
              "runtime_layout": "resources/ogrenext",
              "shader_media_relative": "ShaderMedia",
              "presentation_media_relative": "Presentation",
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined package media receipt changed: {field}={document.get(field)!r}"
                  )
          if not isinstance(document.get("file_count"), int) or document["file_count"] <= 0:
              raise SystemExit("combined package media receipt has no files")
          manifest_sha256 = document.get("manifest_sha256")
          if (
              not isinstance(manifest_sha256, str)
              or len(manifest_sha256) != 64
              or any(character not in "0123456789abcdef" for character in manifest_sha256)
          ):
              raise SystemExit("combined package media receipt digest is invalid")
          PY
          cmake -E copy \
            "$build/source/main/RoR-Combined.binary-closure.json" \
            "$stage/qualification/RoR-Combined.binary-closure.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-namespace-audit.json" \
            "$stage/qualification/ogre-next-combined-namespace-audit.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-provider-contract.json" \
            "$stage/qualification/ogre-next-combined-provider-contract.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre14-runtime-manifest.txt" \
            "$stage/qualification/ogre14-runtime-manifest.txt"
          cmake -E copy \
            "$build/bin/resources/ogrenext/.complete.json" \
            "$stage/qualification/ogre-next-combined-resources.complete.json"

          quarantine="$RUNNER_TEMP/ror-combined-build-media-quarantine"
          test ! -e "$quarantine"
          mv "$build/bin/resources/ogrenext" "$quarantine"
          test ! -e "$build/bin/resources/ogrenext"

      - name: Render bounded Ogre-Next frames with relocated Vulkan runtime
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          smoke="$RUNNER_TEMP/ror-combined-smoke"
          cmake -E make_directory "$smoke/home" "$smoke/config" "$smoke/cache" "$smoke/data"
          receipt="$stage/qualification/renderer-smoke.json"
          test ! -e "$receipt"
          test ! -e "$ROR_COMBINED_BUILD_DIR/bin/resources/ogrenext"
          test -d "$stage/resources/ogrenext/ShaderMedia"
          test -d "$stage/resources/ogrenext/Presentation"
          set +e
          HOME="$smoke/home" \
          XDG_CONFIG_HOME="$smoke/config" \
          XDG_CACHE_HOME="$smoke/cache" \
          XDG_DATA_HOME="$smoke/data" \
          timeout --signal=TERM 120s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$stage/RunRoR" \
              --native-visual-showcase \
              -frame-budget measure \
              -frame-budget-receipt "$receipt" \
              -frame-budget-scenario ci.ogre-next-combined.renderer-smoke \
              -frame-budget-sustained-ms 1000 \
              -frame-budget-percentile 99 \
              -frame-budget-percentile-ms 1000 \
              -frame-budget-warmup 2 \
              -frame-budget-minimum 8 \
              -frame-budget-frames 12 \
            > "$stage/qualification/renderer-smoke.stdout.log" \
            2> "$stage/qualification/renderer-smoke.stderr.log"
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 0 ]]; then
            HOME="$smoke/home" \
            XDG_CONFIG_HOME="$smoke/config" \
            XDG_CACHE_HOME="$smoke/cache" \
            XDG_DATA_HOME="$smoke/data" \
            LD_LIBRARY_PATH="$stage/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            timeout --signal=TERM 120s \
              xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              gdb --batch \
                -ex 'set pagination off' \
                -ex run \
                -ex 'thread apply all backtrace full' \
                --args "$stage/RoR-Combined" \
                  --native-visual-showcase \
                  -frame-budget measure \
                  -frame-budget-receipt "$receipt" \
                  -frame-budget-scenario ci.ogre-next-combined.renderer-smoke \
                  -frame-budget-sustained-ms 1000 \
                  -frame-budget-percentile 99 \
                  -frame-budget-percentile-ms 1000 \
                  -frame-budget-warmup 2 \
                  -frame-budget-minimum 8 \
                  -frame-budget-frames 12 \
              > "$stage/qualification/renderer-smoke.gdb.log" 2>&1 || true
            exit "$smoke_status"
          fi
          smoke_log="$stage/qualification/renderer-smoke.stdout.log"
          if grep -Fq '[RoR|RendererCombined|Scene] Snapshot not presented' "$smoke_log"; then
            echo "Ogre-Next showcase rejected a scene snapshot" >&2
            exit 1
          fi
          if ! grep -Fq '[RoR|RendererCombined|NativeShowcase|Turntable]' "$smoke_log"; then
            echo "Ogre-Next showcase produced no presented-scene receipt" >&2
            exit 1
          fi
          if grep -Fq "$ROR_COMBINED_BUILD_DIR/bin/resources/ogrenext" \
              "$stage/qualification/renderer-smoke.stdout.log" \
              "$stage/qualification/renderer-smoke.stderr.log"; then
            echo "relocated Ogre-Next smoke accessed build-tree media" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "qualification/renderer-smoke.json"
          )
          document = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "format": "ror-frame-time-budget-v1",
              "mode": "measure",
              "scenario_id": "ci.ogre-next-combined.renderer-smoke",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requested_frames": 12,
              "accepted_frames": 12,
              "rejected_frames": 0,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined renderer smoke receipt changed: {field}={document.get(field)!r}"
                  )
          PY

      - name: Render packaged Simple2 and semi through Ogre-Next
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          scene="$RUNNER_TEMP/ror-combined-packaged-scene"
          test -f "$stage/content/simple2-terrain.zip"
          test -f "$stage/content/dafsemi.zip"
          test ! -e "$scene"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
          python tools/run_playable_performance_scene.py \
            --executable "$stage/RunRoR" \
            --artifact-dir "$scene" \
            --scenario-id ci.ogre-next-combined.packaged-simple2-semi \
            --terrain simple2_a.terrn2 \
            --actor b6b0UID-semi.truck \
            --graphics-preset high \
            --width 1280 \
            --height 720 \
            --warmup-frames 2 \
            --minimum-frames 24 \
            --frames 24 \
            --sustained-ms 1000 \
            --percentile 99 \
            --percentile-ms 1000 \
            --qualify-actor-control \
            --measure-only \
            --timeout 180
          python - "$scene/performance-run.json" <<'PY'
          import json
          import sys

          document = json.load(open(sys.argv[1], encoding="utf-8"))
          receipt = document.get("receipt", {})
          renderer = document.get("renderer", {})
          expected = {
              "scenario_id": "ci.ogre-next-combined.packaged-simple2-semi",
              "terrain": "simple2_a.terrn2",
              "actor": "b6b0UID-semi.truck",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requires_native_scene_draw_metrics": True,
              "accepted_frames": 24,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 24,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if receipt.get(field) != value:
                  raise SystemExit(
                      f"packaged scene receipt changed: {field}={receipt.get(field)!r}"
                  )
          if renderer.get("startup_capture_rejections") != 0:
              raise SystemExit("packaged scene rejected an Ogre-Next capture")
          if renderer.get("render_system") != "ogre-next-vulkan":
              raise SystemExit("packaged scene did not identify visible Ogre-Next Vulkan")
          if renderer.get("resource_host_render_system") != "OpenGL 3+ Rendering Subsystem":
              raise SystemExit("packaged scene did not isolate the hidden OGRE14 resource host")
          ownership = renderer.get("presentation_ownership", {})
          if ownership != {
              "presentation_owner": "ogre-next",
              "visible_render_system": "ogre-next-vulkan",
              "visible_window": True,
              "legacy_visible_fallback": False,
              "resource_host": "ogre14",
              "resource_host_visible": False,
              "resource_host_protected": True,
          }:
              raise SystemExit("packaged scene presentation ownership changed")
          native = renderer.get("native_distance_lod", {})
          if native.get("available") is not True or native.get("pbs", 0) <= 0:
              raise SystemExit("packaged scene produced no native PBS/LOD frame")
          control = renderer.get("actor_control", {})
          if control.get("qualified") is not True or control.get("control") != "truck_accelerate":
              raise SystemExit("packaged scene produced no qualified actor-control receipt")
          driver = renderer.get("actor_control_driver", {})
          if driver.get("process_external") is not True or driver.get("backend") != "x11-xtest-xdotool":
              raise SystemExit("packaged scene did not use the external X11 input driver")
          PY
          grep -Fq '===== LOADING TERRAIN simple2_a.terrn2' "$scene/RoR.log"
          grep -Fq '== Spawning vehicle: Daf Semi truck' "$scene/RoR.log"
          if grep -Eq "Program '[^']+\\.(glsl|glsles)' is not supported" \
              "$scene/RoR.log" "$scene/console.txt"; then
            echo 'MyGUI GLSL compilation failed in the packaged combined runtime' >&2
            exit 1
          fi
          if grep -Fq -- '--native-visual-showcase' "$scene/performance-run.json"; then
            echo 'packaged scene smoke selected the renderer-only showcase' >&2
            exit 1
          fi
          destination="$stage/qualification/packaged-scene-smoke"
          cmake -E make_directory "$destination"
          cmake -E copy "$scene/performance-run.json" "$destination/performance-run.json"
          cmake -E copy "$scene/frame-time-receipt.json" "$destination/frame-time-receipt.json"
          cmake -E copy "$scene/RoR.log" "$destination/RoR.log"
          cmake -E copy "$scene/console.txt" "$destination/console.txt"

      - name: Prove authenticated deterministic Agora impact through packaged RoR-Combined
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          evidence="$stage/qualification/agora-impact-regression"
          test -x "$stage/RoR-Combined"
          test -x "$stage/qualification/bin/ror_state_trace"
          test -f "$stage/content/agora.zip"
          test -f "$stage/content/simple2-terrain.zip"
          test ! -e "$evidence"
          LD_LIBRARY_PATH="$stage/lib" \
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
          python tools/run_agora_impact_regression.py \
            --executable "$stage/RoR-Combined" \
            --trace-tool "$stage/qualification/bin/ror_state_trace" \
            --runtime-content "$stage/content" \
            --artifact-dir "$evidence" \
            --runs 1 \
            --workers 1 8 \
            --timeout 900
          python - "$evidence/report.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "format": "ror-p1-agora-impact-regression-v2",
              "repository_commit": sys.argv[2],
              "content_commit": "34fefdd126784bf87b068fc283f812525d159dd7",
              "source_sha256": "09730ea7988b1f3c19ad88e78e0645d32d2ca84c004357fd2437cd97b124ea38",
              "fixture_sha256": "f3f2b5672864fbe9fac7da657aad708b708d4511479ce103730a49856ebc41f2",
              "scenario_id": 2026082001,
              "steps": 6000,
              "state_trace_interval_steps": 1,
              "telemetry_sample_interval_steps": 100,
              "workers": [1, 8],
              "runs_per_worker": 1,
              "material_claim": "numerical-impact-fixture-not-physical-calibration",
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(
                      f"Agora impact report changed: {field}={report.get(field)!r}"
                  )
          results = report.get("results")
          if not isinstance(results, list) or [row.get("workers") for row in results] != [1, 8]:
              raise SystemExit("Agora impact report lacks exact 1/8-worker results")
          for row in results:
              digest = row.get("trace_sha256")
              if not isinstance(digest, str) or len(digest) != 64:
                  raise SystemExit("Agora impact result lacks a trace digest")
          if report.get("cross_worker_trace_comparisons") != [{
              "left_trace": "traces/worker-01-run-01.rortrace",
              "left_workers": 1,
              "right_trace": "traces/worker-08-run-01.rortrace",
              "right_workers": 8,
              "status": "match",
              "steps_compared": 6000,
          }]:
              raise SystemExit("Agora impact report lacks the exact cross-worker match")
          PY

      - name: Prove exact deterministic save and resume through packaged RoR-Combined
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          evidence="$stage/qualification/deterministic-savegame-resume"
          test -x "$stage/RoR-Combined"
          test -x "$stage/qualification/bin/ror_state_trace"
          test -f "$stage/content/agora.zip"
          test -f "$stage/content/simple2-terrain.zip"
          test ! -e "$evidence"
          LD_LIBRARY_PATH="$stage/lib" \
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
          python tools/run_deterministic_savegame_resume.py \
            --executable "$stage/RoR-Combined" \
            --trace-tool "$stage/qualification/bin/ror_state_trace" \
            --runtime-content "$stage/content" \
            --artifact-dir "$evidence" \
            --workers 1 \
            --timeout 900
          python - "$evidence/report.json" "$GITHUB_SHA" <<'PY'
          import json
          import re
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "format": "ror-d0-deterministic-savegame-resume-report-v1",
              "repository_commit": sys.argv[2],
              "repository_dirty": False,
              "content_commit": "34fefdd126784bf87b068fc283f812525d159dd7",
              "scenario_id": 2026082001,
              "target_id": 2026082001001,
              "checkpoint_step": 120,
              "final_step": 240,
              "workers": 1,
              "terminal_state_exact": True,
              "input_artifacts_exact": True,
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(
                      f"save/resume report changed: {field}={report.get(field)!r}"
                  )
          digest = report.get("final_state_digest")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("save/resume report lacks a terminal state digest")
          observations = report.get("observations")
          if not isinstance(observations, dict) or set(observations) != {"record", "resume"}:
              raise SystemExit("save/resume report lacks exact record/resume observations")
          for label, first, count in (("record", 0, 240), ("resume", 120, 120)):
              observation = observations[label]
              inspection = observation.get("inspection", {})
              metadata = inspection.get("metadata", {})
              final = inspection.get("final_step", {})
              if (metadata.get("first_physics_step"), inspection.get("step_count")) != (first, count):
                  raise SystemExit(f"save/resume {label} trace span changed")
              if final.get("physics_step") != 239 or final.get("state_digest") != digest:
                  raise SystemExit(f"save/resume {label} terminal state changed")
          if observations["record"].get("input_sha256") != observations["resume"].get("input_sha256"):
              raise SystemExit("save/resume authenticated input digest differs")
          PY

      - name: Write deterministic package inventory
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          python - "$stage" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import sys

          root = Path(sys.argv[1]).resolve(strict=True)
          source_commit = sys.argv[2]
          files = []
          staged_symlink_count = 0
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  if not path.is_file():
                      raise SystemExit(
                          f"package contains an unsupported non-file symlink: {path}"
                      )
                  link_target = os.readlink(path)
                  if os.path.isabs(link_target):
                      raise SystemExit(
                          f"package symlink has an absolute target: {path}"
                      )
                  resolved_target = path.resolve(strict=True)
                  try:
                      resolved_target.relative_to(root)
                  except ValueError:
                      raise SystemExit(
                          f"package symlink escapes the install root: {path}"
                      )
                  stage_kind = "symlink"
                  staged_symlink_count += 1
              elif path.is_file():
                  link_target = None
                  stage_kind = "regular"
              else:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == "qualification/package-inventory.json":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entry = {
                  "path": relative,
                  "size": path.stat().st_size,
                  "sha256": digest,
                  "mode": stat.S_IMODE(path.stat().st_mode),
                  "stage_kind": stage_kind,
              }
              if link_target is not None:
                  entry["stage_link_target"] = link_target
              files.append(entry)
          document = {
              "schema": "ror.ogre_next_combined_linux_package.v4",
              "source_commit": source_commit,
              "platform_policy": "linux-x86_64-vulkan",
              "entrypoint": "RunRoR",
              "executable": "RoR-Combined",
              "renderer": "ogre-next",
              "legacy_visible_presentation": False,
              "renderer_smoke_only": False,
              "packaged_scene_smoke": True,
              "default_scene": {
                  "terrain": "simple2_a.terrn2",
                  "actor": "b6b0UID-semi.truck",
              },
              "actor_control_qualified": True,
              "deterministic_impact_regression": {
                  "qualified": True,
                  "report": "qualification/agora-impact-regression/report.json",
                  "workers": [1, 8],
                  "steps": 6000,
                  "exact_state_trace_match": True,
                  "material_claim": "numerical-impact-fixture-not-physical-calibration",
              },
              "deterministic_savegame_resume": {
                  "qualified": True,
                  "report": "qualification/deterministic-savegame-resume/report.json",
                  "checkpoint_step": 120,
                  "final_step": 240,
                  "workers": 1,
                  "terminal_state_exact": True,
                  "input_artifacts_exact": True,
              },
              "playability_qualified": False,
              "artifact_transport": "github-actions-upload-artifact-v7",
              "transport_dereferences_file_symlinks": True,
              "all_transport_files_inventoried": True,
              "staged_symlink_count": staged_symlink_count,
              "files": files,
          }
          output = root / "qualification/package-inventory.json"
          output.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload qualified Linux RoR-Combined runtime
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-Linux-x86_64-Vulkan-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: ${{ runner.temp }}/ror-combined-stage/

      - name: Upload combined-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-Linux-x86_64-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ror-combined-artifacts/
            ${{ runner.temp }}/ror-combined-build/CMakeCache.txt
            ${{ runner.temp }}/ror-combined-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/ror-combined-build/conan/generators/SDL2*.cmake
            ${{ runner.temp }}/ror-combined-build/conan/generators/cmakedeps_macros.cmake
            ${{ runner.temp }}/ror-combined-build/ogre-next-embedded/*.json
            ${{ runner.temp }}/ror-combined-build/source/main/RoR-Combined.*
            ${{ runner.temp }}/ror-combined-stage/qualification/
            ${{ runner.temp }}/ror-combined-packaged-scene/

  macos-arm64-metal:
    name: macOS arm64 Metal RoR-Combined
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate all generated macOS state from the source checkout
        shell: bash
        run: |
          {
            echo "CONAN_HOME=$RUNNER_TEMP/ror-combined-conan-home"
            echo "ROR_COMBINED_ARTIFACTS_DIR=$RUNNER_TEMP/ror-combined-artifacts"
            echo "ROR_COMBINED_BUILD_DIR=$RUNNER_TEMP/ror-combined-build"
            echo "ROR_COMBINED_PACKAGE_DIR=$RUNNER_TEMP/ror-combined-macos-package"
          } >> "$GITHUB_ENV"

      - name: Install pinned Conan and Ninja clients
        shell: bash
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-conan-home
          key: ogre-next-combined-macos-arm64-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          home = Path(os.environ["CONAN_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          (home / "global.conf").write_text(
              'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n',
              encoding="utf-8",
          )
          PY
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: bash
        run: |
          cmake -E make_directory "$ROR_COMBINED_ARTIFACTS_DIR"
          python cmake/conan/export_pinned_dependency_recipes.py \
            --archive "$RUNNER_TEMP/ror-conan-recipes-d3568327.tar.gz" \
            --extract-root "$RUNNER_TEMP/ror-conan-recipes-export" \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/pinned-conan-recipes.json"

      - name: Verify native runner, compiler, and pinned content
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          test "$(git -C content rev-parse HEAD)" = \
            "34fefdd126784bf87b068fc283f812525d159dd7"
          xcodebuild -version
          clang++ --version
          otool --version
          command -v codesign

      - name: Run combined-runtime fail-closed contracts
        shell: bash
        run: |
          python tests/tools/test_ogre_next_combined_provider_contract.py
          python tests/tools/test_ogre_next_embedded_namespace_contract.py
          python tests/tools/test_run_playable_performance_scene.py
          python tests/tools/test_run_agora_impact_regression.py
          python tests/tools/test_run_deterministic_savegame_resume.py
          python tests/tools/test_renderer_combined_game_wiring_contract.py
          python tests/tools/test_mygui_glsl_contract.py
          python -O tests/tools/test_ogre_next_combined_provider_contract.py
          python -O tests/tools/test_ogre_next_embedded_namespace_contract.py
          python -O tests/tools/test_run_playable_performance_scene.py
          python -O tests/tools/test_run_agora_impact_regression.py
          python -O tests/tools/test_run_deterministic_savegame_resume.py
          python -O tests/tools/test_renderer_combined_game_wiring_contract.py
          python -O tests/tools/test_mygui_glsl_contract.py

      - name: Verify the locked native Conan graph
        shell: bash
        run: |
          python tests/tools/assert_ogre14_app_graph.py \
            --platform macos-arm64 \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/macos-arm64-conan-graph.json"

      - name: Configure clean macOS RoR-Combined Release
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          cmake \
            -S . \
            -B "$ROR_COMBINED_BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DCONAN_HOST_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/macos-arm64-release" \
            -DCONAN_BUILD_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/macos-arm64-release" \
            -DROR_BUILD_TESTS=OFF \
            -DROR_BUILD_QUALIFICATION_TOOLS=ON \
            -DROR_CREATE_CONTENT_FOLDER=ON \
            -DROR_OGRE_NEXT_COMBINED_RUNTIME=ON \
            -DROR_RENDERER_PUBLIC_LAUNCHER=OFF \
            -DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF \
            -DROR_OGRE_NEXT_DEMO_ADMISSION=OFF

      - name: Build and prove the final combined Mach-O closure
        shell: bash
        run: >-
          cmake
          --build "$ROR_COMBINED_BUILD_DIR"
          --target ror_ogre_next_combined_verified
          --config Release

      - name: Require a qualification-eligible combined Mach-O receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["ROR_COMBINED_BUILD_DIR"])
          required = (
              build / "bin/RoR-Combined",
              build / "source/main/RoR-Combined.binary-closure.json",
              build / "ogre-next-embedded/ogre-next-combined-namespace-audit.json",
              build / "bin/resources/ogrenext/.complete.json",
          )
          for path in required:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(
                      f"required combined build output is unavailable: {path}"
                  )
          document = json.loads(required[1].read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_binary_closure.v1",
              "qualification_eligible": True,
              "bridge_or_transport_symbols_present": False,
              "bridge_or_transport_objects_present": False,
              "root_sdl_symbols_present": False,
              "ogre14_host_load_commands_present": True,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined Mach-O closure changed: {field}={document.get(field)!r}"
                  )
          PY

      - name: Stage the one-process Ogre-Next application bundle
        shell: bash
        run: >-
          cmake
          --build "$ROR_COMBINED_BUILD_DIR"
          --target ror_macos_combined_bundle
          --config Release

      - name: Audit the relocated Ogre-Next application bundle
        shell: bash
        run: |
          build="$ROR_COMBINED_BUILD_DIR"
          package="$ROR_COMBINED_PACKAGE_DIR"
          app="$build/bin/RoR-Combined.app"
          executable="$app/Contents/MacOS/RoR-Combined"
          qualification="$package/qualification"
          test -d "$app"
          test -x "$executable"
          test ! -e "$app/Contents/MacOS/RoR"
          test ! -e "$app/Contents/MacOS/RoR-Ogre14"
          test "$({
            find "$app/Contents/MacOS" \
              -maxdepth 1 -type f -perm -111 -print
          } | wc -l | tr -d ' ')" = "1"
          test -d "$app/Contents/Resources/resources/ogrenext/ShaderMedia"
          test -d "$app/Contents/Resources/resources/ogrenext/Presentation"
          test -f "$app/Contents/Resources/resources/ogrenext/.complete.json"
          test -f "$app/Contents/Resources/content/simple2-terrain.zip"
          test -f "$app/Contents/Resources/content/dafsemi.zip"
          test -f "$app/Contents/Resources/content/agora.zip"
          test "$(lipo -archs "$executable")" = "arm64"
          test "$(
            otool -l "$executable" |
              awk '
                /LC_BUILD_VERSION/ { in_build_version = 1; next }
                in_build_version && $1 == "minos" { print $2; exit }
              '
          )" = "11.0"
          test "$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist"
          )" = "RoR-Combined"
          test "$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          )" = "org.rigsofrods.RoR.OgreNextCombined"
          codesign --verify --deep --strict --verbose=2 "$app"
          cmake -E make_directory "$qualification"
          otool -L "$executable" \
            | tee "$qualification/RoR-Combined.otool-L.txt"
          otool -l "$executable" \
            | tee "$qualification/RoR-Combined.otool-l.txt"
          python - \
              "$executable" \
              "$build" \
              "$CONAN_HOME" \
              "$qualification/RoR-Combined.otool-L.txt" \
              "$qualification/RoR-Combined.otool-l.txt" <<'PY'
          from pathlib import Path
          import sys

          executable = Path(sys.argv[1]).resolve(strict=True)
          forbidden = tuple(sys.argv[2:4])
          for report_name in sys.argv[4:]:
              report = Path(report_name).resolve(strict=True)
              for line_number, line in enumerate(
                  report.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  # otool prefixes every report with the inspected subject's
                  # absolute path. That heading is not a Mach-O load command.
                  if line_number == 1 and line == f"{executable}:":
                      continue
                  for root in forbidden:
                      if root in line:
                          raise SystemExit(
                              f"relocated RoR-Combined retains forbidden "
                              f"root in {report.name}:{line_number}: {root}"
                          )
          PY
          cmake -E copy \
            "$build/source/main/RoR-Combined.binary-closure.json" \
            "$qualification/RoR-Combined.binary-closure.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-namespace-audit.json" \
            "$qualification/ogre-next-combined-namespace-audit.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-provider-contract.json" \
            "$qualification/ogre-next-combined-provider-contract.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre14-runtime-manifest.txt" \
            "$qualification/ogre14-runtime-manifest.txt"
          cmake -E copy \
            "$build/bin/resources/ogrenext/.complete.json" \
            "$qualification/ogre-next-combined-resources.complete.json"

      - name: Render packaged Simple2 and semi through Ogre-Next Metal
        shell: bash
        run: |
          app="$ROR_COMBINED_BUILD_DIR/bin/RoR-Combined.app"
          executable="$app/Contents/MacOS/RoR-Combined"
          scene="$RUNNER_TEMP/ror-combined-packaged-scene"
          test ! -e "$scene"
          # Hosted macOS runners expose a 1024x656 drawable after system UI;
          # request that real surface instead of measuring a clamped window.
          python tools/run_playable_performance_scene.py \
            --executable "$executable" \
            --artifact-dir "$scene" \
            --scenario-id ci.ogre-next-combined.macos-packaged-simple2-semi \
            --terrain simple2_a.terrn2 \
            --actor b6b0UID-semi.truck \
            --graphics-preset high \
            --width 1024 \
            --height 656 \
            --warmup-frames 2 \
            --minimum-frames 24 \
            --frames 24 \
            --sustained-ms 1000 \
            --percentile 99 \
            --percentile-ms 1000 \
            --measure-only \
            --timeout 180
          python - "$scene/performance-run.json" <<'PY'
          import json
          import sys

          document = json.load(open(sys.argv[1], encoding="utf-8"))
          receipt = document.get("receipt", {})
          renderer = document.get("renderer", {})
          expected = {
              "scenario_id": "ci.ogre-next-combined.macos-packaged-simple2-semi",
              "terrain": "simple2_a.terrn2",
              "actor": "b6b0UID-semi.truck",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requires_native_scene_draw_metrics": True,
              "accepted_frames": 24,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 24,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if receipt.get(field) != value:
                  raise SystemExit(
                      f"packaged macOS scene receipt changed: {field}={receipt.get(field)!r}"
                  )
          if renderer.get("startup_capture_rejections") != 0:
              raise SystemExit("packaged macOS scene rejected an Ogre-Next capture")
          if renderer.get("render_system") != "ogre-next-metal":
              raise SystemExit(
                  "packaged macOS scene did not identify visible Ogre-Next Metal"
              )
          if renderer.get("resource_host_render_system") != (
              "OpenGL 3+ Rendering Subsystem"
          ):
              raise SystemExit(
                  "packaged macOS scene did not isolate the hidden OGRE14 host"
              )
          ownership = renderer.get("presentation_ownership", {})
          if ownership != {
              "presentation_owner": "ogre-next",
              "visible_render_system": "ogre-next-metal",
              "visible_window": True,
              "legacy_visible_fallback": False,
              "resource_host": "ogre14",
              "resource_host_visible": False,
              "resource_host_protected": True,
          }:
              raise SystemExit("packaged macOS scene presentation ownership changed")
          native = renderer.get("native_distance_lod", {})
          if native.get("available") is not True or native.get("pbs", 0) <= 0:
              raise SystemExit("packaged macOS scene produced no native PBS/LOD frame")
          if "--native-visual-showcase" in document.get("command", []):
              raise SystemExit("packaged macOS scene selected renderer-only showcase")
          PY
          grep -Fq '===== LOADING TERRAIN simple2_a.terrn2' "$scene/RoR.log"
          grep -Fq '== Spawning vehicle: Daf Semi truck' "$scene/RoR.log"
          if grep -Fq "$ROR_COMBINED_BUILD_DIR/bin/resources/ogrenext" \
              "$scene/RoR.log" "$scene/console.txt" \
              || grep -Fq "$CONAN_HOME" \
              "$scene/RoR.log" "$scene/console.txt" \
              || grep -Fq "$GITHUB_WORKSPACE" \
              "$scene/RoR.log" "$scene/console.txt"; then
            echo 'packaged macOS scene accessed an unbundled runtime path' >&2
            exit 1
          fi
          destination="$ROR_COMBINED_PACKAGE_DIR/qualification/packaged-scene-smoke"
          cmake -E make_directory "$destination"
          cmake -E copy "$scene/performance-run.json" "$destination/performance-run.json"
          cmake -E copy "$scene/frame-time-receipt.json" "$destination/frame-time-receipt.json"
          cmake -E copy "$scene/RoR.log" "$destination/RoR.log"
          cmake -E copy "$scene/console.txt" "$destination/console.txt"

      - name: Prove authenticated deterministic Agora impact through packaged RoR-Combined
        shell: bash
        run: |
          app="$ROR_COMBINED_BUILD_DIR/bin/RoR-Combined.app"
          evidence="$ROR_COMBINED_PACKAGE_DIR/qualification/agora-impact-regression"
          executable="$app/Contents/MacOS/RoR-Combined"
          trace_tool="$ROR_COMBINED_BUILD_DIR/qualification-tools/ror_state_trace"
          runtime_content="$app/Contents/Resources/content"
          test -x "$executable"
          test -x "$trace_tool"
          test -f "$runtime_content/agora.zip"
          test -f "$runtime_content/simple2-terrain.zip"
          test ! -e "$evidence"
          python tools/run_agora_impact_regression.py \
            --executable "$executable" \
            --trace-tool "$trace_tool" \
            --runtime-content "$runtime_content" \
            --artifact-dir "$evidence" \
            --runs 1 \
            --workers 1 8 \
            --timeout 900
          python - "$evidence/report.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "format": "ror-p1-agora-impact-regression-v2",
              "repository_commit": sys.argv[2],
              "content_commit": "34fefdd126784bf87b068fc283f812525d159dd7",
              "source_sha256": "09730ea7988b1f3c19ad88e78e0645d32d2ca84c004357fd2437cd97b124ea38",
              "fixture_sha256": "f3f2b5672864fbe9fac7da657aad708b708d4511479ce103730a49856ebc41f2",
              "scenario_id": 2026082001,
              "steps": 6000,
              "state_trace_interval_steps": 1,
              "telemetry_sample_interval_steps": 100,
              "workers": [1, 8],
              "runs_per_worker": 1,
              "material_claim": "numerical-impact-fixture-not-physical-calibration",
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(
                      f"Agora impact report changed: {field}={report.get(field)!r}"
                  )
          if report.get("cross_worker_trace_comparisons") != [{
              "left_trace": "traces/worker-01-run-01.rortrace",
              "left_workers": 1,
              "right_trace": "traces/worker-08-run-01.rortrace",
              "right_workers": 8,
              "status": "match",
              "steps_compared": 6000,
          }]:
              raise SystemExit("Agora impact report lacks the exact cross-worker match")
          PY

      - name: Prove exact deterministic save and resume through packaged RoR-Combined
        shell: bash
        run: |
          app="$ROR_COMBINED_BUILD_DIR/bin/RoR-Combined.app"
          evidence="$ROR_COMBINED_PACKAGE_DIR/qualification/deterministic-savegame-resume"
          executable="$app/Contents/MacOS/RoR-Combined"
          trace_tool="$ROR_COMBINED_BUILD_DIR/qualification-tools/ror_state_trace"
          runtime_content="$app/Contents/Resources/content"
          test -x "$executable"
          test -x "$trace_tool"
          test -f "$runtime_content/agora.zip"
          test -f "$runtime_content/simple2-terrain.zip"
          test ! -e "$evidence"
          python tools/run_deterministic_savegame_resume.py \
            --executable "$executable" \
            --trace-tool "$trace_tool" \
            --runtime-content "$runtime_content" \
            --artifact-dir "$evidence" \
            --workers 1 \
            --timeout 900
          python - "$evidence/report.json" "$GITHUB_SHA" <<'PY'
          import json
          import re
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "format": "ror-d0-deterministic-savegame-resume-report-v1",
              "repository_commit": sys.argv[2],
              "repository_dirty": False,
              "content_commit": "34fefdd126784bf87b068fc283f812525d159dd7",
              "scenario_id": 2026082001,
              "target_id": 2026082001001,
              "checkpoint_step": 120,
              "final_step": 240,
              "workers": 1,
              "terminal_state_exact": True,
              "input_artifacts_exact": True,
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(
                      f"save/resume report changed: {field}={report.get(field)!r}"
                  )
          digest = report.get("final_state_digest")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("save/resume report lacks a terminal state digest")
          observations = report.get("observations")
          if not isinstance(observations, dict) or set(observations) != {"record", "resume"}:
              raise SystemExit("save/resume report lacks exact record/resume observations")
          for label, first, count in (("record", 0, 240), ("resume", 120, 120)):
              observation = observations[label]
              inspection = observation.get("inspection", {})
              metadata = inspection.get("metadata", {})
              final = inspection.get("final_step", {})
              if (metadata.get("first_physics_step"), inspection.get("step_count")) != (first, count):
                  raise SystemExit(f"save/resume {label} trace span changed")
              if final.get("physics_step") != 239 or final.get("state_digest") != digest:
                  raise SystemExit(f"save/resume {label} terminal state changed")
          if observations["record"].get("input_sha256") != observations["resume"].get("input_sha256"):
              raise SystemExit("save/resume authenticated input digest differs")
          PY

      - name: Package the signed application and deterministic inventory
        shell: bash
        run: |
          build="$ROR_COMBINED_BUILD_DIR"
          package="$ROR_COMBINED_PACKAGE_DIR"
          app="$build/bin/RoR-Combined.app"
          archive="$package/RoR-Combined-macOS-arm64.zip"
          test -d "$app"
          test ! -e "$archive"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" \
            | tee "$package/RoR-Combined-macOS-arm64.zip.sha256"
          python - "$package" "$app" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1]).resolve(strict=True)
          app = Path(sys.argv[2]).resolve(strict=True)
          source_commit = sys.argv[3]
          archive = root / "RoR-Combined-macOS-arm64.zip"
          executable = app / "Contents/MacOS/RoR-Combined"
          document = {
              "schema": "ror.ogre_next_combined_macos_package.v2",
              "source_commit": source_commit,
              "platform_policy": "macos-arm64-metal",
              "entrypoint": "RoR-Combined.app",
              "executable": "RoR-Combined.app/Contents/MacOS/RoR-Combined",
              "renderer": "ogre-next",
              "legacy_resource_host": "ogre14-hidden",
              "legacy_visible_presentation": False,
              "presentation_failure_policy": "fail-closed",
              "renderer_smoke_only": False,
              "packaged_scene_smoke": True,
              "default_scene": {
                  "terrain": "simple2_a.terrn2",
                  "actor": "b6b0UID-semi.truck",
              },
              "actor_control_qualified": False,
              "deterministic_impact_regression": {
                  "qualified": True,
                  "report": "qualification/agora-impact-regression/report.json",
                  "workers": [1, 8],
                  "steps": 6000,
                  "exact_state_trace_match": True,
                  "material_claim": "numerical-impact-fixture-not-physical-calibration",
              },
              "deterministic_savegame_resume": {
                  "qualified": True,
                  "report": "qualification/deterministic-savegame-resume/report.json",
                  "checkpoint_step": 120,
                  "final_step": 240,
                  "workers": 1,
                  "terminal_state_exact": True,
                  "input_artifacts_exact": True,
              },
              "runtime_package_qualified": True,
              "playability_qualified": False,
              "archive": {
                  "path": archive.name,
                  "size": archive.stat().st_size,
                  "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              },
              "runtime_executable_sha256": hashlib.sha256(
                  executable.read_bytes()
              ).hexdigest(),
          }
          (root / "qualification/package-inventory.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload qualified macOS RoR-Combined runtime
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-macOS-arm64-Metal-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          compression-level: 0
          path: ${{ runner.temp }}/ror-combined-macos-package/

      - name: Upload macOS combined-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-macOS-arm64-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ror-combined-artifacts/
            ${{ runner.temp }}/ror-combined-build/CMakeCache.txt
            ${{ runner.temp }}/ror-combined-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/ror-combined-build/ogre-next-embedded/*.json
            ${{ runner.temp }}/ror-combined-build/source/main/RoR-Combined.*
            ${{ runner.temp }}/ror-combined-build/bin/RoR-Combined.app/
            ${{ runner.temp }}/ror-combined-macos-package/qualification/
            ${{ runner.temp }}/ror-combined-packaged-scene/

  windows-x64-d3d11:
    name: Windows x64 D3D11 RoR-Combined
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CC: cl
      CXX: cl
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate all generated Windows state from the source checkout
        shell: pwsh
        run: |
          @(
            "CONAN_HOME=$(Join-Path $env:RUNNER_TEMP 'ror-combined-conan-home')"
            "ROR_COMBINED_ARTIFACTS_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-artifacts')"
            "ROR_COMBINED_BUILD_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-build')"
            "ROR_COMBINED_STAGE_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-stage')"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM

      - name: Enable the pinned MSVC x64 toolset
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: "14.44"

      - name: Install pinned Conan and Ninja clients
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-conan-home
          key: ogre-next-combined-windows-msvc1944-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CONAN_HOME | Out-Null
          @'
          tools.system.package_manager:mode=install
          core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]
          '@ | Set-Content -LiteralPath (Join-Path $env:CONAN_HOME 'global.conf') -Encoding utf8NoBOM
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:ROR_COMBINED_ARTIFACTS_DIR | Out-Null
          python cmake/conan/export_pinned_dependency_recipes.py `
            --archive (Join-Path $env:RUNNER_TEMP 'ror-conan-recipes-d3568327.tar.gz') `
            --extract-root (Join-Path $env:RUNNER_TEMP 'ror-conan-recipes-export') |
            Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'pinned-conan-recipes.json')

      - name: Verify compiler, architecture, and PE audit tool
        shell: pwsh
        run: |
          cl 2>&1 | Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'msvc-version.txt')
          if (-not (Select-String -LiteralPath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'msvc-version.txt') -Pattern 'Version 19\.44\.')) {
            throw 'The reviewed MSVC 19.44 toolset is not active'
          }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          & $dumpbin.Source /nologo /headers $dumpbin.Source | Select-Object -First 20
          cmake --version
          ninja --version

      - name: Run combined-runtime fail-closed contracts
        shell: pwsh
        run: |
          function Invoke-CheckedPython {
            param([string[]]$PythonArguments)
            & python @PythonArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Combined-runtime contract failed: python $($PythonArguments -join ' ')"
            }
          }
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_ogre_next_combined_provider_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_ogre_next_embedded_namespace_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_playable_performance_scene.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_agora_impact_regression.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_run_deterministic_savegame_resume.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_renderer_combined_game_wiring_contract.py')
          Invoke-CheckedPython -PythonArguments @('tests/tools/test_mygui_glsl_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_ogre_next_combined_provider_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_ogre_next_embedded_namespace_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_playable_performance_scene.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_agora_impact_regression.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_run_deterministic_savegame_resume.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_renderer_combined_game_wiring_contract.py')
          Invoke-CheckedPython -PythonArguments @('-O', 'tests/tools/test_mygui_glsl_contract.py')

      - name: Verify the locked native Conan graph
        shell: pwsh
        run: |
          python tests/tools/assert_ogre14_app_graph.py `
            --platform windows-x86_64 |
            Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'windows-x86_64-conan-graph.json')

      - name: Configure clean Windows RoR-Combined Release
        shell: pwsh
        run: |
          $tracked = git status --porcelain --untracked-files=no
          if ($tracked) {
            throw "The source checkout is dirty before configure: $tracked"
          }
          $conanProvider = Join-Path $env:GITHUB_WORKSPACE 'cmake/conan_provider.cmake'
          $conanProfile = Join-Path $env:GITHUB_WORKSPACE 'cmake/conan/profiles/windows-x86_64-release'
          $cmakeArguments = @(
            '-S', '.',
            '-B', $env:ROR_COMBINED_BUILD_DIR,
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_INSTALL_PREFIX=$env:ROR_COMBINED_STAGE_DIR",
            "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$conanProvider",
            "-DCONAN_HOST_PROFILE=$conanProfile",
            "-DCONAN_BUILD_PROFILE=$conanProfile",
            '-DROR_BUILD_TESTS=OFF',
            '-DROR_BUILD_QUALIFICATION_TOOLS=ON',
            '-DROR_CREATE_CONTENT_FOLDER=ON',
            '-DROR_OGRE_NEXT_COMBINED_RUNTIME=ON',
            '-DROR_RENDERER_PUBLIC_LAUNCHER=OFF',
            '-DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF',
            '-DROR_OGRE_NEXT_DEMO_ADMISSION=OFF'
          )
          & cmake @cmakeArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Windows RoR-Combined configure failed with exit code $LASTEXITCODE"
          }

      - name: Build and prove the final combined PE closure
        shell: pwsh
        run: >-
          cmake
          --build $env:ROR_COMBINED_BUILD_DIR
          --target ror_ogre_next_combined_verified
          --config Release

      - name: Require a qualification-eligible combined PE receipt
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["ROR_COMBINED_BUILD_DIR"])
          required = (
              build / "bin/RoR-Combined.exe",
              build / "source/main/RoR-Combined.binary-closure.json",
              build / "ogre-next-embedded/ogre-next-combined-namespace-audit.json",
              build / "bin/resources/ogrenext/.complete.json",
          )
          for path in required:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"required combined build output is unavailable: {path}")
          document = json.loads(required[1].read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_pe_closure.v1",
              "platform_policy": "windows-x64-d3d11",
              "qualification_eligible": True,
              "bridge_or_transport_symbols_present": False,
              "root_sdl_symbols_present": True,
              "ogre14_host_imports_present": True,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined PE closure changed: {field}={document.get(field)!r}"
                  )
          '@ | python -

      - name: Install and relocate the combined Windows runtime
        shell: pwsh
        run: |
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Base_Game
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Base_Content
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Qualification_Tools

      - name: Audit relocated runtime and retain provenance
        shell: pwsh
        run: |
          $stage = $env:ROR_COMBINED_STAGE_DIR
          $build = $env:ROR_COMBINED_BUILD_DIR
          $exe = Join-Path $stage 'RoR-Combined.exe'
          foreach ($path in @(
              $exe,
              (Join-Path $stage 'qualification/bin/ror_state_trace.exe'),
              (Join-Path $stage 'resources/ogrenext/ShaderMedia'),
              (Join-Path $stage 'resources/ogrenext/Presentation'),
              (Join-Path $stage 'resources/ogrenext/.complete.json'),
              (Join-Path $stage 'content')
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Relocated combined runtime input is missing: $path"
            }
          }
          @'
          import json
          import os
          from pathlib import Path

          receipt = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "resources/ogrenext/.complete.json"
          )
          document = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_resource_stage.v2",
              "runtime_layout": "resources/ogrenext",
              "shader_media_relative": "ShaderMedia",
              "presentation_media_relative": "Presentation",
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"Windows resource-stage receipt changed: "
                      f"{field}={document.get(field)!r}"
                  )
          digest = document.get("manifest_sha256")
          if not isinstance(digest, str) or len(digest) != 64:
              raise SystemExit("Windows resource-stage digest is invalid")
          if not isinstance(document.get("file_count"), int) or document["file_count"] <= 0:
              raise SystemExit("Windows resource-stage inventory is empty")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Windows resource-stage validation failed with exit code $LASTEXITCODE"
          }
          foreach ($forbidden in @('RoR.exe', 'RoR-Ogre14.exe')) {
            if (Test-Path -LiteralPath (Join-Path $stage $forbidden)) {
              throw "Relocated package contains a legacy-visible executable: $forbidden"
            }
          }
          $qualification = Join-Path $stage 'qualification'
          New-Item -ItemType Directory -Force -Path $qualification | Out-Null
          dumpbin /nologo /headers $exe |
            Tee-Object -FilePath (Join-Path $qualification 'RoR-Combined.headers.txt')
          dumpbin /nologo /dependents $exe |
            Tee-Object -FilePath (Join-Path $qualification 'RoR-Combined.dependents.txt')
          foreach ($pair in @(
              @('source/main/RoR-Combined.binary-closure.json', 'RoR-Combined.binary-closure.json'),
              @('ogre-next-embedded/ogre-next-combined-namespace-audit.json', 'ogre-next-combined-namespace-audit.json'),
              @('ogre-next-embedded/ogre-next-combined-provider-contract.json', 'ogre-next-combined-provider-contract.json'),
              @('ogre-next-embedded/ogre14-runtime-manifest.txt', 'ogre14-runtime-manifest.txt'),
              @('bin/resources/ogrenext/.complete.json', 'ogre-next-combined-resources.complete.json')
          )) {
            Copy-Item -LiteralPath (Join-Path $build $pair[0]) `
              -Destination (Join-Path $qualification $pair[1])
          }
          $quarantine = Join-Path $env:RUNNER_TEMP 'ror-combined-build-media-quarantine'
          if (Test-Path -LiteralPath $quarantine) {
            throw "Build-media quarantine already exists: $quarantine"
          }
          Move-Item -LiteralPath (Join-Path $build 'bin/resources/ogrenext') `
            -Destination $quarantine

      - name: Render bounded Ogre-Next frames with relocated D3D11 runtime
        shell: pwsh
        run: |
          $stage = $env:ROR_COMBINED_STAGE_DIR
          $smoke = Join-Path $env:RUNNER_TEMP 'ror-combined-smoke'
          $profile = Join-Path $smoke 'profile'
          $appData = Join-Path $profile 'AppData/Roaming'
          $localData = Join-Path $profile 'AppData/Local'
          New-Item -ItemType Directory -Force -Path $appData, $localData | Out-Null
          $receipt = Join-Path $stage 'qualification/renderer-smoke.json'
          $log = Join-Path $stage 'qualification/renderer-smoke.console.log'
          if (Test-Path -LiteralPath $receipt) {
            throw 'Renderer smoke receipt already exists'
          }
          $env:USERPROFILE = $profile
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localData
          $env:ROR_D0_SCENE_HOME = $profile
          $stdout = Join-Path $smoke 'renderer-smoke.stdout.log'
          $stderr = Join-Path $smoke 'renderer-smoke.stderr.log'
          $events = Join-Path $smoke 'renderer-smoke.windows-events.log'
          $dumps = Join-Path $smoke 'crash-dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $env:ROR_WINDOWS_CRASH_DUMP_PATH =
            Join-Path $dumps 'RoR-Combined.dmp'
          $werKey = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\RoR-Combined.exe'
          try {
            New-Item -Path $werKey -Force | Out-Null
            New-ItemProperty -Path $werKey -Name DumpFolder `
              -PropertyType ExpandString -Value $dumps -Force | Out-Null
            New-ItemProperty -Path $werKey -Name DumpType `
              -PropertyType DWord -Value 2 -Force | Out-Null
          } catch {
            Write-Warning "Could not enable Windows local dumps: $($_.Exception.Message)"
          }
          $arguments = @(
            '--native-visual-showcase',
            '-frame-budget', 'measure',
            '-frame-budget-receipt', $receipt,
            '-frame-budget-scenario', 'ci.ogre-next-combined.windows-renderer-smoke',
            '-frame-budget-sustained-ms', '1000',
            '-frame-budget-percentile', '99',
            '-frame-budget-percentile-ms', '1000',
            '-frame-budget-warmup', '2',
            '-frame-budget-minimum', '8',
            '-frame-budget-frames', '12'
          )
          $process = Start-Process `
            -FilePath (Join-Path $stage 'RoR-Combined.exe') `
            -ArgumentList $arguments `
            -WorkingDirectory $stage `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $smokeStartedAt = Get-Date
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Relocated Windows renderer smoke exceeded 120 seconds'
          }
          $process.WaitForExit()
          $status = $process.ExitCode
          $combinedLog = [System.Collections.Generic.List[string]]::new()
          foreach ($path in @($stdout, $stderr)) {
            if (Test-Path -LiteralPath $path) {
              foreach ($line in Get-Content -LiteralPath $path) {
                $combinedLog.Add($line)
              }
              Get-Content -LiteralPath $path
            }
          }
          [System.IO.File]::WriteAllLines(
            $log,
            $combinedLog,
            [System.Text.UTF8Encoding]::new($false)
          )
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = $smokeStartedAt.AddSeconds(-5)
          } -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ProviderName -in @('Application Error', 'Windows Error Reporting')
            } |
            Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Format-List |
            Out-File -LiteralPath $events -Encoding utf8
          if (Test-Path -LiteralPath $events) {
            Get-Content -LiteralPath $events
          }
          if ($status -ne 0) {
            throw "Relocated Windows renderer smoke failed with exit code $status"
          }
          @'
          import json
          import os
          from pathlib import Path

          receipt = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "qualification/renderer-smoke.json"
          )
          document = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "format": "ror-frame-time-budget-v1",
              "mode": "measure",
              "scenario_id": "ci.ogre-next-combined.windows-renderer-smoke",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requires_native_scene_draw_metrics": True,
              "requested_frames": 12,
              "accepted_frames": 12,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 12,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"Windows renderer smoke receipt changed: {field}={document.get(field)!r}"
                  )
          if document.get("native_scene_draw_p99", 0) <= 0:
              raise SystemExit("Windows renderer smoke submitted no native scene draws")
          '@ | python -

      - name: Render packaged Simple2 and semi through Ogre-Next
        shell: pwsh
        run: |
          $stage = $env:ROR_COMBINED_STAGE_DIR
          $scene = Join-Path $env:RUNNER_TEMP 'ror-combined-packaged-scene'
          foreach ($path in @(
              (Join-Path $stage 'content/simple2-terrain.zip'),
              (Join-Path $stage 'content/dafsemi.zip')
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaged scene input is missing: $path"
            }
          }
          if (Test-Path -LiteralPath $scene) {
            throw "Packaged scene artifact directory already exists: $scene"
          }
          python tools/run_playable_performance_scene.py `
            --executable (Join-Path $stage 'RoR-Combined.exe') `
            --artifact-dir $scene `
            --scenario-id ci.ogre-next-combined.windows-packaged-simple2-semi `
            --terrain simple2_a.terrn2 `
            --actor b6b0UID-semi.truck `
            --graphics-preset high `
            --width 1280 `
            --height 720 `
            --warmup-frames 2 `
            --minimum-frames 24 `
            --frames 24 `
            --sustained-ms 1000 `
            --percentile 99 `
            --percentile-ms 1000 `
            --qualify-actor-control `
            --measure-only `
            --timeout 180
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Windows scene smoke failed with exit code $LASTEXITCODE"
          }
          @'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "ror-combined-packaged-scene/performance-run.json"
          document = json.loads(report.read_text(encoding="utf-8"))
          receipt = document.get("receipt", {})
          renderer = document.get("renderer", {})
          expected = {
              "scenario_id": "ci.ogre-next-combined.windows-packaged-simple2-semi",
              "terrain": "simple2_a.terrn2",
              "actor": "b6b0UID-semi.truck",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requires_native_scene_draw_metrics": True,
              "accepted_frames": 24,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 24,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if receipt.get(field) != value:
                  raise SystemExit(
                      f"packaged Windows scene receipt changed: {field}={receipt.get(field)!r}"
                  )
          if renderer.get("startup_capture_rejections") != 0:
              raise SystemExit("packaged Windows scene rejected an Ogre-Next capture")
          if renderer.get("render_system") != "ogre-next-d3d11":
              raise SystemExit("packaged Windows scene did not identify visible Ogre-Next D3D11")
          if renderer.get("resource_host_render_system") != "Direct3D11 Rendering Subsystem":
              raise SystemExit("packaged Windows scene did not isolate the hidden OGRE14 resource host")
          ownership = renderer.get("presentation_ownership", {})
          if ownership != {
              "presentation_owner": "ogre-next",
              "visible_render_system": "ogre-next-d3d11",
              "visible_window": True,
              "legacy_visible_fallback": False,
              "resource_host": "ogre14",
              "resource_host_visible": False,
              "resource_host_protected": True,
          }:
              raise SystemExit("packaged Windows scene presentation ownership changed")
          native = renderer.get("native_distance_lod", {})
          if native.get("available") is not True or native.get("pbs", 0) <= 0:
              raise SystemExit("packaged Windows scene produced no native PBS/LOD frame")
          control = renderer.get("actor_control", {})
          if control.get("qualified") is not True or control.get("control") != "truck_accelerate":
              raise SystemExit("packaged Windows scene produced no qualified actor-control receipt")
          driver = renderer.get("actor_control_driver", {})
          if driver.get("process_external") is not True or driver.get("backend") != "win32-user32-window-message":
              raise SystemExit("packaged Windows scene did not use the external User32 input driver")
          if "--native-visual-showcase" in document.get("command", []):
              raise SystemExit("packaged Windows scene selected renderer-only showcase")
          '@ | python -
          $log = Join-Path $scene 'RoR.log'
          if (-not (Select-String -LiteralPath $log -SimpleMatch '===== LOADING TERRAIN simple2_a.terrn2')) {
            throw 'Packaged Windows scene did not load Simple2'
          }
          if (-not (Select-String -LiteralPath $log -SimpleMatch '== Spawning vehicle: Daf Semi truck')) {
            throw 'Packaged Windows scene did not spawn the semi'
          }
          $destination = Join-Path $stage 'qualification/packaged-scene-smoke'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          foreach ($name in @('performance-run.json', 'frame-time-receipt.json', 'RoR.log', 'console.txt')) {
            Copy-Item -LiteralPath (Join-Path $scene $name) `
              -Destination (Join-Path $destination $name)
          }

