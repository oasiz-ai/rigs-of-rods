name: Ogre-Next combined native Release

on:
  push:
    branches: [master, nextgen/playable-performance-gate]
    paths:
      - .github/workflows/ogre-next-combined-native.yml
      - CMakeLists.txt
      - conanfile.py
      - cmake/OgreNextEmbeddedRuntime.cmake
      - cmake/conan/**
      - cmake/linux/**
      - cmake/ogre_next_embedded/**
      - source/main/**
      - tools/linux/RunRoR-combined
      - tools/ogre_next_probe/**
      - tools/stage_ogre_next_combined_resources.py
      - tools/verify_ogre_next_combined_binary_closure.py
      - tools/verify_ogre_next_combined_elf_closure.py
      - tools/verify_ogre_next_combined_pe_closure.py
      - tests/tools/test_ogre_next_combined_provider_contract.py
      - tests/tools/test_ogre_next_embedded_namespace_contract.py
      - tests/tools/test_renderer_combined_game_wiring_contract.py
  pull_request:
    paths:
      - .github/workflows/ogre-next-combined-native.yml
      - CMakeLists.txt
      - conanfile.py
      - cmake/OgreNextEmbeddedRuntime.cmake
      - cmake/conan/**
      - cmake/linux/**
      - cmake/ogre_next_embedded/**
      - source/main/**
      - tools/linux/RunRoR-combined
      - tools/ogre_next_probe/**
      - tools/stage_ogre_next_combined_resources.py
      - tools/verify_ogre_next_combined_binary_closure.py
      - tools/verify_ogre_next_combined_elf_closure.py
      - tools/verify_ogre_next_combined_pe_closure.py
      - tests/tools/test_ogre_next_combined_provider_contract.py
      - tests/tools/test_ogre_next_embedded_namespace_contract.py
      - tests/tools/test_renderer_combined_game_wiring_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogre-next-combined-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-vulkan:
    name: Linux x86_64 Vulkan RoR-Combined
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: gcc-11
      CXX: g++-11
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate all generated state from the source checkout
        shell: bash
        run: |
          {
            echo "CONAN_HOME=$RUNNER_TEMP/ror-combined-conan-home"
            echo "ROR_COMBINED_ARTIFACTS_DIR=$RUNNER_TEMP/ror-combined-artifacts"
            echo "ROR_COMBINED_BUILD_DIR=$RUNNER_TEMP/ror-combined-build"
            echo "ROR_COMBINED_STAGE_DIR=$RUNNER_TEMP/ror-combined-stage"
          } >> "$GITHUB_ENV"

      - name: Install Linux build and software-rendering prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            file \
            gcc-11 \
            g++-11 \
            gdb \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxaw7-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxt-dev \
            mesa-vulkan-drivers \
            mesa-utils \
            vulkan-tools \
            xauth \
            xvfb
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp*json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Install pinned Conan and Ninja clients
        shell: bash
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-conan-home
          key: ogre-next-combined-linux-gcc11-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          home = Path(os.environ["CONAN_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          (home / "global.conf").write_text(
              "tools.system.package_manager:mode=install\n"
              "tools.system.package_manager:sudo=True\n"
              'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n',
              encoding="utf-8",
          )
          PY
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: bash
        run: |
          cmake -E make_directory "$ROR_COMBINED_ARTIFACTS_DIR"
          python cmake/conan/export_pinned_dependency_recipes.py \
            --archive "$RUNNER_TEMP/ror-conan-recipes-d3568327.tar.gz" \
            --extract-root "$RUNNER_TEMP/ror-conan-recipes-export" \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/pinned-conan-recipes.json"

      - name: Verify compiler, architecture, and Vulkan software device
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(gcc-11 -dumpfullversion | cut -d. -f1)" = "11"
          test "$(g++-11 -dumpfullversion | cut -d. -f1)" = "11"
          gcc-11 --version
          g++-11 --version
          readelf --version
          nm --version
          vulkaninfo --summary

      - name: Run combined-runtime fail-closed contracts
        shell: bash
        run: |
          python tests/tools/test_ogre_next_combined_provider_contract.py
          python tests/tools/test_ogre_next_embedded_namespace_contract.py
          python tests/tools/test_renderer_combined_game_wiring_contract.py
          python -O tests/tools/test_ogre_next_combined_provider_contract.py
          python -O tests/tools/test_ogre_next_embedded_namespace_contract.py
          python -O tests/tools/test_renderer_combined_game_wiring_contract.py

      - name: Verify the locked native Conan graph
        shell: bash
        run: |
          python tests/tools/assert_ogre14_app_graph.py \
            --platform linux-x86_64 \
            | tee "$ROR_COMBINED_ARTIFACTS_DIR/linux-x86_64-conan-graph.json"

      - name: Configure clean Linux RoR-Combined Release
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          cmake \
            -S . \
            -B "$ROR_COMBINED_BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ROR_COMBINED_STAGE_DIR" \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DCONAN_HOST_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DCONAN_BUILD_PROFILE="$GITHUB_WORKSPACE/cmake/conan/profiles/linux-x86_64-release" \
            -DROR_BUILD_TESTS=OFF \
            -DROR_CREATE_CONTENT_FOLDER=ON \
            -DROR_OGRE_NEXT_COMBINED_RUNTIME=ON \
            -DROR_RENDERER_PUBLIC_LAUNCHER=OFF \
            -DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF \
            -DROR_OGRE_NEXT_DEMO_ADMISSION=OFF

      - name: Build and prove the final combined ELF closure
        shell: bash
        run: >-
          cmake
          --build "$ROR_COMBINED_BUILD_DIR"
          --target ror_ogre_next_combined_verified
          --config Release

      - name: Require a qualification-eligible combined build receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["ROR_COMBINED_BUILD_DIR"])
          binary = build / "bin/RoR-Combined"
          closure = build / "source/main/RoR-Combined.binary-closure.json"
          namespace = build / "ogre-next-embedded/ogre-next-combined-namespace-audit.json"
          resources = build / "bin/resources/ogrenext/.complete.json"
          for path in (binary, closure, namespace, resources):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"required combined build output is unavailable: {path}")
          document = json.loads(closure.read_text(encoding="utf-8"))
          if document.get("schema") != "ror.ogre_next_combined_elf_closure.v1":
              raise SystemExit("combined ELF closure schema changed")
          if document.get("platform_policy") != "linux-x86_64-vulkan":
              raise SystemExit("combined ELF platform policy changed")
          if document.get("qualification_eligible") is not True:
              raise SystemExit("combined ELF closure is not qualification eligible")
          if document.get("bridge_or_transport_symbols_present") is not False:
              raise SystemExit("combined ELF includes bridge/transport symbols")
          if document.get("root_sdl_symbols_present") is not False:
              raise SystemExit("combined ELF extracted a second SDL provider")
          PY

      - name: Install and relocate the combined runtime
        shell: bash
        run: |
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Base_Game
          cmake --install "$ROR_COMBINED_BUILD_DIR" \
            --prefix "$ROR_COMBINED_STAGE_DIR" \
            --component Base_Content

      - name: Audit relocated runtime and retain provenance
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          build="$ROR_COMBINED_BUILD_DIR"
          test -x "$stage/RoR-Combined"
          test -x "$stage/RunRoR"
          test ! -e "$stage/RoR"
          test ! -e "$stage/RoR-Ogre14"
          test -d "$stage/lib/OGRE"
          test -d "$stage/resources"
          test -d "$stage/resources/ogrenext/ShaderMedia"
          test -d "$stage/resources/ogrenext/Presentation"
          test -f "$stage/resources/ogrenext/.complete.json"
          test -d "$stage/content"
          if find "$stage/resources/ogrenext" -type l -print -quit \
              | grep -q .; then
            echo 'relocated Ogre-Next media contains an indirect file'
            exit 1
          fi
          cmake -E make_directory "$stage/qualification"
          readelf --file-header --dynamic "$stage/RoR-Combined" \
            | tee "$stage/qualification/RoR-Combined.readelf.txt"
          ldd "$stage/RoR-Combined" \
            | tee "$stage/qualification/RoR-Combined.ldd.txt"
          if grep -Fq 'not found' "$stage/qualification/RoR-Combined.ldd.txt"; then
            echo 'relocated RoR-Combined has an unresolved shared library'
            exit 1
          fi
          if grep -Fq "$build" "$stage/qualification/RoR-Combined.readelf.txt" \
              || grep -Fq "$build" "$stage/qualification/RoR-Combined.ldd.txt"; then
            echo 'relocated RoR-Combined retains its build root'
            exit 1
          fi
          if grep -aFq "$build/bin/resources/ogrenext" \
              "$stage/RoR-Combined"; then
            echo 'relocated RoR-Combined embeds its build-tree media root'
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          completion = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "resources/ogrenext/.complete.json"
          )
          document = json.loads(completion.read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_resource_stage.v2",
              "runtime_layout": "resources/ogrenext",
              "shader_media_relative": "ShaderMedia",
              "presentation_media_relative": "Presentation",
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined package media receipt changed: {field}={document.get(field)!r}"
                  )
          if not isinstance(document.get("file_count"), int) or document["file_count"] <= 0:
              raise SystemExit("combined package media receipt has no files")
          manifest_sha256 = document.get("manifest_sha256")
          if (
              not isinstance(manifest_sha256, str)
              or len(manifest_sha256) != 64
              or any(character not in "0123456789abcdef" for character in manifest_sha256)
          ):
              raise SystemExit("combined package media receipt digest is invalid")
          PY
          cmake -E copy \
            "$build/source/main/RoR-Combined.binary-closure.json" \
            "$stage/qualification/RoR-Combined.binary-closure.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-namespace-audit.json" \
            "$stage/qualification/ogre-next-combined-namespace-audit.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-provider-contract.json" \
            "$stage/qualification/ogre-next-combined-provider-contract.json"
          cmake -E copy \
            "$build/bin/resources/ogrenext/.complete.json" \
            "$stage/qualification/ogre-next-combined-resources.complete.json"

          quarantine="$RUNNER_TEMP/ror-combined-build-media-quarantine"
          test ! -e "$quarantine"
          mv "$build/bin/resources/ogrenext" "$quarantine"
          test ! -e "$build/bin/resources/ogrenext"

      - name: Render bounded Ogre-Next frames with relocated Vulkan runtime
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          smoke="$RUNNER_TEMP/ror-combined-smoke"
          cmake -E make_directory "$smoke/home" "$smoke/config" "$smoke/cache" "$smoke/data"
          receipt="$stage/qualification/renderer-smoke.json"
          test ! -e "$receipt"
          test ! -e "$ROR_COMBINED_BUILD_DIR/bin/resources/ogrenext"
          test -d "$stage/resources/ogrenext/ShaderMedia"
          test -d "$stage/resources/ogrenext/Presentation"
          set +e
          HOME="$smoke/home" \
          XDG_CONFIG_HOME="$smoke/config" \
          XDG_CACHE_HOME="$smoke/cache" \
          XDG_DATA_HOME="$smoke/data" \
          timeout --signal=TERM 120s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            "$stage/RunRoR" \
              --native-visual-showcase \
              -frame-budget measure \
              -frame-budget-receipt "$receipt" \
              -frame-budget-scenario ci.ogre-next-combined.renderer-smoke \
              -frame-budget-sustained-ms 1000 \
              -frame-budget-percentile 99 \
              -frame-budget-percentile-ms 1000 \
              -frame-budget-warmup 2 \
              -frame-budget-minimum 8 \
              -frame-budget-frames 12 \
            > "$stage/qualification/renderer-smoke.stdout.log" \
            2> "$stage/qualification/renderer-smoke.stderr.log"
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 0 ]]; then
            HOME="$smoke/home" \
            XDG_CONFIG_HOME="$smoke/config" \
            XDG_CACHE_HOME="$smoke/cache" \
            XDG_DATA_HOME="$smoke/data" \
            LD_LIBRARY_PATH="$stage/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            timeout --signal=TERM 120s \
              xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              gdb --batch \
                -ex 'set pagination off' \
                -ex run \
                -ex 'thread apply all backtrace full' \
                --args "$stage/RoR-Combined" \
                  --native-visual-showcase \
                  -frame-budget measure \
                  -frame-budget-receipt "$receipt" \
                  -frame-budget-scenario ci.ogre-next-combined.renderer-smoke \
                  -frame-budget-sustained-ms 1000 \
                  -frame-budget-percentile 99 \
                  -frame-budget-percentile-ms 1000 \
                  -frame-budget-warmup 2 \
                  -frame-budget-minimum 8 \
                  -frame-budget-frames 12 \
              > "$stage/qualification/renderer-smoke.gdb.log" 2>&1 || true
            exit "$smoke_status"
          fi
          smoke_log="$stage/qualification/renderer-smoke.stdout.log"
          if grep -Fq '[RoR|RendererCombined|Scene] Snapshot not presented' "$smoke_log"; then
            echo "Ogre-Next showcase rejected a scene snapshot" >&2
            exit 1
          fi
          if ! grep -Fq '[RoR|RendererCombined|NativeShowcase|Turntable]' "$smoke_log"; then
            echo "Ogre-Next showcase produced no presented-scene receipt" >&2
            exit 1
          fi
          if grep -Fq "$ROR_COMBINED_BUILD_DIR/bin/resources/ogrenext" \
              "$stage/qualification/renderer-smoke.stdout.log" \
              "$stage/qualification/renderer-smoke.stderr.log"; then
            echo "relocated Ogre-Next smoke accessed build-tree media" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "qualification/renderer-smoke.json"
          )
          document = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "format": "ror-frame-time-budget-v1",
              "mode": "measure",
              "scenario_id": "ci.ogre-next-combined.renderer-smoke",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requested_frames": 12,
              "accepted_frames": 12,
              "rejected_frames": 0,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined renderer smoke receipt changed: {field}={document.get(field)!r}"
                  )
          PY

      - name: Write deterministic package inventory
        shell: bash
        run: |
          stage="$ROR_COMBINED_STAGE_DIR"
          python - "$stage" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import sys

          root = Path(sys.argv[1]).resolve(strict=True)
          source_commit = sys.argv[2]
          files = []
          staged_symlink_count = 0
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  if not path.is_file():
                      raise SystemExit(
                          f"package contains an unsupported non-file symlink: {path}"
                      )
                  link_target = os.readlink(path)
                  if os.path.isabs(link_target):
                      raise SystemExit(
                          f"package symlink has an absolute target: {path}"
                      )
                  resolved_target = path.resolve(strict=True)
                  try:
                      resolved_target.relative_to(root)
                  except ValueError:
                      raise SystemExit(
                          f"package symlink escapes the install root: {path}"
                      )
                  stage_kind = "symlink"
                  staged_symlink_count += 1
              elif path.is_file():
                  link_target = None
                  stage_kind = "regular"
              else:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == "qualification/package-inventory.json":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entry = {
                  "path": relative,
                  "size": path.stat().st_size,
                  "sha256": digest,
                  "mode": stat.S_IMODE(path.stat().st_mode),
                  "stage_kind": stage_kind,
              }
              if link_target is not None:
                  entry["stage_link_target"] = link_target
              files.append(entry)
          document = {
              "schema": "ror.ogre_next_combined_linux_package.v2",
              "source_commit": source_commit,
              "platform_policy": "linux-x86_64-vulkan",
              "entrypoint": "RunRoR",
              "executable": "RoR-Combined",
              "renderer": "ogre-next",
              "legacy_visible_presentation": False,
              "renderer_smoke_only": True,
              "playability_qualified": False,
              "artifact_transport": "github-actions-upload-artifact-v7",
              "transport_dereferences_file_symlinks": True,
              "all_transport_files_inventoried": True,
              "staged_symlink_count": staged_symlink_count,
              "files": files,
          }
          output = root / "qualification/package-inventory.json"
          output.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload qualified Linux RoR-Combined runtime
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-Linux-x86_64-Vulkan-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: ${{ runner.temp }}/ror-combined-stage/

      - name: Upload combined-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-Linux-x86_64-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ror-combined-artifacts/
            ${{ runner.temp }}/ror-combined-build/CMakeCache.txt
            ${{ runner.temp }}/ror-combined-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/ror-combined-build/ogre-next-embedded/*.json
            ${{ runner.temp }}/ror-combined-build/source/main/RoR-Combined.*
            ${{ runner.temp }}/ror-combined-stage/qualification/

  windows-x64-d3d11:
    name: Windows x64 D3D11 RoR-Combined
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CC: cl
      CXX: cl
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate all generated Windows state from the source checkout
        shell: pwsh
        run: |
          @(
            "CONAN_HOME=$(Join-Path $env:RUNNER_TEMP 'ror-combined-conan-home')"
            "ROR_COMBINED_ARTIFACTS_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-artifacts')"
            "ROR_COMBINED_BUILD_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-build')"
            "ROR_COMBINED_STAGE_DIR=$(Join-Path $env:RUNNER_TEMP 'ror-combined-stage')"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM

      - name: Enable the pinned MSVC x64 toolset
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: "14.44"

      - name: Install pinned Conan and Ninja clients
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          conan==2.31.1
          ninja==1.13.0

      - name: Restore isolated Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ror-combined-conan-home
          key: ogre-next-combined-windows-msvc1944-release-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/profiles/*', 'cmake/conan/recipes/**', 'cmake/conan/export_pinned_dependency_recipes.py') }}

      - name: Configure isolated Conan client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CONAN_HOME | Out-Null
          @'
          tools.system.package_manager:mode=install
          core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]
          '@ | Set-Content -LiteralPath (Join-Path $env:CONAN_HOME 'global.conf') -Encoding utf8NoBOM
          conan remote add conancenter https://center2.conan.io --force
          conan --version
          ninja --version

      - name: Export pinned public RoR dependency recipes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:ROR_COMBINED_ARTIFACTS_DIR | Out-Null
          python cmake/conan/export_pinned_dependency_recipes.py `
            --archive (Join-Path $env:RUNNER_TEMP 'ror-conan-recipes-d3568327.tar.gz') `
            --extract-root (Join-Path $env:RUNNER_TEMP 'ror-conan-recipes-export') |
            Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'pinned-conan-recipes.json')

      - name: Verify compiler, architecture, and PE audit tool
        shell: pwsh
        run: |
          cl 2>&1 | Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'msvc-version.txt')
          if (-not (Select-String -LiteralPath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'msvc-version.txt') -Pattern 'Version 19\.44\.')) {
            throw 'The reviewed MSVC 19.44 toolset is not active'
          }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          & $dumpbin.Source /nologo /headers $dumpbin.Source | Select-Object -First 20
          cmake --version
          ninja --version

      - name: Run combined-runtime fail-closed contracts
        shell: pwsh
        run: |
          python tests/tools/test_ogre_next_combined_provider_contract.py
          python tests/tools/test_ogre_next_embedded_namespace_contract.py
          python tests/tools/test_renderer_combined_game_wiring_contract.py
          python -O tests/tools/test_ogre_next_combined_provider_contract.py
          python -O tests/tools/test_ogre_next_embedded_namespace_contract.py
          python -O tests/tools/test_renderer_combined_game_wiring_contract.py

      - name: Verify the locked native Conan graph
        shell: pwsh
        run: |
          python tests/tools/assert_ogre14_app_graph.py `
            --platform windows-x86_64 |
            Tee-Object -FilePath (Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR 'windows-x86_64-conan-graph.json')

      - name: Configure clean Windows RoR-Combined Release
        shell: pwsh
        run: |
          $tracked = git status --porcelain --untracked-files=no
          if ($tracked) {
            throw "The source checkout is dirty before configure: $tracked"
          }
          $conanProvider = Join-Path $env:GITHUB_WORKSPACE 'cmake/conan_provider.cmake'
          $conanProfile = Join-Path $env:GITHUB_WORKSPACE 'cmake/conan/profiles/windows-x86_64-release'
          $cmakeArguments = @(
            '-S', '.',
            '-B', $env:ROR_COMBINED_BUILD_DIR,
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_INSTALL_PREFIX=$env:ROR_COMBINED_STAGE_DIR",
            "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$conanProvider",
            "-DCONAN_HOST_PROFILE=$conanProfile",
            "-DCONAN_BUILD_PROFILE=$conanProfile",
            '-DROR_BUILD_TESTS=OFF',
            '-DROR_CREATE_CONTENT_FOLDER=ON',
            '-DROR_OGRE_NEXT_COMBINED_RUNTIME=ON',
            '-DROR_RENDERER_PUBLIC_LAUNCHER=OFF',
            '-DROR_OGRE_NEXT_PRODUCTION_PACKAGE=OFF',
            '-DROR_OGRE_NEXT_DEMO_ADMISSION=OFF'
          )
          & cmake @cmakeArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Windows RoR-Combined configure failed with exit code $LASTEXITCODE"
          }

      - name: Build and prove the final combined PE closure
        shell: pwsh
        run: >-
          cmake
          --build $env:ROR_COMBINED_BUILD_DIR
          --target ror_ogre_next_combined_verified
          --config Release

      - name: Require a qualification-eligible combined PE receipt
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["ROR_COMBINED_BUILD_DIR"])
          required = (
              build / "bin/RoR-Combined.exe",
              build / "source/main/RoR-Combined.binary-closure.json",
              build / "ogre-next-embedded/ogre-next-combined-namespace-audit.json",
              build / "bin/resources/ogrenext/.complete.json",
          )
          for path in required:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"required combined build output is unavailable: {path}")
          document = json.loads(required[1].read_text(encoding="utf-8"))
          expected = {
              "schema": "ror.ogre_next_combined_pe_closure.v1",
              "platform_policy": "windows-x64-d3d11",
              "qualification_eligible": True,
              "bridge_or_transport_symbols_present": False,
              "root_sdl_symbols_present": False,
              "ogre14_host_imports_present": True,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"combined PE closure changed: {field}={document.get(field)!r}"
                  )
          '@ | python -

      - name: Install and relocate the combined Windows runtime
        shell: pwsh
        run: |
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Base_Game
          cmake --install $env:ROR_COMBINED_BUILD_DIR `
            --prefix $env:ROR_COMBINED_STAGE_DIR `
            --component Base_Content

      - name: Audit relocated runtime and retain provenance
        shell: pwsh
        run: |
          $stage = $env:ROR_COMBINED_STAGE_DIR
          $build = $env:ROR_COMBINED_BUILD_DIR
          $exe = Join-Path $stage 'RoR-Combined.exe'
          foreach ($path in @(
              $exe,
              (Join-Path $stage 'resources/ogrenext/ShaderMedia'),
              (Join-Path $stage 'resources/ogrenext/Presentation'),
              (Join-Path $stage 'resources/ogrenext/.complete.json'),
              (Join-Path $stage 'content')
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Relocated combined runtime input is missing: $path"
            }
          }
          foreach ($forbidden in @('RoR.exe', 'RoR-Ogre14.exe')) {
            if (Test-Path -LiteralPath (Join-Path $stage $forbidden)) {
              throw "Relocated package contains a legacy-visible executable: $forbidden"
            }
          }
          $qualification = Join-Path $stage 'qualification'
          New-Item -ItemType Directory -Force -Path $qualification | Out-Null
          dumpbin /nologo /headers $exe |
            Tee-Object -FilePath (Join-Path $qualification 'RoR-Combined.headers.txt')
          dumpbin /nologo /dependents $exe |
            Tee-Object -FilePath (Join-Path $qualification 'RoR-Combined.dependents.txt')
          foreach ($pair in @(
              @('source/main/RoR-Combined.binary-closure.json', 'RoR-Combined.binary-closure.json'),
              @('ogre-next-embedded/ogre-next-combined-namespace-audit.json', 'ogre-next-combined-namespace-audit.json'),
              @('ogre-next-embedded/ogre-next-combined-provider-contract.json', 'ogre-next-combined-provider-contract.json'),
              @('bin/resources/ogrenext/.complete.json', 'ogre-next-combined-resources.complete.json')
          )) {
            Copy-Item -LiteralPath (Join-Path $build $pair[0]) `
              -Destination (Join-Path $qualification $pair[1])
          }
          $quarantine = Join-Path $env:RUNNER_TEMP 'ror-combined-build-media-quarantine'
          if (Test-Path -LiteralPath $quarantine) {
            throw "Build-media quarantine already exists: $quarantine"
          }
          Move-Item -LiteralPath (Join-Path $build 'bin/resources/ogrenext') `
            -Destination $quarantine

      - name: Render bounded Ogre-Next frames with relocated D3D11 runtime
        shell: pwsh
        run: |
          $stage = $env:ROR_COMBINED_STAGE_DIR
          $smoke = Join-Path $env:RUNNER_TEMP 'ror-combined-smoke'
          $profile = Join-Path $smoke 'profile'
          $appData = Join-Path $profile 'AppData/Roaming'
          $localData = Join-Path $profile 'AppData/Local'
          New-Item -ItemType Directory -Force -Path $appData, $localData | Out-Null
          $receipt = Join-Path $stage 'qualification/renderer-smoke.json'
          $log = Join-Path $stage 'qualification/renderer-smoke.console.log'
          if (Test-Path -LiteralPath $receipt) {
            throw 'Renderer smoke receipt already exists'
          }
          $env:USERPROFILE = $profile
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localData
          $stdout = Join-Path $smoke 'renderer-smoke.stdout.log'
          $stderr = Join-Path $smoke 'renderer-smoke.stderr.log'
          $arguments = @(
            '--native-visual-showcase',
            '-frame-budget', 'measure',
            '-frame-budget-receipt', $receipt,
            '-frame-budget-scenario', 'ci.ogre-next-combined.windows-renderer-smoke',
            '-frame-budget-sustained-ms', '1000',
            '-frame-budget-percentile', '99',
            '-frame-budget-percentile-ms', '1000',
            '-frame-budget-warmup', '2',
            '-frame-budget-minimum', '8',
            '-frame-budget-frames', '12'
          )
          $process = Start-Process `
            -FilePath (Join-Path $stage 'RoR-Combined.exe') `
            -ArgumentList $arguments `
            -WorkingDirectory $stage `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Relocated Windows renderer smoke exceeded 120 seconds'
          }
          $process.WaitForExit()
          $status = $process.ExitCode
          Get-Content -LiteralPath $stdout, $stderr |
            Set-Content -LiteralPath $log -Encoding utf8NoBOM
          if ($status -ne 0) {
            throw "Relocated Windows renderer smoke failed with exit code $status"
          }
          @'
          import json
          import os
          from pathlib import Path

          receipt = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "qualification/renderer-smoke.json"
          )
          document = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "format": "ror-frame-time-budget-v1",
              "mode": "measure",
              "scenario_id": "ci.ogre-next-combined.windows-renderer-smoke",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requires_native_scene_draw_metrics": True,
              "requested_frames": 12,
              "accepted_frames": 12,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 12,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"Windows renderer smoke receipt changed: {field}={document.get(field)!r}"
                  )
          if document.get("native_scene_draw_p99", 0) <= 0:
              raise SystemExit("Windows renderer smoke submitted no native scene draws")
          '@ | python -

      - name: Write deterministic Windows package inventory
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat

          root = Path(os.environ["ROR_COMBINED_STAGE_DIR"]).resolve(strict=True)
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"Windows package contains a symlink: {path}")
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == "qualification/package-inventory.json":
                  continue
              files.append(
                  {
                      "path": relative,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "mode": stat.S_IMODE(path.stat().st_mode),
                      "stage_kind": "regular",
                  }
              )
          document = {
              "schema": "ror.ogre_next_combined_windows_package.v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "platform_policy": "windows-x64-d3d11",
              "entrypoint": "RoR-Combined.exe",
              "executable": "RoR-Combined.exe",
              "renderer": "ogre-next",
              "legacy_visible_presentation": False,
              "renderer_smoke_only": True,
              "playability_qualified": False,
              "artifact_transport": "github-actions-upload-artifact-v7",
              "all_transport_files_inventoried": True,
              "files": files,
          }
          output = root / "qualification/package-inventory.json"
          output.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          '@ | python -

      - name: Upload qualified Windows RoR-Combined runtime
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-Windows-x64-D3D11-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: ${{ runner.temp }}/ror-combined-stage/

      - name: Upload Windows combined-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: RoR-Combined-Windows-x64-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ror-combined-artifacts/
            ${{ runner.temp }}/ror-combined-build/CMakeCache.txt
            ${{ runner.temp }}/ror-combined-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/ror-combined-build/ogre-next-embedded/*.json
            ${{ runner.temp }}/ror-combined-build/source/main/RoR-Combined.*
            ${{ runner.temp }}/ror-combined-stage/qualification/
