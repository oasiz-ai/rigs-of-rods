      - name: Render bounded Ogre-Next frames with relocated D3D11 runtime
        shell: pwsh
        run: |
          $stage = $env:ROR_COMBINED_STAGE_DIR
          $smoke = Join-Path $env:RUNNER_TEMP 'ror-combined-smoke'
          $profile = Join-Path $smoke 'profile'
          $appData = Join-Path $profile 'AppData/Roaming'
          $localData = Join-Path $profile 'AppData/Local'
          New-Item -ItemType Directory -Force -Path $appData, $localData | Out-Null
          $receipt = Join-Path $stage 'qualification/renderer-smoke.json'
          $log = Join-Path $stage 'qualification/renderer-smoke.console.log'
          if (Test-Path -LiteralPath $receipt) {
            throw 'Renderer smoke receipt already exists'
          }
          $env:USERPROFILE = $profile
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localData
          $env:ROR_D0_SCENE_HOME = $profile
          $stdout = Join-Path $smoke 'renderer-smoke.stdout.log'
          $stderr = Join-Path $smoke 'renderer-smoke.stderr.log'
          $events = Join-Path $smoke 'renderer-smoke.windows-events.log'
          $dumps = Join-Path $smoke 'crash-dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $env:ROR_WINDOWS_CRASH_DUMP_PATH =
            Join-Path $dumps 'RoR-Combined.dmp'
          $werKey = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\RoR-Combined.exe'
          try {
            New-Item -Path $werKey -Force | Out-Null
            New-ItemProperty -Path $werKey -Name DumpFolder `
              -PropertyType ExpandString -Value $dumps -Force | Out-Null
            New-ItemProperty -Path $werKey -Name DumpType `
              -PropertyType DWord -Value 2 -Force | Out-Null
          } catch {
            Write-Warning "Could not enable Windows local dumps: $($_.Exception.Message)"
          }
          $arguments = @(
            '--native-visual-showcase',
            '-frame-budget', 'measure',
            '-frame-budget-receipt', $receipt,
            '-frame-budget-scenario', 'ci.ogre-next-combined.windows-renderer-smoke',
            '-frame-budget-sustained-ms', '1000',
            '-frame-budget-percentile', '99',
            '-frame-budget-percentile-ms', '1000',
            '-frame-budget-warmup', '2',
            '-frame-budget-minimum', '8',
            '-frame-budget-frames', '12'
          )
          $process = Start-Process `
            -FilePath (Join-Path $stage 'RoR-Combined.exe') `
            -ArgumentList $arguments `
            -WorkingDirectory $stage `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $smokeStartedAt = Get-Date
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Relocated Windows renderer smoke exceeded 120 seconds'
          }
          $process.WaitForExit()
          $status = $process.ExitCode
          $combinedLog = [System.Collections.Generic.List[string]]::new()
          foreach ($path in @($stdout, $stderr)) {
            if (Test-Path -LiteralPath $path) {
              foreach ($line in Get-Content -LiteralPath $path) {
                $combinedLog.Add($line)
              }
              Get-Content -LiteralPath $path
            }
          }
          [System.IO.File]::WriteAllLines(
            $log,
            $combinedLog,
            [System.Text.UTF8Encoding]::new($false)
          )
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = $smokeStartedAt.AddSeconds(-5)
          } -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ProviderName -in @('Application Error', 'Windows Error Reporting')
            } |
            Select-Object -First 20 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Format-List |
            Out-File -LiteralPath $events -Encoding utf8
          if (Test-Path -LiteralPath $events) {
            Get-Content -LiteralPath $events
          }
          if ($status -ne 0) {
            throw "Relocated Windows renderer smoke failed with exit code $status"
          }
          @'
          import json
          import os
          from pathlib import Path

          receipt = (
              Path(os.environ["ROR_COMBINED_STAGE_DIR"])
              / "qualification/renderer-smoke.json"
          )
          document = json.loads(receipt.read_text(encoding="utf-8"))
          expected = {
              "format": "ror-frame-time-budget-v1",
              "mode": "measure",
              "scenario_id": "ci.ogre-next-combined.windows-renderer-smoke",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requires_native_scene_draw_metrics": True,
              "requested_frames": 12,
              "accepted_frames": 12,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 12,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if document.get(field) != value:
                  raise SystemExit(
                      f"Windows renderer smoke receipt changed: {field}={document.get(field)!r}"
                  )
          if document.get("native_scene_draw_p99", 0) <= 0:
              raise SystemExit("Windows renderer smoke submitted no native scene draws")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Windows renderer smoke receipt validation failed with exit code $LASTEXITCODE"
          }
          $nativePackage = Join-Path $stage 'resources/nextgen/native/a1_native_course_60m/rorng_a1_native_course_60m.rornative'
          $nativeLodReceipt = Join-Path $stage 'qualification/native-a1-distance-lod-runtime.json'
          foreach ($path in @($nativePackage, (Join-Path $stage 'RoR-Combined.exe'))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Windows native A1 receipt input is missing: $path"
            }
          }
          if (Test-Path -LiteralPath $nativeLodReceipt) {
            throw "Windows native A1 receipt already exists: $nativeLodReceipt"
          }
          $nativePackageSha256 = (
            Get-FileHash -LiteralPath $nativePackage -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($nativePackageSha256 -cne 'e420438797a77e4e49b91e3c6c930f39d340f99a4772ef989182a62605f2d53b') {
            throw "Windows staged native A1 package digest changed: $nativePackageSha256"
          }
          $qualifiedStdout = Join-Path $stage 'qualification/renderer-smoke.stdout.log'
          $qualifiedStderr = Join-Path $stage 'qualification/renderer-smoke.stderr.log'
          foreach ($copy in @(
            @{ Source = $stdout; Destination = $qualifiedStdout },
            @{ Source = $stderr; Destination = $qualifiedStderr }
          )) {
            if (Test-Path -LiteralPath $copy.Destination) {
              throw "Windows native A1 raw log already exists: $($copy.Destination)"
            }
            Copy-Item -LiteralPath $copy.Source -Destination $copy.Destination -ErrorAction Stop
            if (-not (Test-Path -LiteralPath $copy.Destination -PathType Leaf)) {
              throw "Windows native A1 raw log was not staged: $($copy.Destination)"
            }
          }
          $nativeLodArguments = @(
            'tools/verify_native_a1_lod_runtime.py',
            '--log', $qualifiedStdout,
            '--stderr-log', $qualifiedStderr,
            '--frame-budget-receipt', $receipt,
            '--package', $nativePackage,
            '--executable', (Join-Path $stage 'RoR-Combined.exe'),
            '--output', $nativeLodReceipt,
            '--platform', 'win32',
            '--expected-lighting-mode', 'raster-hdr-pssm',
            '--package-sha256', 'e420438797a77e4e49b91e3c6c930f39d340f99a4772ef989182a62605f2d53b',
            '--repository-commit', $env:GITHUB_SHA,
            '--scenario-id', 'ci.ogre-next-combined.windows-renderer-smoke',
            '--accepted-frames', '12',
            '--expected-lod-items', '2',
            '--expected-lod-reduced', '2',
            '--expected-lod-max', '1',
            '--expected-lod-level-sum', '2',
            '--expected-triangles-base', '588',
            '--expected-triangles-selected', '252',
            '--expected-completed-frames', '1'
          )
          & python @nativeLodArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Windows native A1 LOD receipt failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $nativeLodReceipt -PathType Leaf)) {
            throw "Windows native A1 LOD receipt was not retained"
          }

