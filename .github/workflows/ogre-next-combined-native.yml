      - name: Stage the HLSL source compiler receipts
        shell: pwsh
        run: |
          $destinationDir = Join-Path $env:ROR_COMBINED_STAGE_DIR 'qualification/shader-source-compile'
          if (Test-Path -LiteralPath $destinationDir) {
            throw "Shader source-compile evidence destination already exists: $destinationDir"
          }
          New-Item -ItemType Directory -Path $destinationDir -ErrorAction Stop | Out-Null
          $evidenceFiles = [ordered]@{
            'hlsl-receipt.json' = 'windows-x86_64-modern-hlsl-source-compile.json'
            'fxc-provenance.json' = 'windows-x86_64-fxc-provenance.json'
          }
          foreach ($destinationName in $evidenceFiles.Keys) {
            $sourcePath = Join-Path $env:ROR_COMBINED_ARTIFACTS_DIR $evidenceFiles[$destinationName]
            $destinationPath = Join-Path $destinationDir $destinationName
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Shader source-compile evidence is missing: $sourcePath"
            }
            if ((Get-Item -LiteralPath $sourcePath).Length -le 0) {
              throw "Shader source-compile evidence is empty: $sourcePath"
            }
            Copy-Item -LiteralPath $sourcePath -Destination $destinationPath -ErrorAction Stop
            $sourceHash = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash
            $destinationHash = (Get-FileHash -LiteralPath $destinationPath -Algorithm SHA256).Hash
            if ($sourceHash -cne $destinationHash) {
              throw "Staged shader source-compile evidence changed: $destinationName"
            }
          }

