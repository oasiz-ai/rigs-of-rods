      - name: Audit the relocated Ogre-Next application bundle
        shell: bash
        run: |
          build="$ROR_COMBINED_BUILD_DIR"
          package="$ROR_COMBINED_PACKAGE_DIR"
          app="$build/bin/RoR-Combined.app"
          executable="$app/Contents/MacOS/RoR-Combined"
          qualification="$package/qualification"
          test -d "$app"
          test -x "$executable"
          test ! -e "$app/Contents/MacOS/RoR"
          test ! -e "$app/Contents/MacOS/RoR-Ogre14"
          test "$({
            find "$app/Contents/MacOS" \
              -maxdepth 1 -type f -perm -111 -print
          } | wc -l | tr -d ' ')" = "1"
          test -d "$app/Contents/Resources/resources/ogrenext/ShaderMedia"
          test -d "$app/Contents/Resources/resources/ogrenext/Presentation"
          test -f "$app/Contents/Resources/resources/ogrenext/.complete.json"
          test -f "$app/Contents/Resources/content/simple2-terrain.zip"
          test -f "$app/Contents/Resources/content/dafsemi.zip"
          test -f "$app/Contents/Resources/content/agora.zip"
          test "$(lipo -archs "$executable")" = "arm64"
          test "$(
            otool -l "$executable" |
              awk '
                /LC_BUILD_VERSION/ { in_build_version = 1; next }
                in_build_version && $1 == "minos" { print $2; exit }
              '
          )" = "11.0"
          test "$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist"
          )" = "RoR-Combined"
          test "$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          )" = "org.rigsofrods.RoR.OgreNextCombined"
          codesign --verify --deep --strict --verbose=2 "$app"
          cmake -E make_directory "$qualification"
          otool -L "$executable" \
            | tee "$qualification/RoR-Combined.otool-L.txt"
          otool -l "$executable" \
            | tee "$qualification/RoR-Combined.otool-l.txt"
          python - \
              "$executable" \
              "$build" \
              "$CONAN_HOME" \
              "$qualification/RoR-Combined.otool-L.txt" \
              "$qualification/RoR-Combined.otool-l.txt" <<'PY'
          from pathlib import Path
          import sys

          executable = Path(sys.argv[1]).resolve(strict=True)
          forbidden = tuple(sys.argv[2:4])
          for report_name in sys.argv[4:]:
              report = Path(report_name).resolve(strict=True)
              for line_number, line in enumerate(
                  report.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  # otool prefixes every report with the inspected subject's
                  # absolute path. That heading is not a Mach-O load command.
                  if line_number == 1 and line == f"{executable}:":
                      continue
                  for root in forbidden:
                      if root in line:
                          raise SystemExit(
                              f"relocated RoR-Combined retains forbidden "
                              f"root in {report.name}:{line_number}: {root}"
                          )
          PY
          cmake -E copy \
            "$build/source/main/RoR-Combined.binary-closure.json" \
            "$qualification/RoR-Combined.binary-closure.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-namespace-audit.json" \
            "$qualification/ogre-next-combined-namespace-audit.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre-next-combined-provider-contract.json" \
            "$qualification/ogre-next-combined-provider-contract.json"
          cmake -E copy \
            "$build/ogre-next-embedded/ogre14-runtime-manifest.txt" \
            "$qualification/ogre14-runtime-manifest.txt"
          cmake -E copy \
            "$build/bin/resources/ogrenext/.complete.json" \
            "$qualification/ogre-next-combined-resources.complete.json"

