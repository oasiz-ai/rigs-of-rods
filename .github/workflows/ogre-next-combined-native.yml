            --measure-only \
            --timeout 180
          python - "$scene/performance-run.json" <<'PY'
          import json
          import sys

          document = json.load(open(sys.argv[1], encoding="utf-8"))
          receipt = document.get("receipt", {})
          renderer = document.get("renderer", {})
          expected = {
              "scenario_id": "ci.ogre-next-combined.macos-packaged-simple2-semi",
              "terrain": "simple2_a.terrn2",
              "actor": "b6b0UID-semi.truck",
              "renderer": "ogre-next-combined",
              "presents_frames": True,
              "requires_native_scene_draw_metrics": True,
              "accepted_frames": 24,
              "rejected_frames": 0,
              "native_scene_draw_exact_samples": 24,
              "native_scene_draw_rejected_samples": 0,
          }
          for field, value in expected.items():
              if receipt.get(field) != value:
                  raise SystemExit(
                      f"packaged macOS scene receipt changed: {field}={receipt.get(field)!r}"
                  )
          if renderer.get("startup_capture_rejections") != 0:
              raise SystemExit("packaged macOS scene rejected an Ogre-Next capture")
          if renderer.get("render_system") != "ogre-next-metal":
              raise SystemExit(
                  "packaged macOS scene did not identify visible Ogre-Next Metal"
              )
          if renderer.get("resource_host_render_system") != (
              "OpenGL 3+ Rendering Subsystem"
          ):
              raise SystemExit(
                  "packaged macOS scene did not isolate the hidden OGRE14 host"
              )
          ownership = renderer.get("presentation_ownership", {})
          if ownership != {
              "presentation_owner": "ogre-next",
              "visible_render_system": "ogre-next-metal",
              "visible_window": True,
              "legacy_visible_fallback": False,
              "resource_host": "ogre14",
              "resource_host_visible": False,
              "resource_host_protected": True,
          }:
              raise SystemExit("packaged macOS scene presentation ownership changed")
          native = renderer.get("native_distance_lod", {})
          if native.get("available") is not True or native.get("pbs", 0) <= 0:
              raise SystemExit("packaged macOS scene produced no native PBS/LOD frame")
          if "--native-visual-showcase" in document.get("command", []):
              raise SystemExit("packaged macOS scene selected renderer-only showcase")
          PY
          grep -Fq '===== LOADING TERRAIN simple2_a.terrn2' "$scene/RoR.log"
          grep -Fq '== Spawning vehicle: Daf Semi truck' "$scene/RoR.log"
          if grep -Fq "$ROR_COMBINED_BUILD_DIR/bin/resources/ogrenext" \
              "$scene/RoR.log" "$scene/console.txt" \
              || grep -Fq "$CONAN_HOME" \
              "$scene/RoR.log" "$scene/console.txt" \
              || grep -Fq "$GITHUB_WORKSPACE" \
              "$scene/RoR.log" "$scene/console.txt"; then
            echo 'packaged macOS scene accessed an unbundled runtime path' >&2
            exit 1
          fi
          if grep -Eiq "Program '[^']+\\.(glsl|glsles)' is not supported|Program 'SkyX_[^']+' is not supported|Program 'Ogre/Compositor/StdQuad_[^']+' is not supported|Program '(NiceMetal|SimpleMetal)[^']*' is not supported|Program 'Examples/(Fresnel[^']*|ReflectFP[^']*)' is not supported|Program '(grassVP|grassFP)[^']*' is not supported|Program '(ambient_vs|ambient_ps|render_vs|render_ps|render_gr_ps|diffuse_vs|diffuse_ps|diffuse_ps_env|diffuse_sh_vs|diffuse_sh_ps|diffuse_sh_a_ps)[^']*' is not supported|(NiceMetal|SimpleMetal|Fresnel|ReflectFP|grassVP|grassFP|grass_(gl3plus|d3d11)|ambient_vs|ambient_ps|render_vs|render_ps|render_gr_ps|diffuse_vs|diffuse_ps|diffuse_ps_env|diffuse_sh_vs|diffuse_sh_ps|diffuse_sh_a_ps|general_(gl3plus|d3d11))[^[:cntrl:]]*((compil|load)[^[:cntrl:]]*(fail|error)|(fail|error)[^[:cntrl:]]*(compil|load))|((compil|load)[^[:cntrl:]]*(fail|error)|(fail|error)[^[:cntrl:]]*(compil|load))[^[:cntrl:]]*(NiceMetal|SimpleMetal|Fresnel|ReflectFP|grassVP|grassFP|grass_(gl3plus|d3d11)|ambient_vs|ambient_ps|render_vs|render_ps|render_gr_ps|diffuse_vs|diffuse_ps|diffuse_ps_env|diffuse_sh_vs|diffuse_sh_ps|diffuse_sh_a_ps|general_(gl3plus|d3d11))|RTSS:[^[:cntrl:]]*'[^']*nicemetal[^']*'|Error: ScriptCompiler .*SkyX\\.material|Error: ScriptCompiler .*StdQuad_vp\\.program|Error: ScriptCompiler .*nicemetal[^[:cntrl:]]*\\.(program|material)|Error: ScriptCompiler .*fresnel\\.material|Error: ScriptCompiler .*grass\\.material|Error: ScriptCompiler .*general\\.(program|material)" \
              "$scene/RoR.log" "$scene/console.txt"; then
            echo 'MyGUI GLSL compilation failed, or SkyX/StdQuad/NiceMetal/Fresnel/Grass/General shader/material compilation or explicit-program loading failed in the packaged macOS runtime; this is compile/load diagnostic coverage only, not Fresnel water, grass, or General draw evidence' >&2
            exit 1
          fi
          destination="$ROR_COMBINED_PACKAGE_DIR/qualification/packaged-scene-smoke"
          cmake -E make_directory "$destination"
          cmake -E copy "$scene/performance-run.json" "$destination/performance-run.json"
