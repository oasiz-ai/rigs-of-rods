name: Content provenance preflight

on: [push, pull_request]

jobs:
  provenance-tool:
    name: Provenance tool (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
          - macos-15
        python:
          - "3.11"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Run standard-library provenance, asset, and renderer tests
        run: >-
          python -m unittest -v
          tests/tools/test_content_provenance_audit.py
          tests/tools/test_content_provenance_workflow_contract.py
          tests/tools/test_postprocess_resources.py
          tests/tools/test_postprocess_runtime_contract.py
          tests/tools/test_audit_ogre14_material_scripts.py
          tests/tools/test_classify_cityworld_material_families.py
          tests/tools/test_build_cityworld_local_overlay.py
          tests/tools/test_build_cityworld_next_provenance.py
          tests/tools/test_canonicalize_static_glb.py
          tests/tools/test_cityworld_infill.py
          tests/tools/test_cityworld_infill_assets.py
          tests/tools/test_cityworld_storefront_family.py
          tests/tools/test_cityworld_neoq_intercity_bridge.py
          tests/tools/test_cityworld_tree_family.py
          tests/tools/test_compile_cityworld_asset.py
          tests/tools/test_native_render_asset.py
          tests/tools/test_run_cityworld_bridge_scene.py
          tests/tools/test_run_cityworld_corridor_scene.py
          tests/tools/test_run_cityworld_curved_bridge_scene.py
          tests/tools/test_run_cityworld_bridge_transition_scene.py
          tests/tools/test_run_cityworld_gateway_scene.py
          tests/tools/test_run_cityworld_infill_scene.py
          tests/tools/test_run_cityworld_led_streetlight_scene.py
          tests/tools/test_run_cityworld_shadow_scene.py
          tests/tools/test_solve_cityworld_bridge_corridor.py
          tests/tools/test_validate_cityworld_asset.py

      - name: Run optimized provenance, asset, and renderer tests
        run: >-
          python -O -m unittest -v
          tests/tools/test_content_provenance_audit.py
          tests/tools/test_content_provenance_workflow_contract.py
          tests/tools/test_postprocess_resources.py
          tests/tools/test_postprocess_runtime_contract.py
          tests/tools/test_audit_ogre14_material_scripts.py
          tests/tools/test_classify_cityworld_material_families.py
          tests/tools/test_build_cityworld_local_overlay.py
          tests/tools/test_build_cityworld_next_provenance.py
          tests/tools/test_canonicalize_static_glb.py
          tests/tools/test_cityworld_infill.py
          tests/tools/test_cityworld_infill_assets.py
          tests/tools/test_cityworld_storefront_family.py
          tests/tools/test_cityworld_neoq_intercity_bridge.py
          tests/tools/test_cityworld_tree_family.py
          tests/tools/test_compile_cityworld_asset.py
          tests/tools/test_native_render_asset.py
          tests/tools/test_run_cityworld_bridge_scene.py
          tests/tools/test_run_cityworld_corridor_scene.py
          tests/tools/test_run_cityworld_curved_bridge_scene.py
          tests/tools/test_run_cityworld_bridge_transition_scene.py
          tests/tools/test_run_cityworld_gateway_scene.py
          tests/tools/test_run_cityworld_infill_scene.py
          tests/tools/test_run_cityworld_led_streetlight_scene.py
          tests/tools/test_run_cityworld_shadow_scene.py
          tests/tools/test_solve_cityworld_bridge_corridor.py
          tests/tools/test_validate_cityworld_asset.py

      - name: Verify checked forward-native A0 package
        shell: bash
        run: |
          python tools/validate_native_render_asset.py \
            content-source/native_render/a0_road_tile_12m/rorng_a0_road_tile_12m.native.json \
            --repo-root .
          python tools/compile_native_render_asset.py \
            content-source/native_render/a0_road_tile_12m/rorng_a0_road_tile_12m.native.json \
            --repo-root . \
            --validate-checked

      - name: Verify checked-in CityWorld provenance and release gate
        shell: bash
        run: |
          python tools/build_cityworld_next_provenance.py --repo-root . --check
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/bridge/rorng_city_bridge_span_20m.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/bridge/rorng_city_bridge_span_20m.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/bridge/curve_left_15deg/rorng_city_bridge_curve_left_15deg_20m.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/bridge/curve_left_15deg/rorng_city_bridge_curve_left_15deg_20m.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/bridge/transition_12m/rorng_city_bridge_transition_12m.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/bridge/transition_12m/rorng_city_bridge_transition_12m.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/streetscape/gateway_block_40m/rorng_city_gateway_block_40m.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/streetscape/gateway_block_40m/rorng_city_gateway_block_40m.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/fixtures/led_streetlight/rorng_city_led_streetlight.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/fixtures/led_streetlight/rorng_city_led_streetlight.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/fixtures/led_streetlight_bridge/rorng_city_led_streetlight_bridge.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/fixtures/led_streetlight_bridge/rorng_city_led_streetlight_bridge.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_tree_family.py \
            content-source/cityworld_next/vegetation/rorng_city_neoq_tree_family.v1.json \
            --repo-root .
          python tools/validate_cityworld_storefront_family.py \
            content-source/cityworld_next/buildings/storefront_family/rorng_city_storefront_family.v1.json \
            --repo-root .
          for manifest in \
            resources/nextgen/cityworld/buildings/storefront_family/*/*.asset.json
          do
            python tools/validate_cityworld_asset.py \
              "$manifest" \
              --repo-root .
            python tools/compile_cityworld_asset.py \
              "$manifest" \
              --repo-root . \
              --validate-checked
          done
          for manifest in \
            resources/nextgen/cityworld/regional_infill/*/*.asset.json
          do
            python tools/validate_cityworld_asset.py \
              "$manifest" \
              --repo-root .
            python tools/compile_cityworld_asset.py \
              "$manifest" \
              --repo-root . \
              --validate-checked
          done
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/vegetation/rorng_city_neoq_tree_round/rorng_city_neoq_tree_round.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/vegetation/rorng_city_neoq_tree_round/rorng_city_neoq_tree_round.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/vegetation/rorng_city_neoq_tree_columnar/rorng_city_neoq_tree_columnar.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/vegetation/rorng_city_neoq_tree_columnar/rorng_city_neoq_tree_columnar.asset.json \
            --repo-root . \
            --validate-checked
          python tools/validate_cityworld_asset.py \
            resources/nextgen/cityworld/vegetation/rorng_city_neoq_tree_windswept/rorng_city_neoq_tree_windswept.asset.json \
            --repo-root .
          python tools/compile_cityworld_asset.py \
            resources/nextgen/cityworld/vegetation/rorng_city_neoq_tree_windswept/rorng_city_neoq_tree_windswept.asset.json \
            --repo-root . \
            --validate-checked
          python tools/content_provenance_audit.py \
            --manifest content-source/cityworld_next/provenance/cityworld_next.manifest.json \
            --inventory content-source/cityworld_next/provenance/cityworld_next.inventory.json \
            --release-gate \
            --package-root resources/nextgen/cityworld \
            --editable-root .
