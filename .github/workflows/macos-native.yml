---
name: macOS native Apple Silicon

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ogre14-app:
    name: OGRE 14 app bundle (arm64)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Conan client
        run: |
          pipx install --force conan==2.31.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/conan" --version

      - name: Restore Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: macos-15-arm64-conan-2.31.1-${{ hashFiles('conanfile.py', 'cmake/conan/locks/*.lock', 'cmake/conan/recipes/**') }}
          restore-keys: |
            macos-15-arm64-conan-2.31.1-

      - name: Configure Conan remotes and profile
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path.home() / ".conan2"
          home.mkdir(parents=True, exist_ok=True)
          (home / "global.conf").write_text(
              'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n',
              encoding="utf-8",
          )
          PY
          conan profile detect --force
          conan remote add \
            conancenter https://center2.conan.io --force
          conan remote add \
            rigs-of-rods-deps \
            https://nexus.anotherfoxguy.com/repository/rigs-of-rods/ \
            --force
          conan profile show

      - name: Verify native runner and pinned content
        run: |
          test "$(uname -m)" = "arm64"
          test "$(git -C content rev-parse HEAD)" = \
            "34fefdd126784bf87b068fc283f812525d159dd7"
          xcodebuild -version
          clang++ --version

      - name: Configure native OGRE 14 application
        run: |
          cmake \
            -S . \
            -B build-macos-ogre14 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DROR_BUILD_TESTS=ON \
            -DROR_CREATE_CONTENT_FOLDER=ON \
            -DROR_OGRE14=ON

      - name: Build native application and tests
        run: >-
          cmake
          --build build-macos-ogre14
          --target all
          --config Release

      - name: Stage application bundle
        run: >-
          cmake
          --build build-macos-ogre14
          --target ror_macos_bundle
          --config Release

      - name: Run native test suite
        run: >-
          ctest
          --test-dir build-macos-ogre14
          --build-config Release
          --output-on-failure

      - name: Run packaging and tooling tests
        run: >-
          python3 -m unittest discover
          -s tests/tools
          -p 'test_*.py'

      - name: Audit application bundle
        shell: bash
        run: |
          app="build-macos-ogre14/bin/RoR.app"
          executable="$app/Contents/MacOS/RoR"
          compatibility_executable="$app/Contents/MacOS/RoR-Ogre14"

          test -d "$app"
          test -x "$executable"
          test -x "$compatibility_executable"
          test "$({
            find "$app/Contents/MacOS" \
              -maxdepth 1 -type f -perm -111 -print
          } | wc -l | tr -d ' ')" = "2"
          test "$(lipo -archs "$executable")" = "arm64"
          test "$(
            otool -l "$executable" |
              awk '
                /LC_BUILD_VERSION/ { in_build_version = 1; next }
                in_build_version && $1 == "minos" { print $2; exit }
              '
          )" = "11.0"
          executable_rpaths="$(
            otool -l "$executable" |
              awk '
                $1 == "cmd" && $2 == "LC_RPATH" {
                  in_rpath = 1
                  next
                }
                in_rpath && $1 == "path" {
                  print $2
                  in_rpath = 0
                }
              '
          )"
          test "$executable_rpaths" = "$(
            printf '%s\n%s' \
              '@executable_path/../Frameworks' \
              '@executable_path/../PlugIns'
          )"
          while IFS= read -r -d '' binary; do
            test "$(lipo -archs "$binary")" = "arm64"
            test "$(
              otool -l "$binary" |
                awk '
                  /LC_BUILD_VERSION/ { in_build_version = 1; next }
                  in_build_version && $1 == "minos" { print $2; exit }
                '
            )" = "11.0"
          done < <(
            printf '%s\0%s\0' "$executable" "$compatibility_executable"
            find \
              "$app/Contents/PlugIns" \
              "$app/Contents/Frameworks" \
              -type f -name '*.dylib' -print0
          )

          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"

          test -L "$app/Contents/MacOS/resources"
          test -L "$app/Contents/MacOS/languages"
          test -L "$app/Contents/MacOS/content"
          test -L "$app/Contents/MacOS/plugins.cfg"
          test -L "$app/Contents/MacOS/plugins_d.cfg"
          cmp \
            "$app/Contents/Resources/plugins.cfg" \
            "$app/Contents/Resources/plugins_d.cfg"
          test ! -e "$app/Contents/MacOS/config"

          diff -qr \
            build-macos-ogre14/bin/resources/ogre14 \
            "$app/Contents/Resources/OGRE"
          test -f \
            "$app/Contents/Resources/OGRE/RTShaderLib/FFPLib_Transform.glsl"
          test -f \
            "$app/Contents/Resources/OGRE/RTShaderLib/RTSLib_Lighting.glsl"
          test -f \
            "$app/Contents/Resources/OGRE/Terrain/TerrainSurface.glsl"

          controller_map="config/SDL_GameController_v1.macos.map"
          skeleton="$app/Contents/Resources/resources/skeleton.zip"
          unzip -tqq "$skeleton"
          skeleton_entry_count="$(unzip -Z1 "$skeleton" | wc -l | tr -d ' ')"
          skeleton_unique_entry_count="$(
            unzip -Z1 "$skeleton" | LC_ALL=C sort -u | wc -l | tr -d ' '
          )"
          test "$skeleton_entry_count" = "$skeleton_unique_entry_count"
          for directory in \
            cache/ \
            config/ \
            logs/ \
            mods/ \
            repo_attachments/ \
            savegames/ \
            screenshots/ \
            thumbnails/
          do
            unzip -Z1 "$skeleton" | grep -Fx "$directory"
          done
          unzip -Z1 "$skeleton" | grep -Fx "$controller_map"
          unzip -p "$skeleton" "$controller_map" |
            cmp - "resources/skeleton/$controller_map"
          unzip -p "$skeleton" "$controller_map" |
            grep -F \
              "TRUCK_ACCELERATE              JoystickAxis         0 5 UPPER"
          unzip -p "$skeleton" "$controller_map" |
            grep -F \
              "TRUCK_BRAKE                   JoystickAxis         0 4 UPPER"

          test "$(
            find "$app/Contents/PlugIns" -type f -name '*.dylib' |
              wc -l |
              tr -d ' '
          )" = "4"
          test "$(
            find "$app/Contents/Frameworks" -type f -name '*.dylib' |
              wc -l |
              tr -d ' '
          )" = "9"

      - name: Build macOS GL3 capability probe
        shell: bash
        run: |
          xcrun clang++ \
            -std=c++17 \
            -arch arm64 \
            -mmacosx-version-min=11.0 \
            -fobjc-arc \
            -Wall \
            -Wextra \
            -Werror \
            -Wno-deprecated-declarations \
            -framework AppKit \
            -framework CoreGraphics \
            -framework OpenGL \
            tools/macos_gl3_capability_probe.mm \
            -o "$RUNNER_TEMP/ror-macos-gl3-capability-probe"
          test "$(
            lipo -archs "$RUNNER_TEMP/ror-macos-gl3-capability-probe"
          )" = "arm64"
          test "$(
            otool -l "$RUNNER_TEMP/ror-macos-gl3-capability-probe" |
              awk '
                /LC_BUILD_VERSION/ { in_build_version = 1; next }
                in_build_version && $1 == "minos" { print $2; exit }
              '
          )" = "11.0"

      - name: Exercise application bundle and renderer when available
        id: renderer_capability
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
          ALSOFT_LOGLEVEL: "0"
        run: |
          app="build-macos-ogre14/bin/RoR.app"
          executable="$app/Contents/MacOS/RoR"
          output="$RUNNER_TEMP/ror-bundle-smoke.stdout"
          pre_render_log="$RUNNER_TEMP/ror-bundle-pre-render.log"
          probe_log="$RUNNER_TEMP/ror-macos-gl3-capability.log"
          log="$HOME/Library/Logs/Rigs of Rods/RoR.log"
          script_log="$HOME/Library/Logs/Rigs of Rods/Angelscript.log"

          dump_smoke_logs() {
            for diagnostic in \
              "$pre_render_log" \
              "$probe_log" \
              "$output" \
              "$log" \
              "$script_log"; do
              if test -f "$diagnostic"; then
                echo "::group::$diagnostic"
                tail -n 200 "$diagnostic"
                echo "::endgroup::"
              fi
            done
          }
          trap 'status=$?; if test "$status" -ne 0; then dump_smoke_logs; fi' EXIT

          python3 tools/macos_bundle_smoke.py \
            --executable "$executable" \
            --probe "$RUNNER_TEMP/ror-macos-gl3-capability-probe" \
            --runtime-stdout "$output" \
            --engine-log "$log" \
            --script-log "$script_log" \
            --pre-render-log "$pre_render_log" \
            --probe-log "$probe_log" \
            --timeout 90
          if grep -q \
            '^ROR_MACOS_GL3_CAPABILITY=available ' \
            "$probe_log"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Drive CityWorld LED streetlight with macOS arm64 GL3Plus
        if: steps.renderer_capability.outputs.available == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          app="build-macos-ogre14/bin/RoR.app"
          python3 tools/run_cityworld_led_streetlight_scene.py \
            --executable "$app/Contents/MacOS/RoR" \
            --repository "$GITHUB_WORKSPACE" \
            --runtime-content "$app/Contents/Resources/content" \
            --artifact-dir "$RUNNER_TEMP/ror-cityworld-led-streetlight-macos-arm64" \
            --timeout 360 \
            2>&1 | tee \
              "$RUNNER_TEMP/ror-cityworld-led-streetlight-macos-arm64.driver.log"

      - name: Render CityWorld Bridge streetlight with macOS arm64 GL3Plus and V0A
        if: steps.renderer_capability.outputs.available == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          app="build-macos-ogre14/bin/RoR.app"
          python3 tools/run_cityworld_bridge_streetlight_scene.py \
            --executable "$app/Contents/MacOS/RoR" \
            --repository "$GITHUB_WORKSPACE" \
            --runtime-content "$app/Contents/Resources/content" \
            --artifact-dir "$RUNNER_TEMP/ror-cityworld-bridge-streetlight-macos-arm64" \
            --postprocess-mode v0a \
            --timeout 360 \
            2>&1 | tee \
              "$RUNNER_TEMP/ror-cityworld-bridge-streetlight-macos-arm64.driver.log"

      - name: Upload CityWorld LED streetlight diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Rigs-of-Rods-macOS-arm64-CityWorld-LED-streetlight
          path: |
            ${{ runner.temp }}/ror-cityworld-led-streetlight-macos-arm64
            ${{ runner.temp }}/ror-cityworld-led-streetlight-macos-arm64.driver.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CityWorld bridge streetlight diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Rigs-of-Rods-macOS-arm64-CityWorld-bridge-streetlight
          path: |
            ${{ runner.temp }}/ror-cityworld-bridge-streetlight-macos-arm64
            ${{ runner.temp }}/ror-cityworld-bridge-streetlight-macos-arm64.driver.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bundle-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Rigs-of-Rods-macOS-arm64-smoke-logs
          path: |
            ${{ runner.temp }}/ror-bundle-smoke.stdout
            ${{ runner.temp }}/ror-bundle-pre-render.log
            ${{ runner.temp }}/ror-macos-gl3-capability.log
            ~/Library/Logs/Rigs of Rods/RoR.log
            ~/Library/Logs/Rigs of Rods/Angelscript.log
          if-no-files-found: warn
          retention-days: 14

      - name: Archive verified application
        run: |
          mkdir -p artifacts
          ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            build-macos-ogre14/bin/RoR.app \
            artifacts/Rigs-of-Rods-macOS-arm64.zip
          shasum -a 256 \
            artifacts/Rigs-of-Rods-macOS-arm64.zip \
            > artifacts/Rigs-of-Rods-macOS-arm64.zip.sha256

      - name: Upload verified application
        uses: actions/upload-artifact@v7
        with:
          name: Rigs-of-Rods-macOS-arm64
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
