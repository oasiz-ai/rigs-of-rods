name: Inspect pinned Linux combined diagnostics

on:
  push:
    branches: [nextgen/playable-performance-gate]
    paths:
      - .github/workflows/inspect-pinned-linux-combined-diagnostics.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Inspect Linux save-resume diagnostics
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Download immutable failed-run diagnostics
        uses: actions/download-artifact@v7
        with:
          artifact-ids: "9542869408"
          github-token: ${{ github.token }}
          repository: oasiz-ai/rigs-of-rods
          run-id: "32786978090"
          path: ${{ runner.temp }}/linux-diagnostics

      - name: Download last qualified Linux runtime baseline
        uses: actions/download-artifact@v7
        with:
          artifact-ids: "9509986113"
          github-token: ${{ github.token }}
          repository: oasiz-ai/rigs-of-rods
          run-id: "32698175848"
          path: ${{ runner.temp }}/linux-qualified-baseline

      - name: Install baseline replay prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            xauth \
            xvfb
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp*json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_ICD_FILENAMES=$lvp_icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Surface allowlisted save-resume evidence
        shell: bash
        env:
          DIAGNOSTICS_ROOT: ${{ runner.temp }}/linux-diagnostics
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import struct
          import subprocess

          root = Path(os.environ["DIAGNOSTICS_ROOT"]).resolve(strict=True)
          files = sorted(path for path in root.rglob("*") if path.is_file())
          focused = [
              path
              for path in files
              if "deterministic-savegame-resume" in path.relative_to(root).as_posix()
          ]
          d0_markers = (
              "[RoR|D0|",
              "[RoR|Determinism]",
          )
          fatal_markers = (
              "reflection work remains pending",
              "deferred reflection capture",
              "could not be finished",
              "Validation Failed: Sampler error:",
              "GL_INVALID_",
              "RenderingAPIException",
              "OGRE EXCEPTION",
              "Segmentation fault",
          )

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          inventory = []
          for path in focused:
              inventory.append(
                  {
                      "path": path.relative_to(root).as_posix(),
                      "bytes": path.stat().st_size,
                      "sha256": sha256_file(path),
                  }
              )

          d0_lines = []
          fatal_lines = []
          runtime_tails = []
          for path in focused:
              if path.stat().st_size > 64 * 1024 * 1024:
                  continue
              if path.suffix not in {".log", ".stdout", ".txt"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for number, line in enumerate(text.splitlines(), 1):
                  if any(marker in line for marker in d0_markers):
                      d0_lines.append(
                          {
                              "path": path.relative_to(root).as_posix(),
                              "line": number,
                              "text": line[:500],
                          }
                      )
                  if any(marker in line for marker in fatal_markers):
                      fatal_lines.append(
                          {
                              "path": path.relative_to(root).as_posix(),
                              "line": number,
                              "text": line[:500],
                          }
                      )
              if path.name in {"RoR.log", "Angelscript.log"} or path.suffix == ".stdout":
                  tail = [line[:500] for line in text.splitlines() if line.strip()][-20:]
                  runtime_tails.append(
                      {
                          "path": path.relative_to(root).as_posix(),
                          "tail": tail,
                      }
                  )

          reports = [
              path
              for path in focused
              if path.name == "report.json"
          ]
          report = None
          if len(reports) == 1:
              report = json.loads(reports[0].read_text(encoding="utf-8"))

          trace_analysis = {"status": "unavailable"}
          trace_tools = [path for path in files if path.name == "ror_state_trace"]
          record_traces = [path for path in focused if path.name == "record.rortrace"]
          resume_traces = [path for path in focused if path.name == "resume.rortrace"]
          if len(trace_tools) == len(record_traces) == len(resume_traces) == 1:
              trace_tool = trace_tools[0]
              trace_tool.chmod(trace_tool.stat().st_mode | stat.S_IXUSR)

              def run_trace(arguments: list[str]) -> dict[str, object]:
                  completed = subprocess.run(
                      [str(trace_tool), *arguments],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=60,
                      check=False,
                  )
                  output = completed.stdout.strip()
                  try:
                      parsed: object = json.loads(output)
                  except json.JSONDecodeError:
                      parsed = output[:4000]
                  return {"exit_code": completed.returncode, "output": parsed}

              trace_analysis = {
                  "status": "executed",
                  "record": run_trace(["--inspect", str(record_traces[0])]),
                  "resume": run_trace(["--inspect", str(resume_traces[0])]),
                  "comparison": run_trace(
                      [str(record_traces[0]), str(resume_traces[0])]
                  ),
              }

              def parse_steps(path: Path) -> dict[int, dict[str, object]]:
                  payload = path.read_bytes()
                  records = payload[80:-56]
                  if len(records) % 96 != 0:
                      raise RuntimeError("validated trace record span is not fixed-width")
                  parsed = {}
                  for offset in range(0, len(records), 96):
                      frame = records[offset : offset + 96]
                      step, actor_count, contact_count = struct.unpack_from(
                          "<QII", frame, 8
                      )
                      parsed[step] = {
                          "actor_count": actor_count,
                          "contact_count": contact_count,
                          "state_digest": frame[24:56].hex(),
                          "input_flags": struct.unpack_from("<I", frame, 56)[0],
                          "input_digest": frame[60:92].hex(),
                      }
                  return parsed

              record_steps = parse_steps(record_traces[0])
              resume_steps = parse_steps(resume_traces[0])
              overlapping_steps = sorted(set(record_steps) & set(resume_steps))
              first_divergence = None
              for step in overlapping_steps:
                  if record_steps[step] != resume_steps[step]:
                      first_divergence = {
                          "physics_step": step,
                          "record": record_steps[step],
                          "resume": resume_steps[step],
                      }
                      break
              trace_analysis["overlap_comparison"] = {
                  "overlap_first_step": overlapping_steps[0] if overlapping_steps else None,
                  "overlap_last_step": overlapping_steps[-1] if overlapping_steps else None,
                  "overlap_step_count": len(overlapping_steps),
                  "first_divergence": first_divergence,
              }

          summary = {
              "format": "ror-linux-save-resume-diagnostic-summary-v1",
              "source_run_id": 32786978090,
              "source_artifact_id": 9542869408,
              "source_commit": "6d88c0f957e5e394f606e4a6784c490badec2399",
              "focused_file_count": len(focused),
              "focused_inventory": inventory,
              "terminal_report_present": report is not None,
              "terminal_report": report,
              "d0_marker_lines": d0_lines,
              "fatal_marker_lines": fatal_lines,
              "runtime_tails": runtime_tails,
              "trace_analysis": trace_analysis,
          }
          rendered = json.dumps(summary, indent=2, sort_keys=True)
          print(rendered)
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary_path.write_text(
              "## Pinned Linux save-resume diagnostics\n\n"
              "```json\n" + rendered + "\n```\n",
              encoding="utf-8",
          )
          def emit(title: str, payload: object) -> None:
              annotation = json.dumps(payload, sort_keys=True)
              annotation = annotation.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{annotation}")

          evidence_paths = [
              row
              for row in inventory
              if Path(row["path"]).name == "report.json"
              or Path(row["path"]).suffix in {".rortrace", ".rorinput", ".sav", ".stdout"}
              or Path(row["path"]).name in {"RoR.log", "Angelscript.log"}
          ]
          emit(
              "Linux save-resume artifact shape",
              {
                  "focused_file_count": len(focused),
                  "terminal_report_present": report is not None,
                  "evidence_files": evidence_paths,
              },
          )
          emit("Linux save-resume D0 markers", d0_lines[-40:])
          emit("Linux save-resume fatal markers", fatal_lines[-40:])
          emit("Linux save-resume trace analysis", trace_analysis)
          for runtime_tail in runtime_tails:
              emit("Linux save-resume runtime tail", runtime_tail)
          PY

      - name: Replay last qualified package twice
        shell: bash
        env:
          BASELINE_ROOT: ${{ runner.temp }}/linux-qualified-baseline
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ["BASELINE_ROOT"]).resolve(strict=True)
          executables = [path for path in root.rglob("RoR-Combined") if path.is_file()]
          trace_tools = [path for path in root.rglob("ror_state_trace") if path.is_file()]
          if len(executables) != 1 or len(trace_tools) != 1:
              raise SystemExit(
                  f"baseline package shape differs: executables={executables}, trace_tools={trace_tools}"
              )
          executable = executables[0]
          stage = executable.parent
          trace_tool = trace_tools[0]
          executable.chmod(executable.stat().st_mode | 0o100)
          trace_tool.chmod(trace_tool.stat().st_mode | 0o100)
          environment = os.environ.copy()
          environment["LD_LIBRARY_PATH"] = str(stage / "lib")

          results = []
          for attempt in (1, 2):
              artifact_dir = Path(os.environ["RUNNER_TEMP"]) / f"baseline-replay-{attempt}"
              command = [
                  "xvfb-run",
                  "--auto-servernum",
                  "--server-args=-screen 0 1280x720x24",
                  sys.executable,
                  "tools/run_deterministic_savegame_resume.py",
                  "--executable",
                  str(executable),
                  "--trace-tool",
                  str(trace_tool),
                  "--runtime-content",
                  str(stage / "content"),
                  "--artifact-dir",
                  str(artifact_dir),
                  "--workers",
                  "1",
                  "--timeout",
                  "900",
              ]
              completed = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=1000,
                  check=False,
                  env=environment,
              )
              report_path = artifact_dir / "report.json"
              report = (
                  json.loads(report_path.read_text(encoding="utf-8"))
                  if report_path.is_file()
                  else None
              )
              results.append(
                  {
                      "attempt": attempt,
                      "exit_code": completed.returncode,
                      "output_tail": completed.stdout.splitlines()[-20:],
                      "report_present": report is not None,
                      "final_state_digest": (
                          report.get("final_state_digest") if report is not None else None
                      ),
                  }
              )

          annotation = json.dumps(
              {
                  "source_run_id": 32698175848,
                  "source_artifact_id": 9509986113,
                  "source_commit": "c984fae2d138cc562067cfb5c3c12fd40387d7ab",
                  "results": results,
              },
              sort_keys=True,
          )
          annotation = annotation.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Qualified Linux baseline replay::{annotation}")
          PY
