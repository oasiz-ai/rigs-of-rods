[project]
name = "rorsmith"
version = "0.1.0"
description = "Rigs of Rods material/texture authoring exposed as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2.0",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
rorsmith = "rorsmith.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rorsmith"]
